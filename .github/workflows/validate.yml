name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level1:
    name: Level 1 (loader, parser, policy engine, fuzz)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sbtg-l1-${{ runner.os }}-${{ hashFiles('BOX_REVISION') }}
      - run: ./scripts/validate.sh

  level2:
    name: Level 2 (real box, stub programs)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sbtg-l2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('BOX_REVISION') }}
      - run: ./scripts/e2e.sh
