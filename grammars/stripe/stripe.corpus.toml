# --- independent verifier cases ---
# Written by the verifier from stripe-cli v1.55.10 source (tag v1.55.10, commit cb77887):
# pkg/cmd/root.go, pkg/requests/base.go, pkg/cmd/resource/operation.go, boolean_args.go,
# nested_flags.go, pkg/cmd/listen.go, trigger.go, fixtures.go, config.go, logs/tail.go,
# pkg/config/profile.go::GetAPIKey, pkg/cmd/resources/specs_gen.go.

# A live key with `=` before the words, on a delete that skips the prompt (base.go::confirmCommand).
[[case]]
argv = ["stripe", "--api-key=sk_live_x", "customers", "delete", "cus_1", "--confirm"]
action = "customers_delete"
fields = { api_key = "sk_live_x", confirm = true, customer = "cus_1" }
effects = ["api_key_override", "delete_data", "live_mode", "network", "skip_prompt"]

# operation.go::runOperationCmd returns after the dry-run output, before the prompt and the request.
[[case]]
argv = ["stripe", "customers", "delete", "cus_1", "-c", "--dry-run"]
action = "customers_delete"
fields = { confirm = true, customer = "cus_1", dry_run = true }
effects = ["network", "skip_prompt"]

# base.go::RunRequestsCmd: the raw dry run also returns before MakeRequest.
[[case]]
argv = ["stripe", "delete", "/v1/customers/cus_1", "--dry-run"]
action = "delete"
fields = { dry_run = true, path = "/v1/customers/cus_1" }
effects = ["network", "raw_request"]

# A raw POST can create a refund.
[[case]]
argv = ["stripe", "post", "/v1/refunds", "-d", "charge=ch_1"]
action = "post"
fields = { data = ["charge=ch_1"], path = "/v1/refunds" }
effects = ["move_money", "network", "raw_request", "write_data"]

# `-d` is StringArrayVarP: an attached value in a cluster.
[[case]]
argv = ["stripe", "post", "/v1/refunds", "-dcharge=ch_1", "--dry-run"]
action = "post"
fields = { data = ["charge=ch_1"], dry_run = true, path = "/v1/refunds" }
effects = ["network", "raw_request"]

