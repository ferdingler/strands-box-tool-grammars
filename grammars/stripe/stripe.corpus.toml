# Golden cases for stripe.grammar.toml (Stripe CLI 1.55.10).
#
# Each expectation was written from the CLI's documented behaviour first: `stripe <command> --help`
# at 1.55.10, and the source at tag v1.55.10 (github.com/stripe/stripe-cli). A comment names the
# help page or the source file that each group pins. "help" below means `stripe <words> --help`.

# ------------------------------------------------------------------------------------------------
# Root persistent flags (pkg/cmd/root.go; "Global flags" in every help page). Cobra accepts them
# before, between, and after the command words.
# ------------------------------------------------------------------------------------------------

# `--api-key` before the words replaces the session key. A test key is not live mode.
[[case]]
argv = ["stripe", "--api-key", "sk_test_123", "customers", "list"]
action = "customers_list"
fields = { api_key = "sk_test_123" }
effects = ["api_key_override", "network"]

# A live key after the words, as `--x=v`: an explicit key decides the mode
# (config/profile.go::GetAPIKey returns it before it reads `--live`).
[[case]]
argv = ["stripe", "customers", "list", "--api-key=sk_live_abc"]
action = "customers_list"
fields = { api_key = "sk_live_abc" }
effects = ["api_key_override", "live_mode", "network"]

# A restricted live key between the command words
[[case]]
argv = ["stripe", "customers", "--api-key", "rk_live_abc", "list"]
action = "customers_list"
fields = { api_key = "rk_live_abc" }
effects = ["api_key_override", "live_mode", "network"]

# `-p` (`--project-name`) selects another profile, with a separate and an attached value
[[case]]
argv = ["stripe", "-p", "shop", "customers", "list"]
action = "customers_list"
fields = { project_name = "shop" }
effects = ["network", "select_project"]

[[case]]
argv = ["stripe", "customers", "list", "-pshop"]
action = "customers_list"
fields = { project_name = "shop" }
effects = ["network", "select_project"]

[[case]]
argv = ["stripe", "customers", "list", "--project-name=shop"]
action = "customers_list"
fields = { project_name = "shop" }
effects = ["network", "select_project"]

# `--config` loads another config file, with other keys
[[case]]
argv = ["stripe", "--config", "/tmp/other.toml", "balance", "retrieve"]
action = "balance_retrieve"
fields = { config = "/tmp/other.toml" }
effects = ["network", "override_config"]

# The other global flags add no effect
[[case]]
argv = ["stripe", "--color", "off", "balance", "retrieve", "--log-level", "debug", "--device-name", "ci"]
action = "balance_retrieve"
fields = { color = "off", device_name = "ci", log_level = "debug" }
effects = ["network"]

# A global option given twice is unmodeled
[[case]]
argv = ["stripe", "--api-key", "sk_test_1", "customers", "list", "--api-key", "sk_live_2"]
action = "unmodeled"

# The hidden `--api-base` (root.go, requests/base.go) is not modeled
[[case]]
argv = ["stripe", "--api-base", "http://localhost:12111", "customers", "list"]
action = "unmodeled"

# `--map` prints the command tree instead of running the command; not modeled
[[case]]
argv = ["stripe", "customers", "list", "--map"]
action = "unmodeled"

# Help and the root version flag are not modeled; `-v` on the root is `--version`
[[case]]
argv = ["stripe", "--help"]
action = "unmodeled"

[[case]]
argv = ["stripe", "-v"]
action = "unmodeled"

[[case]]
argv = ["stripe", "customers", "list", "-h"]
action = "unmodeled"

[[case]]
argv = ["stripe"]
action = "unmodeled"

# A prefix of a global long flag is not that flag
[[case]]
argv = ["stripe", "--api", "sk_test_1", "customers", "list"]
action = "unmodeled"

# ------------------------------------------------------------------------------------------------
# listen (help: stripe listen; pkg/cmd/listen.go)
# ------------------------------------------------------------------------------------------------

[[case]]
argv = ["stripe", "listen"]
action = "listen"
effects = ["network"]

# `--forward-to` and `-f` forward events to a URL
[[case]]
argv = ["stripe", "listen", "--forward-to", "localhost:3000/webhook"]
action = "listen"
fields = { forward_to = "localhost:3000/webhook" }
effects = ["forward_events", "network"]

[[case]]
argv = ["stripe", "listen", "-f", "https://example.com/hook", "-c", "localhost:3001/connect"]
action = "listen"
fields = { forward_connect_to = "localhost:3001/connect", forward_to = "https://example.com/hook" }
effects = ["forward_events", "network"]

# `--events` is a string slice: each word is one value, and the flag repeats
[[case]]
argv = ["stripe", "listen", "-e", "charge.captured,customer.created", "--events=invoice.paid"]
action = "listen"
fields = { events = ["charge.captured,customer.created", "invoice.paid"] }
effects = ["network"]

# `--live` receives live events
[[case]]
argv = ["stripe", "listen", "--live", "--format", "JSON", "--events-from", "@accounts"]
action = "listen"
fields = { live = true, format = "JSON", events_from = "@accounts" }
effects = ["live_mode", "network"]

# A short cluster: `-la` is `--latest` and `--use-configured-webhooks`
[[case]]
argv = ["stripe", "listen", "-la"]
action = "listen"
fields = { latest = true, use_configured_webhooks = true }
effects = ["forward_events", "network"]

# The old flag name that the CLI still maps to `--use-configured-webhooks`
[[case]]
argv = ["stripe", "listen", "--load-from-webhooks-api", "-f", "localhost:4242"]
action = "listen"
fields = { forward_to = "localhost:4242", use_configured_webhooks = true }
effects = ["forward_events", "network"]

# `--skip-verify` turns off TLS checks for forwarding
[[case]]
argv = ["stripe", "listen", "-f", "https://localhost:8443", "--skip-verify", "-s", "-H", "X-A: 1", "--headers", "X-B: 2"]
action = "listen"
fields = { forward_to = "https://localhost:8443", headers = ["X-A: 1", "X-B: 2"], skip_update = true, skip_verify = true }
effects = ["forward_events", "insecure_tls", "network"]

[[case]]
argv = ["stripe", "listen", "--print-secret", "--all-snapshot", "--all-thin", "--connect-headers", "K:V"]
action = "listen"
fields = { all_snapshot = true, all_thin = true, connect_headers = ["K:V"], print_secret = true }
effects = ["credentials", "network"]

# A deprecated flag, a prefix, and an operand (listen takes none) are unmodeled
[[case]]
argv = ["stripe", "listen", "--forward-thin-to", "localhost:3000"]
action = "unmodeled"

[[case]]
argv = ["stripe", "listen", "--forward", "localhost:3000"]
action = "unmodeled"

[[case]]
argv = ["stripe", "listen", "now"]
action = "unmodeled"

# ------------------------------------------------------------------------------------------------
# trigger (help: stripe trigger; pkg/cmd/trigger.go) and fixtures (pkg/cmd/fixtures.go)
# ------------------------------------------------------------------------------------------------

# A trigger creates the objects behind the event, payments included
[[case]]
argv = ["stripe", "trigger", "payment_intent.created"]
action = "trigger"
fields = { event = "payment_intent.created" }
effects = ["move_money", "network", "write_data"]

# `--override` is a string array; `--stripe-account` acts on a connected account
[[case]]
argv = ["stripe", "trigger", "--override", "customer:email=a@example.com", "charge.succeeded", "--override", "charge:amount=500", "--stripe-account", "acct_1"]
action = "trigger"
fields = { event = "charge.succeeded", override = ["charge:amount=500", "customer:email=a@example.com"], stripe_account = "acct_1" }
effects = ["connected_account", "move_money", "network", "write_data"]

[[case]]
argv = ["stripe", "trigger", "customer.created", "--add=customer:name=Jo", "--remove", "customer:email", "--skip", "x", "--api-version", "2024-06-20"]
action = "trigger"
fields = { add = ["customer:name=Jo"], api_version = "2024-06-20", event = "customer.created", remove = ["customer:email"], skip = ["x"] }
effects = ["move_money", "network", "write_data"]

# A live key on a trigger is still live: the explicit key wins over the test-mode request
[[case]]
argv = ["stripe", "--api-key", "sk_live_x", "trigger", "refund.created"]
action = "trigger"
fields = { api_key = "sk_live_x", event = "refund.created" }
effects = ["api_key_override", "live_mode", "move_money", "network", "write_data"]

# `--raw` (an inline fixture) and `--edit` (opens an editor) are not modeled
[[case]]
argv = ["stripe", "trigger", "charge.succeeded", "--raw", "{}"]
action = "unmodeled"

[[case]]
argv = ["stripe", "trigger", "charge.succeeded", "--edit"]
action = "unmodeled"

# trigger has no `--live` flag; with no event it only prints help
[[case]]
argv = ["stripe", "trigger", "--live", "charge.succeeded"]
action = "unmodeled"

[[case]]
argv = ["stripe", "trigger"]
action = "unmodeled"

[[case]]
argv = ["stripe", "trigger", "a.b", "c.d"]
action = "unmodeled"

# A fixture file can send any request, and can update `.env`
[[case]]
argv = ["stripe", "fixtures", "seed.json", "--override", "customer:name=Jo"]
action = "fixtures"
fields = { file = "seed.json", override = ["customer:name=Jo"] }
effects = ["delete_data", "move_money", "network", "raw_request", "write_data", "write_files"]

# fixtures takes exactly one file (validators.ExactArgs(1))
[[case]]
argv = ["stripe", "fixtures"]
action = "unmodeled"

[[case]]
argv = ["stripe", "fixtures", "a.json", "b.json"]
action = "unmodeled"

[[case]]
argv = ["stripe", "fixtures", "a.json", "--edit"]
action = "unmodeled"

# ------------------------------------------------------------------------------------------------
# logs tail (help: stripe logs tail; pkg/cmd/logs/tail.go)
# ------------------------------------------------------------------------------------------------

[[case]]
argv = ["stripe", "logs", "tail"]
action = "logs_tail"
effects = ["network"]

[[case]]
argv = ["stripe", "logs", "tail", "--filter-http-method", "POST", "--filter-status-code-type=4XX", "--filter-http-method", "DELETE", "--format", "JSON"]
action = "logs_tail"
fields = { filter_http_method = ["DELETE", "POST"], filter_status_code_type = ["4XX"], format = "JSON" }
effects = ["network"]

# `logs` alone is a group; `logs tail` has no `--live` and no operand
[[case]]
argv = ["stripe", "logs"]
action = "unmodeled"

[[case]]
argv = ["stripe", "logs", "tail", "--live"]
action = "unmodeled"

[[case]]
argv = ["stripe", "logs", "tail", "x"]
action = "unmodeled"

# ------------------------------------------------------------------------------------------------
# get, post, delete (help: stripe get/post/delete; requests/base.go)
# ------------------------------------------------------------------------------------------------

# An object ID or a path
[[case]]
argv = ["stripe", "get", "cus_G6GQwbr1dWXt9O"]
action = "get"
fields = { path = "cus_G6GQwbr1dWXt9O" }
effects = ["network", "raw_request"]

# The help example; `-l50` is an attached short value
[[case]]
argv = ["stripe", "get", "/v1/charges", "--limit", "50"]
action = "get"
fields = { limit = "50", path = "/v1/charges" }
effects = ["network", "raw_request"]

[[case]]
argv = ["stripe", "get", "-l50", "-a", "ch_1", "/v1/charges"]
action = "get"
fields = { limit = "50", path = "/v1/charges", starting_after = "ch_1" }
effects = ["network", "raw_request"]

[[case]]
argv = ["stripe", "get", "--live", "ch_1", "-e", "customer", "--stripe-account", "acct_1"]
action = "get"
fields = { expand = ["customer"], live = true, path = "ch_1", stripe_account = "acct_1" }
effects = ["connected_account", "live_mode", "network", "raw_request"]

# `--` ends the options, so a path that starts with `-` is the operand
[[case]]
argv = ["stripe", "get", "--", "-odd"]
action = "get"
fields = { path = "-odd" }
effects = ["network", "raw_request"]

[[case]]
argv = ["stripe", "get", "a", "b"]
action = "unmodeled"

[[case]]
argv = ["stripe", "get"]
action = "unmodeled"

# post can reach every write endpoint
[[case]]
argv = ["stripe", "post", "/v1/refunds", "-d", "charge=ch_1", "-d", "amount=100"]
action = "post"
fields = { data = ["amount=100", "charge=ch_1"], path = "/v1/refunds" }
effects = ["move_money", "network", "raw_request", "write_data"]

# `--dry-run` prints the request and sends nothing
[[case]]
argv = ["stripe", "post", "/v1/customers", "--dry-run"]
action = "post"
fields = { dry_run = true, path = "/v1/customers" }
effects = ["network", "raw_request"]

# A required value takes the next word even when it looks like a flag: no live mode here
[[case]]
argv = ["stripe", "post", "/v1/customers", "-d", "--live"]
action = "post"
fields = { data = ["--live"], path = "/v1/customers" }
effects = ["move_money", "network", "raw_request", "write_data"]

# `-H` can set any header, the account and the authorization included; not modeled
[[case]]
argv = ["stripe", "post", "-H", "Stripe-Account: acct_1", "/v1/customers"]
action = "unmodeled"

# post and delete have no pagination flags (they are GET-only in requests/base.go)
[[case]]
argv = ["stripe", "post", "/v1/customers", "--limit", "3"]
action = "unmodeled"

[[case]]
argv = ["stripe", "delete", "/v1/customers/cus_1"]
action = "delete"
fields = { path = "/v1/customers/cus_1" }
effects = ["delete_data", "move_money", "network", "raw_request"]

# `-c` skips the "Enter 'yes' to confirm" prompt
[[case]]
argv = ["stripe", "delete", "-c", "/v1/customers/cus_1"]
action = "delete"
fields = { confirm = true, path = "/v1/customers/cus_1" }
effects = ["delete_data", "move_money", "network", "raw_request", "skip_prompt"]

[[case]]
argv = ["stripe", "delete", "/v1/products/prod_1", "--confirm", "--dry-run"]
action = "delete"
fields = { confirm = true, dry_run = true, path = "/v1/products/prod_1" }
effects = ["network", "raw_request", "skip_prompt"]

# A bool flag does not take `=value` in this grammar
[[case]]
argv = ["stripe", "delete", "/v1/products/prod_1", "--dry-run=true"]
action = "unmodeled"

# ------------------------------------------------------------------------------------------------
# Resource commands (help: stripe <resource> <operation>; resource/operation.go). Request
# parameters use the dotted-hyphen spelling the help prints.
# ------------------------------------------------------------------------------------------------

# customers
[[case]]
argv = ["stripe", "customers", "create", "--email", "jo@example.com", "--name=Jo"]
action = "customers_create"
fields = { email = "jo@example.com", name = "Jo" }
effects = ["network", "write_data"]

[[case]]
argv = ["stripe", "customers", "create", "--address.city", "Paris", "--address.postal-code", "75001", "--preferred-locales", "fr", "--preferred-locales", "en"]
action = "customers_create"
fields = { address_city = "Paris", address_postal_code = "75001", preferred_locales = ["en", "fr"] }
effects = ["network", "write_data"]

# The bracket spelling that the CLI maps to `--address.city` is not modeled
[[case]]
argv = ["stripe", "customers", "create", "--address[city]=Paris"]
action = "unmodeled"

# A boolean request parameter: bare or `=value`
[[case]]
argv = ["stripe", "customers", "create", "--validate"]
action = "customers_create"
fields = { validate = "" }
effects = ["network", "write_data"]

[[case]]
argv = ["stripe", "customers", "create", "--validate=false"]
action = "customers_create"
fields = { validate = "false" }
effects = ["network", "write_data"]

# The CLI rewrites `--validate true` to `--validate=true` (resource/boolean_args.go); this grammar
# reads `true` as an operand that create does not take, so the line is unmodeled
[[case]]
argv = ["stripe", "customers", "create", "--validate", "true"]
action = "unmodeled"

# A required value that looks like a flag is still the value
[[case]]
argv = ["stripe", "customers", "create", "--description", "--live"]
action = "customers_create"
fields = { description = "--live" }
effects = ["network", "write_data"]

# An undeclared or abbreviated parameter
[[case]]
argv = ["stripe", "customers", "create", "--emai", "x"]
action = "unmodeled"

[[case]]
argv = ["stripe", "customers", "create", "--metadata", "x"]
action = "unmodeled"

# list has its own integer `--limit`, so it has no `-l` short form
[[case]]
argv = ["stripe", "customers", "list", "--limit", "3", "--email", "jo@example.com"]
action = "customers_list"
fields = { email = "jo@example.com", limit = "3" }
effects = ["network"]

[[case]]
argv = ["stripe", "customers", "list", "-l", "3"]
action = "unmodeled"

# retrieve is a GET with no own `limit`, so requests/base.go adds `-l`/`--limit`
[[case]]
argv = ["stripe", "customers", "retrieve", "cus_1", "-l", "3", "--live", "-e", "subscriptions", "-e", "sources"]
action = "customers_retrieve"
fields = { customer = "cus_1", expand = ["sources", "subscriptions"], limit = "3", live = true }
effects = ["live_mode", "network"]

# `--` before the ID
[[case]]
argv = ["stripe", "customers", "retrieve", "--", "cus_1"]
action = "customers_retrieve"
fields = { customer = "cus_1" }
effects = ["network"]

[[case]]
argv = ["stripe", "customers", "search", "--query", "email:'jo@example.com'"]
action = "customers_search"
fields = { query = "email:'jo@example.com'" }
effects = ["network"]

# Options before the operand, and the account headers
[[case]]
argv = ["stripe", "customers", "update", "--name", "Jo", "cus_1", "--stripe-account", "acct_1"]
action = "customers_update"
fields = { customer = "cus_1", name = "Jo", stripe_account = "acct_1" }
effects = ["connected_account", "network", "write_data"]

[[case]]
argv = ["stripe", "customers", "update", "cus_1", "--stripe-context", "ctx_1", "-i", "key-1"]
action = "customers_update"
fields = { customer = "cus_1", idempotency = "key-1", stripe_context = "ctx_1" }
effects = ["connected_account", "network", "write_data"]

[[case]]
argv = ["stripe", "customers", "delete", "cus_1"]
action = "customers_delete"
fields = { customer = "cus_1" }
effects = ["delete_data", "network"]

# A cluster: `-sc` is `--show-headers` and `--confirm`
[[case]]
argv = ["stripe", "customers", "delete", "-sc", "cus_1"]
action = "customers_delete"
fields = { confirm = true, customer = "cus_1", show_headers = true }
effects = ["delete_data", "network", "skip_prompt"]

# A cluster that ends in a letter that takes a value: `-cv 2024-06-20`
[[case]]
argv = ["stripe", "customers", "delete", "-cv", "2024-06-20", "cus_1"]
action = "customers_delete"
fields = { confirm = true, customer = "cus_1", stripe_version = "2024-06-20" }
effects = ["delete_data", "network", "skip_prompt"]

[[case]]
argv = ["stripe", "customers", "delete", "cus_1", "--dry-run"]
action = "customers_delete"
fields = { customer = "cus_1", dry_run = true }
effects = ["network"]

# `-i=key` is not a value spelling
[[case]]
argv = ["stripe", "customers", "update", "cus_1", "-i=key"]
action = "unmodeled"

# Wrong operand counts (validators.ExactArgs on the URL parameters)
[[case]]
argv = ["stripe", "customers", "delete"]
action = "unmodeled"

[[case]]
argv = ["stripe", "customers", "list", "extra"]
action = "unmodeled"

[[case]]
argv = ["stripe", "customers"]
action = "unmodeled"

# Resource and operation names with `_` cannot be Box command words, so they are unmodeled
[[case]]
argv = ["stripe", "customers", "list_payment_methods", "cus_1"]
action = "unmodeled"

[[case]]
argv = ["stripe", "payment_intents", "create", "--amount", "100", "--currency", "usd"]
action = "unmodeled"

# charges
[[case]]
argv = ["stripe", "charges", "create", "--amount", "2000", "--currency", "usd", "--source", "tok_visa", "--capture=false"]
action = "charges_create"
fields = { amount = "2000", capture = "false", currency = "usd", source = "tok_visa" }
effects = ["move_money", "network", "write_data"]

[[case]]
argv = ["stripe", "charges", "capture", "ch_1", "--amount", "500"]
action = "charges_capture"
fields = { amount = "500", charge = "ch_1" }
effects = ["move_money", "network", "write_data"]

[[case]]
argv = ["stripe", "charges", "list", "--customer", "cus_1"]
action = "charges_list"
fields = { customer = "cus_1" }
effects = ["network"]

[[case]]
argv = ["stripe", "charges", "retrieve", "ch_1"]
action = "charges_retrieve"
fields = { charge = "ch_1" }
effects = ["network"]

[[case]]
argv = ["stripe", "charges", "search", "--query", "amount>999"]
action = "charges_search"
fields = { query = "amount>999" }
effects = ["network"]

[[case]]
argv = ["stripe", "charges", "update", "ch_1", "--description", "x"]
action = "charges_update"
fields = { charge = "ch_1", description = "x" }
effects = ["network", "write_data"]

# refunds: create moves money; `--dry-run` removes the write effects, `--live` stays
[[case]]
argv = ["stripe", "refunds", "create", "--charge", "ch_1", "--amount", "100"]
action = "refunds_create"
fields = { amount = "100", charge = "ch_1" }
effects = ["move_money", "network", "write_data"]

[[case]]
argv = ["stripe", "refunds", "create", "--payment-intent", "pi_1", "--dry-run", "--live"]
action = "refunds_create"
fields = { dry_run = true, live = true, payment_intent = "pi_1" }
effects = ["live_mode", "network"]

# Canceling a pending refund keeps the money in the account, so no `move_money`
[[case]]
argv = ["stripe", "refunds", "cancel", "re_1"]
action = "refunds_cancel"
fields = { refund = "re_1" }
effects = ["network", "write_data"]

[[case]]
argv = ["stripe", "refunds", "list", "--charge", "ch_1", "--starting-after", "re_0"]
action = "refunds_list"
fields = { charge = "ch_1", starting_after = "re_0" }
effects = ["network"]

[[case]]
argv = ["stripe", "refunds", "retrieve", "re_1"]
action = "refunds_retrieve"
fields = { refund = "re_1" }
effects = ["network"]

[[case]]
argv = ["stripe", "refunds", "update", "re_1", "-d", "metadata[order]=6735"]
action = "refunds_update"
fields = { data = ["metadata[order]=6735"], refund = "re_1" }
effects = ["network", "write_data"]

# subscriptions: cancel is an HTTP DELETE, and it can create a final invoice
[[case]]
argv = ["stripe", "subscriptions", "cancel", "sub_1", "-c"]
action = "subscriptions_cancel"
fields = { confirm = true, subscription_exposed_id = "sub_1" }
effects = ["delete_data", "move_money", "network", "skip_prompt"]

[[case]]
argv = ["stripe", "subscriptions", "create", "--customer", "cus_1", "-d", "items[0][price]=price_1", "--trial-period-days", "7"]
action = "subscriptions_create"
fields = { customer = "cus_1", data = ["items[0][price]=price_1"], trial_period_days = "7" }
effects = ["move_money", "network", "write_data"]

[[case]]
argv = ["stripe", "subscriptions", "list", "--status", "active"]
action = "subscriptions_list"
fields = { status = "active" }
effects = ["network"]

[[case]]
argv = ["stripe", "subscriptions", "migrate", "sub_1", "--billing-mode.type", "flexible"]
action = "subscriptions_migrate"
fields = { billing_mode_type = "flexible", subscription = "sub_1" }
effects = ["network", "write_data"]

[[case]]
argv = ["stripe", "subscriptions", "pause", "sub_1", "--type", "subscription"]
action = "subscriptions_pause"
fields = { subscription = "sub_1", type = "subscription" }
effects = ["move_money", "network", "write_data"]

[[case]]
argv = ["stripe", "subscriptions", "resume", "sub_1", "--proration-behavior", "none"]
action = "subscriptions_resume"
fields = { proration_behavior = "none", subscription = "sub_1" }
effects = ["move_money", "network", "write_data"]

[[case]]
argv = ["stripe", "subscriptions", "retrieve", "sub_1"]
action = "subscriptions_retrieve"
fields = { subscription_exposed_id = "sub_1" }
effects = ["network"]

[[case]]
argv = ["stripe", "subscriptions", "search", "--query", "status:'active'"]
action = "subscriptions_search"
fields = { query = "status:'active'" }
effects = ["network"]

[[case]]
