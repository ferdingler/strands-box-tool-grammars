options.live = { flag = ["--live"], adds = ["live_mode"] }
options.show_headers = { flag = ["-s", "--show-headers"] }
options.starting_after = { flag = ["-a", "--starting-after"], value = "required" }
options.stripe_account = { flag = ["--stripe-account"], value = "required", adds = ["connected_account"] }
