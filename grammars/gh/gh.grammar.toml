# auth (status and token only; login, logout, refresh, switch, and setup-git are not modeled)

# gh refreshes an expiring token, or removes a stored one whose refresh token is refused, unless
# `--no-refresh` is given. Here `-t` is `--show-token`, and `--jq` and `--template` have no short
# form.
[shell.auth_status]
usage = "gh auth status [options]"
adds  = ["read_remote", "write_credentials"]
options.active     = { flag = ["-a", "--active"] }
options.hostname   = { flag = ["-h", "--hostname"], value = "required" }
options.jq         = { flag = ["--jq"], value = "required" }
options.json       = { flag = ["--json"], value = "required", repeated = true }
options.no_refresh = { flag = ["--no-refresh"], removes = ["write_credentials"] }
options.show_token = { flag = ["-t", "--show-token"], adds = ["reveal_token"] }
options.template   = { flag = ["--template"], value = "required" }

# Without `--no-refresh`, gh refreshes an expiring token through the GitHub token endpoint
# (src: auth/token/token.go, getTokenWithRefresh).
[shell.auth_token]
usage = "gh auth token [options]"
adds  = ["reveal_token", "write_credentials", "read_remote"]
options.hostname   = { flag = ["-h", "--hostname"], value = "required" }
options.no_refresh = { flag = ["--no-refresh"], removes = ["write_credentials", "read_remote"] }
options.user       = { flag = ["-u", "--user"], value = "required" }

# ---------------------------------------------------------------------------------------------
# api
#
# The method is GET, or POST when a -f, -F, or --input is given and -X is not. gh upper-cases the
# -X value. So -X adds `write_remote` and `delete_remote`, and only an exact GET or HEAD spelling
# (upper or lower case) takes both away, and only an exact POST, PUT, or PATCH spelling takes
# `delete_remote` away. A mixed-case method keeps both, which over-states and never under-states.
# A GraphQL query is a POST with -f, so it is `write_remote` even when it only reads.
# An endpoint with `://` is used as an absolute URL, so it adds `target_override`.
[shell.api]
usage = "gh api [options] <endpoint>"
adds  = ["read_remote"]
options.allow_escape_sequences = { flag = ["--allow-escape-sequences"] }
options.cache     = { flag = ["--cache"], value = "required" }
options.field     = { flag = ["-F", "--field"], value = "required", repeated = true, adds = ["write_remote"], when = [{ like = "*=@*", adds = ["upload_file"] }] }
options.header    = { flag = ["-H", "--header"], value = "required", repeated = true }
options.hostname  = { flag = ["--hostname"], value = "required", adds = ["target_override"] }
options.include   = { flag = ["-i", "--include"] }
options.input     = { flag = ["--input"], value = "required", adds = ["write_remote", "upload_file"] }
options.jq        = { flag = ["-q", "--jq"], value = "required" }
options.method    = { flag = ["-X", "--method"], value = "required", adds = ["write_remote", "delete_remote"], when = [
  { like = "GET", removes = ["write_remote", "delete_remote"] },
  { like = "get", removes = ["write_remote", "delete_remote"] },
  { like = "HEAD", removes = ["write_remote", "delete_remote"] },
  { like = "head", removes = ["write_remote", "delete_remote"] },
  { like = "POST", removes = ["delete_remote"] },
  { like = "post", removes = ["delete_remote"] },
  { like = "PUT", removes = ["delete_remote"] },
  { like = "put", removes = ["delete_remote"] },
  { like = "PATCH", removes = ["delete_remote"] },
  { like = "patch", removes = ["delete_remote"] },
] }
options.paginate  = { flag = ["--paginate"] }
options.preview   = { flag = ["-p", "--preview"], value = "required", repeated = true }
options.raw_field = { flag = ["-f", "--raw-field"], value = "required", repeated = true, adds = ["write_remote"] }
options.silent    = { flag = ["--silent"] }
options.slurp     = { flag = ["--slurp"] }
options.template  = { flag = ["-t", "--template"], value = "required" }
operands.endpoint = { when = [{ like = "*://*", adds = ["target_override"] }] }
