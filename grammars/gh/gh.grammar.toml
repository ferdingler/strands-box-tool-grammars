# Tool grammar for the GitHub CLI.
#
# Project:    GitHub CLI, https://github.com/cli/cli
# Executable: gh (a native Go binary)
# Checked:    gh 2.103.3 (tag v2.103.3, commit 63837fb7), from `gh <command> --help` and the source at
#             that tag (pkg/cmd/**, pkg/cmdutil/repo_override.go, pkg/cmdutil/json_flags.go).
#
# How gh reads a command line (cobra and pflag): flags and operands may interleave after the command
# words; `--flag=v`, `--flag v`, `-fv`, and `-f v` are all accepted; there is no abbreviation of a
# long flag. This grammar accepts those spellings. It makes `-f=v`, `--bool=false`, and a
# single-valued flag given twice `unmodeled`, although gh accepts them.
#
# `-R/--repo` is a persistent flag of each command group that has it. Here it is an option of each
# action, so it is accepted after the command words only. `gh -R x pr list` and `gh pr -R x list`
# work in gh but are `unmodeled` here.
#
# What this grammar cannot see:
# - Environment: GH_REPO (selects the target repository like -R), GH_HOST (the target host),
#   GH_TOKEN / GITHUB_TOKEN / GH_ENTERPRISE_TOKEN (the identity), GH_EDITOR / EDITOR, BROWSER,
#   GH_PAGER / PAGER, GH_CONFIG_DIR, and `GIT_*` variables that git reads.
# - Config files: ~/.config/gh/config.yml and hosts.yml (identity, git_protocol, pager, browser,
#   and aliases).
# - Aliases from config. `gh co` is a config alias (default `co: pr checkout`) that the operator
#   may redefine, even as a shell command, so `co` is not modeled. `pr co` is a built-in alias and
#   is modeled.
# - Child processes that gh starts itself: git (clone, fetch, checkout, push, and the git hooks
#   that those run), the pager, the browser for `--web`, the editor, shell aliases, and gh
#   extensions. Box does not decide them; the effects below name the commands that start them.
# - Prompts. On a terminal some commands with no flags ask questions (for example `repo edit` can
#   change visibility interactively, and `pr review` can approve). The grammar sees only the
#   command line.

format  = 1
version = 1
name    = "gh"
program = "gh"

[effects]
read_remote       = "Reads data from GitHub"
write_remote      = "Creates or changes data on GitHub"
delete_remote     = "Deletes data on GitHub, such as a repository, a release, a tag, a branch, a comment, or a run"
merge             = "Merges a pull request, or turns on auto-merge for it"
admin_bypass      = "Uses administrator rights to merge without meeting branch protection or the merge queue"
approve           = "Approves a pull request"
make_public       = "Makes a repository public, or may do so"
trigger_ci        = "Starts or reruns a GitHub Actions workflow, which runs code with the repository's secrets"
git_push          = "May push local git commits or branches to a remote"
write_local       = "Writes files, git branches, or git remotes on the local machine"
overwrite_local   = "Overwrites or resets existing local files or branches"
git_passthrough   = "Passes extra arguments straight to git, which can make git run other programs"
upload_file       = "Sends the content of a local file to GitHub"
open_browser      = "Opens a web browser"
target_override   = "Names the target repository or host on the command line"
reveal_token      = "Prints a stored authentication token"
publish           = "Publishes a release, which notifies watchers and can trigger release workflows"
write_credentials = "May change the stored gh credentials, such as refreshing an expiring token"

# ---------------------------------------------------------------------------------------------
# pr

[shell.pr_list]
usage   = "gh pr list [options]"
aliases = ["pr ls"]
adds    = ["read_remote"]
options.app      = { flag = ["--app"], value = "required" }
options.assignee = { flag = ["-a", "--assignee"], value = "required" }
options.author   = { flag = ["-A", "--author"], value = "required" }
options.base     = { flag = ["-B", "--base"], value = "required" }
options.draft    = { flag = ["-d", "--draft"] }
options.head     = { flag = ["-H", "--head"], value = "required" }
options.jq       = { flag = ["-q", "--jq"], value = "required" }
options.json     = { flag = ["--json"], value = "required", repeated = true }
options.label    = { flag = ["-l", "--label"], value = "required", repeated = true }
options.limit    = { flag = ["-L", "--limit"], value = "required" }
options.search   = { flag = ["-S", "--search"], value = "required" }
options.state    = { flag = ["-s", "--state"], value = "required" }
options.template = { flag = ["-t", "--template"], value = "required" }
options.web      = { flag = ["-w", "--web"], adds = ["open_browser"] }
options.repo     = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_view]
usage = "gh pr view [options] [<pr>]"
adds  = ["read_remote"]
options.comments = { flag = ["-c", "--comments"] }
options.jq       = { flag = ["-q", "--jq"], value = "required" }
options.json     = { flag = ["--json"], value = "required", repeated = true }
options.template = { flag = ["-t", "--template"], value = "required" }
options.web      = { flag = ["-w", "--web"], adds = ["open_browser"] }
options.repo     = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_diff]
usage = "gh pr diff [options] [<pr>]"
adds  = ["read_remote"]
options.allow_escape_sequences = { flag = ["--allow-escape-sequences"] }
options.color     = { flag = ["--color"], value = "required" }
options.exclude   = { flag = ["-e", "--exclude"], value = "required", repeated = true }
options.name_only = { flag = ["--name-only"] }
options.patch     = { flag = ["--patch"] }
options.web       = { flag = ["-w", "--web"], adds = ["open_browser"] }
options.repo      = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_checks]
usage = "gh pr checks [options] [<pr>]"
adds  = ["read_remote"]
options.fail_fast = { flag = ["--fail-fast"] }
options.interval  = { flag = ["-i", "--interval"], value = "required" }
options.jq        = { flag = ["-q", "--jq"], value = "required" }
options.json      = { flag = ["--json"], value = "required", repeated = true }
options.required  = { flag = ["--required"] }
options.template  = { flag = ["-t", "--template"], value = "required" }
options.watch     = { flag = ["--watch"] }
options.web       = { flag = ["-w", "--web"], adds = ["open_browser"] }
options.repo      = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_status]
usage = "gh pr status [options]"
adds  = ["read_remote"]
options.conflict_status = { flag = ["-c", "--conflict-status"] }
options.jq       = { flag = ["-q", "--jq"], value = "required" }
options.json     = { flag = ["--json"], value = "required", repeated = true }
options.template = { flag = ["-t", "--template"], value = "required" }
options.repo     = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

# `pr co` is a built-in cobra alias. The top-level `gh co` is a config alias and is not modeled.
[shell.pr_checkout]
usage   = "gh pr checkout [options] [<pr>]"
aliases = ["pr co"]
adds    = ["read_remote", "write_local"]
options.branch             = { flag = ["-b", "--branch"], value = "required" }
options.detach             = { flag = ["--detach"] }
options.force              = { flag = ["-f", "--force"], adds = ["overwrite_local"] }
options.recurse_submodules = { flag = ["--recurse-submodules"] }
options.worktree           = { flag = ["--worktree"], value = "required" }
options.repo               = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

# Without `--head`, gh may fork the base repository on GitHub, rename `origin` to `upstream`, add a
# git remote, and push, before it creates the pull request (src: create.go, handlePush). It does
# this also with `--dry-run` and with `--web`, so neither removes `write_remote`. `--head` gives
# skipPushRefs, so handlePush does nothing: no fork, no remote change, no push. `--dry-run` and
# `--web` return before the attachment upload. `--editor` and `--recover` are not modeled.
[shell.pr_create]
usage   = "gh pr create [options]"
aliases = ["pr new"]
adds    = ["write_remote", "git_push", "write_local"]
options.assignee   = { flag = ["-a", "--assignee"], value = "required", repeated = true }
options.attach     = { flag = ["--attach"], value = "required", repeated = true, adds = ["upload_file"] }
options.base       = { flag = ["-B", "--base"], value = "required" }
options.body       = { flag = ["-b", "--body"], value = "required" }
options.body_file  = { flag = ["-F", "--body-file"], value = "required", adds = ["upload_file"] }
options.draft      = { flag = ["-d", "--draft"] }
options.dry_run    = { flag = ["--dry-run"], removes = ["upload_file"] }
options.fill       = { flag = ["-f", "--fill"] }
options.fill_first   = { flag = ["--fill-first"] }
options.fill_verbose = { flag = ["--fill-verbose"] }
options.head       = { flag = ["-H", "--head"], value = "required", removes = ["git_push", "write_local"] }
options.label      = { flag = ["-l", "--label"], value = "required", repeated = true }
options.milestone  = { flag = ["-m", "--milestone"], value = "required" }
options.no_maintainer_edit = { flag = ["--no-maintainer-edit"] }
options.project    = { flag = ["-p", "--project"], value = "required", repeated = true }
options.reviewer   = { flag = ["-r", "--reviewer"], value = "required", repeated = true }
options.template   = { flag = ["-T", "--template"], value = "required" }
options.title      = { flag = ["-t", "--title"], value = "required" }
options.web        = { flag = ["-w", "--web"], adds = ["open_browser"], removes = ["upload_file"] }
options.repo       = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

# `--editor` is not modeled.
[shell.pr_comment]
usage = "gh pr comment [options] [<pr>]"
adds  = ["write_remote"]
options.attach         = { flag = ["--attach"], value = "required", repeated = true, adds = ["upload_file"] }
options.body           = { flag = ["-b", "--body"], value = "required" }
options.body_file      = { flag = ["-F", "--body-file"], value = "required", adds = ["upload_file"] }
options.create_if_none = { flag = ["--create-if-none"] }
options.delete_last    = { flag = ["--delete-last"], adds = ["delete_remote"] }
options.edit_last      = { flag = ["--edit-last"] }
options.web            = { flag = ["-w", "--web"], adds = ["open_browser"], removes = ["write_remote", "upload_file"] }
options.yes            = { flag = ["--yes"] }
options.repo           = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_review]
usage = "gh pr review [options] [<pr>]"
adds  = ["write_remote"]
options.approve         = { flag = ["-a", "--approve"], adds = ["approve"] }
options.body            = { flag = ["-b", "--body"], value = "required" }
options.body_file       = { flag = ["-F", "--body-file"], value = "required", adds = ["upload_file"] }
options.comment         = { flag = ["-c", "--comment"] }
options.request_changes = { flag = ["-r", "--request-changes"] }
options.repo            = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

# `--disable-auto` turns auto-merge off and merges nothing. `--delete-branch` deletes the remote and
# the local branch.
[shell.pr_merge]
usage = "gh pr merge [options] [<pr>]"
adds  = ["write_remote", "merge"]
options.admin             = { flag = ["--admin"], adds = ["admin_bypass"] }
options.author_email      = { flag = ["-A", "--author-email"], value = "required" }
options.auto              = { flag = ["--auto"] }
options.body              = { flag = ["-b", "--body"], value = "required" }
options.body_file         = { flag = ["-F", "--body-file"], value = "required", adds = ["upload_file"] }
options.delete_branch     = { flag = ["-d", "--delete-branch"], adds = ["delete_remote", "write_local"] }
options.disable_auto      = { flag = ["--disable-auto"], removes = ["merge"] }
options.match_head_commit = { flag = ["--match-head-commit"], value = "required" }
options.merge             = { flag = ["-m", "--merge"] }
options.rebase            = { flag = ["-r", "--rebase"] }
options.squash            = { flag = ["-s", "--squash"] }
options.subject           = { flag = ["-t", "--subject"], value = "required" }
options.repo              = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_close]
usage = "gh pr close [options] <pr>"
adds  = ["write_remote"]
options.comment       = { flag = ["-c", "--comment"], value = "required" }
options.delete_branch = { flag = ["-d", "--delete-branch"], adds = ["delete_remote", "write_local"] }
options.repo          = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_reopen]
usage = "gh pr reopen [options] <pr>"
adds  = ["write_remote"]
options.comment = { flag = ["-c", "--comment"], value = "required" }
options.repo    = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_edit]
usage = "gh pr edit [options] [<pr>]"
adds  = ["write_remote"]
options.add_assignee     = { flag = ["--add-assignee"], value = "required", repeated = true }
options.add_label        = { flag = ["--add-label"], value = "required", repeated = true }
options.add_project      = { flag = ["--add-project"], value = "required", repeated = true }
options.add_reviewer     = { flag = ["--add-reviewer"], value = "required", repeated = true }
options.attach           = { flag = ["--attach"], value = "required", repeated = true, adds = ["upload_file"] }
options.base             = { flag = ["-B", "--base"], value = "required" }
options.body             = { flag = ["-b", "--body"], value = "required" }
options.body_file        = { flag = ["-F", "--body-file"], value = "required", adds = ["upload_file"] }
options.milestone        = { flag = ["-m", "--milestone"], value = "required" }
options.remove_assignee  = { flag = ["--remove-assignee"], value = "required", repeated = true }
options.remove_label     = { flag = ["--remove-label"], value = "required", repeated = true }
options.remove_milestone = { flag = ["--remove-milestone"] }
options.remove_project   = { flag = ["--remove-project"], value = "required", repeated = true }
options.remove_reviewer  = { flag = ["--remove-reviewer"], value = "required", repeated = true }
options.title            = { flag = ["-t", "--title"], value = "required" }
options.repo             = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.pr_ready]
usage = "gh pr ready [options] [<pr>]"
adds  = ["write_remote"]
options.undo = { flag = ["--undo"] }
options.repo = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

# ---------------------------------------------------------------------------------------------
# issue

[shell.issue_list]
usage   = "gh issue list [options]"
aliases = ["issue ls"]
adds    = ["read_remote"]
options.app       = { flag = ["--app"], value = "required" }
options.assignee  = { flag = ["-a", "--assignee"], value = "required" }
options.author    = { flag = ["-A", "--author"], value = "required" }
options.jq        = { flag = ["-q", "--jq"], value = "required" }
options.json      = { flag = ["--json"], value = "required", repeated = true }
options.label     = { flag = ["-l", "--label"], value = "required", repeated = true }
options.limit     = { flag = ["-L", "--limit"], value = "required" }
options.mention   = { flag = ["--mention"], value = "required" }
options.milestone = { flag = ["-m", "--milestone"], value = "required" }
options.search    = { flag = ["-S", "--search"], value = "required" }
options.state     = { flag = ["-s", "--state"], value = "required" }
options.template  = { flag = ["-t", "--template"], value = "required" }
options.type      = { flag = ["--type"], value = "required" }
options.web       = { flag = ["-w", "--web"], adds = ["open_browser"] }
options.repo      = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.issue_view]
usage = "gh issue view [options] <issue>"
adds  = ["read_remote"]
options.comments = { flag = ["-c", "--comments"] }
options.jq       = { flag = ["-q", "--jq"], value = "required" }
options.json     = { flag = ["--json"], value = "required", repeated = true }
options.template = { flag = ["-t", "--template"], value = "required" }
options.web      = { flag = ["-w", "--web"], adds = ["open_browser"] }
options.repo     = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.issue_status]
usage = "gh issue status [options]"
adds  = ["read_remote"]
options.jq       = { flag = ["-q", "--jq"], value = "required" }
options.json     = { flag = ["--json"], value = "required", repeated = true }
options.template = { flag = ["-t", "--template"], value = "required" }
options.repo     = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

# `--editor` and `--recover` are not modeled. `--web` opens the new-issue page and creates nothing.
[shell.issue_create]
usage   = "gh issue create [options]"
aliases = ["issue new"]
adds    = ["write_remote"]
options.assignee   = { flag = ["-a", "--assignee"], value = "required", repeated = true }
options.attach     = { flag = ["--attach"], value = "required", repeated = true, adds = ["upload_file"] }
options.blocked_by = { flag = ["--blocked-by"], value = "required", repeated = true }
options.blocking   = { flag = ["--blocking"], value = "required", repeated = true }
options.body       = { flag = ["-b", "--body"], value = "required" }
options.body_file  = { flag = ["-F", "--body-file"], value = "required", adds = ["upload_file"] }
options.label      = { flag = ["-l", "--label"], value = "required", repeated = true }
options.milestone  = { flag = ["-m", "--milestone"], value = "required" }
options.parent     = { flag = ["--parent"], value = "required" }
options.project    = { flag = ["-p", "--project"], value = "required", repeated = true }
options.template   = { flag = ["-T", "--template"], value = "required" }
options.title      = { flag = ["-t", "--title"], value = "required" }
options.type       = { flag = ["--type"], value = "required" }
options.web        = { flag = ["-w", "--web"], adds = ["open_browser"], removes = ["write_remote", "upload_file"] }
options.repo       = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.issue_comment]
usage = "gh issue comment [options] <issue>"
adds  = ["write_remote"]
options.attach         = { flag = ["--attach"], value = "required", repeated = true, adds = ["upload_file"] }
options.body           = { flag = ["-b", "--body"], value = "required" }
options.body_file      = { flag = ["-F", "--body-file"], value = "required", adds = ["upload_file"] }
options.create_if_none = { flag = ["--create-if-none"] }
options.delete_last    = { flag = ["--delete-last"], adds = ["delete_remote"] }
options.edit_last      = { flag = ["--edit-last"] }
options.web            = { flag = ["-w", "--web"], adds = ["open_browser"], removes = ["write_remote", "upload_file"] }
options.yes            = { flag = ["--yes"] }
options.repo           = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.issue_close]
usage = "gh issue close [options] <issue>"
adds  = ["write_remote"]
options.comment      = { flag = ["-c", "--comment"], value = "required" }
options.duplicate_of = { flag = ["--duplicate-of"], value = "required" }
options.reason       = { flag = ["-r", "--reason"], value = "required" }
options.repo         = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.issue_reopen]
usage = "gh issue reopen [options] <issue>"
adds  = ["write_remote"]
options.comment = { flag = ["-c", "--comment"], value = "required" }
options.repo    = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

[shell.issue_edit]
usage = "gh issue edit [options] <issue>..."
adds  = ["write_remote"]
options.add_assignee      = { flag = ["--add-assignee"], value = "required", repeated = true }
options.add_blocked_by    = { flag = ["--add-blocked-by"], value = "required", repeated = true }
options.add_blocking      = { flag = ["--add-blocking"], value = "required", repeated = true }
options.add_label         = { flag = ["--add-label"], value = "required", repeated = true }
options.add_project       = { flag = ["--add-project"], value = "required", repeated = true }
options.add_sub_issue     = { flag = ["--add-sub-issue"], value = "required", repeated = true }
options.attach            = { flag = ["--attach"], value = "required", repeated = true, adds = ["upload_file"] }
options.body              = { flag = ["-b", "--body"], value = "required" }
options.body_file         = { flag = ["-F", "--body-file"], value = "required", adds = ["upload_file"] }
options.milestone         = { flag = ["-m", "--milestone"], value = "required" }
options.parent            = { flag = ["--parent"], value = "required" }
options.remove_assignee   = { flag = ["--remove-assignee"], value = "required", repeated = true }
options.remove_blocked_by = { flag = ["--remove-blocked-by"], value = "required", repeated = true }
options.remove_blocking   = { flag = ["--remove-blocking"], value = "required", repeated = true }
options.remove_label      = { flag = ["--remove-label"], value = "required", repeated = true }
options.remove_milestone  = { flag = ["--remove-milestone"] }
options.remove_parent     = { flag = ["--remove-parent"] }
options.remove_project    = { flag = ["--remove-project"], value = "required", repeated = true }
options.remove_sub_issue  = { flag = ["--remove-sub-issue"], value = "required", repeated = true }
options.remove_type       = { flag = ["--remove-type"] }
options.title             = { flag = ["-t", "--title"], value = "required" }
options.type              = { flag = ["--type"], value = "required" }
options.repo              = { flag = ["-R", "--repo"], value = "required", adds = ["target_override"] }

# ---------------------------------------------------------------------------------------------
# repo (these commands take the repository as an operand and have no -R)

[shell.repo_view]
usage = "gh repo view [options] [<repository>]"
adds  = ["read_remote"]
options.branch   = { flag = ["-b", "--branch"], value = "required" }
options.jq       = { flag = ["-q", "--jq"], value = "required" }
options.json     = { flag = ["--json"], value = "required", repeated = true }
options.template = { flag = ["-t", "--template"], value = "required" }
options.web      = { flag = ["-w", "--web"], adds = ["open_browser"] }

[shell.repo_list]
usage   = "gh repo list [options] [<owner>]"
aliases = ["repo ls"]
adds    = ["read_remote"]
options.archived    = { flag = ["--archived"] }
options.fork        = { flag = ["--fork"] }
options.jq          = { flag = ["-q", "--jq"], value = "required" }
options.json        = { flag = ["--json"], value = "required", repeated = true }
options.language    = { flag = ["-l", "--language"], value = "required" }
options.limit       = { flag = ["-L", "--limit"], value = "required" }
options.no_archived = { flag = ["--no-archived"] }
options.source      = { flag = ["--source"] }
options.template    = { flag = ["-t", "--template"], value = "required" }
options.topic       = { flag = ["--topic"], value = "required", repeated = true }
options.visibility  = { flag = ["--visibility"], value = "required" }

# gh passes every word after <repository> to `git clone`: the directory, and the git flags after
# `--`. A git flag such as `-u <program>` or `-c core.sshCommand=...` makes git run a program.
[shell.repo_clone]
usage = "gh repo clone [options] <repository> [<directory>] [-- <gitflags>...]"
adds  = ["read_remote", "write_local"]
options.no_upstream          = { flag = ["--no-upstream"] }
options.upstream_remote_name = { flag = ["-u", "--upstream-remote-name"], value = "required" }
operands.gitflags            = { adds = ["git_passthrough"] }

# Each of `--public`, `--private`, and `--internal` is needed when gh cannot prompt. `--public` is
# the one that makes the new repository public. `--source` adds a git remote (`origin` unless
# `--remote` names one) to that local repository (src: repo/create/create.go, sourceInit).
[shell.repo_create]
usage   = "gh repo create [options] [<name>]"
aliases = ["repo new"]
adds    = ["write_remote"]
options.add_readme           = { flag = ["--add-readme"] }
options.clone                = { flag = ["-c", "--clone"], adds = ["write_local"] }
options.description          = { flag = ["-d", "--description"], value = "required" }
options.disable_issues       = { flag = ["--disable-issues"] }
options.disable_wiki         = { flag = ["--disable-wiki"] }
options.gitignore            = { flag = ["-g", "--gitignore"], value = "required" }
options.homepage             = { flag = ["-h", "--homepage"], value = "required" }
options.include_all_branches = { flag = ["--include-all-branches"] }
options.internal             = { flag = ["--internal"] }
options.license              = { flag = ["-l", "--license"], value = "required" }
options.private              = { flag = ["--private"] }
options.public               = { flag = ["--public"], adds = ["make_public"] }
options.push                 = { flag = ["--push"], adds = ["git_push"] }
options.remote               = { flag = ["-r", "--remote"], value = "required", adds = ["write_local"] }
options.source               = { flag = ["-s", "--source"], value = "required", adds = ["write_local"] }
