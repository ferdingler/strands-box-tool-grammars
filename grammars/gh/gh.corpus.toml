argv = ["gh", "release", "delete", "v1", "--cleanup-tag", "-y"]
action = "release_delete"
fields = { tag = "v1", cleanup_tag = true, yes = true }
effects = ["delete_remote"]

[[case]]
argv = ["gh", "release", "download", "v1", "-O-", "--clobber"]
action = "release_download"
fields = { tag = "v1", output = "-", clobber = true }
effects = ["read_remote"]

# src: run/rerun, run/cancel (--force), run/delete.
[[case]]
argv = ["gh", "run", "rerun", "123", "--failed", "-d"]
action = "run_rerun"
fields = { run_id = "123", failed = true, debug = true }
effects = ["write_remote", "trigger_ci"]

[[case]]
argv = ["gh", "run", "cancel", "123", "--force"]
action = "run_cancel"
fields = { run_id = "123", force = true }
effects = ["write_remote"]

[[case]]
argv = ["gh", "run", "delete", "123", "-R", "o/r"]
action = "run_delete"
fields = { run_id = "123", repo = "o/r" }
effects = ["delete_remote", "target_override"]

# src: workflow/run/run.go: -F (magic, @file), -f, --json (bool), -r.
[[case]]
argv = ["gh", "workflow", "run", "ci.yml", "-fa=b", "-F", "c=@secrets.txt", "--ref", "main"]
action = "workflow_run"
fields = { workflow = "ci.yml", raw_field = ["a=b"], field = ["c=@secrets.txt"], ref = "main" }
effects = ["write_remote", "trigger_ci", "upload_file"]

[[case]]
argv = ["gh", "workflow", "run", "ci.yml", "--json"]
action = "workflow_run"
fields = { workflow = "ci.yml", json = true }
effects = ["write_remote", "trigger_ci"]

# src: repo/clone/clone.go: args[1:] go to git clone.
[[case]]
argv = ["gh", "repo", "clone", "o/r", "--", "--upload-pack=touch /tmp/x"]
action = "repo_clone"
fields = { repository = "o/r", gitflags = ["--upload-pack=touch /tmp/x"] }
effects = ["read_remote", "write_local", "git_passthrough"]

# gh reads the first word after `--` as the repository and the rest as git flags.
[[case]]
argv = ["gh", "repo", "clone", "--", "o/r", "--upload-pack=x"]
action = "unmodeled"

[[case]]
argv = ["gh", "repo", "clone", "o/r", "--depth", "1"]
action = "unmodeled"

# pr checkout alias `co` (src: pr/checkout/checkout.go Aliases).
[[case]]
argv = ["gh", "pr", "co", "12", "-f"]
action = "pr_checkout"
fields = { pr = "12", force = true }
effects = ["read_remote", "write_local", "overwrite_local"]

[[case]]
argv = ["gh", "pr", "review", "12", "-a", "-b", "lgtm"]
action = "pr_review"
fields = { pr = "12", approve = true, body = "lgtm" }
effects = ["write_remote", "approve"]

[[case]]
argv = ["gh", "pr", "review", "12", "--approve=true"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr", "comment", "12", "--delete-last", "--yes"]
action = "pr_comment"
fields = { pr = "12", delete_last = true, yes = true }
effects = ["write_remote", "delete_remote"]

# src: pr/create/create.go: --head skips the push; alias `new`.
[[case]]
argv = ["gh", "pr", "new", "-H", "feat", "-t", "x", "-b", "y"]
action = "pr_create"
fields = { head = "feat", title = "x", body = "y" }
effects = ["write_remote"]

# A value that looks like a flag is taken by a required option, as pflag does.
[[case]]
argv = ["gh", "pr", "view", "-R", "--web"]
action = "pr_view"
fields = { repo = "--web" }
effects = ["read_remote", "target_override"]

# After `--` a flag-looking word is the operand, as cobra does.
[[case]]
argv = ["gh", "pr", "view", "--", "--web"]
action = "pr_view"
fields = { pr = "--web" }
effects = ["read_remote"]

[[case]]
argv = ["gh", "search", "prs", "--repo", "o/r", "-R", "o/s", "fix", "bug"]
action = "search_prs"
fields = { repo_filter = ["o/r", "o/s"], query = ["fix", "bug"] }
effects = ["read_remote"]

[[case]]
argv = ["gh", "auth", "token", "-h", "github.com"]
action = "auth_token"
fields = { hostname = "github.com" }
effects = ["read_remote", "reveal_token", "write_credentials"]

[[case]]
argv = ["gh", "auth", "status", "-t", "--no-refresh"]
action = "auth_status"
fields = { show_token = true, no_refresh = true }
effects = ["read_remote", "reveal_token"]

[[case]]
argv = ["gh", "auth", "token", "--secure-storage"]
action = "unmodeled"

[[case]]
argv = ["gh", "repo", "archive", "o/r", "-y"]
action = "repo_archive"
fields = { repository = "o/r", yes = true }
effects = ["write_remote"]

# A config alias may nest under a group (src: root/root.go, alias/shared/validations.go) but never
# shadow a built-in; an unknown sub-word is unmodeled.
[[case]]
argv = ["gh", "pr", "nuke", "12"]
action = "unmodeled"

[[case]]
argv = ["gh", "issue", "delete", "5", "--yes"]
action = "unmodeled"
