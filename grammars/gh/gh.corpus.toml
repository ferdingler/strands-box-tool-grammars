# Golden cases for gh.grammar.toml (gh 2.103.3).
#
# Each expectation comes from `gh <command> --help` at 2.103.3 (evidence help/*.txt) and the source at
# tag v2.103.3. "help: pr list" means `gh pr list --help`; "src: path" means that file at the tag.
# `fields` lists only values that are not the default.

# ---------------------------------------------------------------------------------------------
# pr list. help: pr list (alias `ls`, flags -a -A -B -d -H -l -L -s -S -w -q -t --json, inherited -R)

[[case]]
argv = ["gh", "pr", "list"]
action = "pr_list"
effects = ["read_remote"]

# The documented alias `pr ls`; `--author "@me"` from the help example
[[case]]
argv = ["gh", "pr", "ls", "--author", "@me"]
action = "pr_list"
fields = { author = "@me" }
effects = ["read_remote"]

# `--label` is a string slice: repeated and collected (help example `--label bug --label "priority 1"`)
[[case]]
argv = ["gh", "pr", "list", "--label", "bug", "-l", "priority 1", "--label=bug"]
action = "pr_list"
fields = { label = ["bug", "priority 1"] }
effects = ["read_remote"]

# `--json` is a string slice; `-q` and `-L` take a value; `-Lvalue` attached
[[case]]
argv = ["gh", "pr", "list", "--json", "number,title", "-q", ".[].number", "-L50"]
action = "pr_list"
fields = { json = ["number,title"], jq = ".[].number", limit = "50" }
effects = ["read_remote"]

# A short cluster: `-dw` is `--draft --web`; `--web` opens a browser
[[case]]
argv = ["gh", "pr", "list", "-dw"]
action = "pr_list"
fields = { draft = true, web = true }
effects = ["open_browser", "read_remote"]

# `-R` names another repository; it is accepted after the command words (inherited flag of `pr`)
[[case]]
argv = ["gh", "pr", "list", "-R", "cli/cli", "--state", "merged"]
action = "pr_list"
fields = { repo = "cli/cli", state = "merged" }
effects = ["read_remote", "target_override"]

[[case]]
argv = ["gh", "pr", "list", "--repo=github.example.com/o/r"]
action = "pr_list"
fields = { repo = "github.example.com/o/r" }
effects = ["read_remote", "target_override"]

# `-R` before the subcommand, or between `pr` and `list`, is not modeled (gh accepts it)
[[case]]
argv = ["gh", "-R", "cli/cli", "pr", "list"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr", "-R", "cli/cli", "list"]
action = "unmodeled"

# `pr list` takes no operand (src: pkg/cmd/pr/list/list.go, NoArgsQuoteReminder)
[[case]]
argv = ["gh", "pr", "list", "open"]
action = "unmodeled"

# A prefix of a long flag is not an abbreviation (pflag has none)
[[case]]
argv = ["gh", "pr", "list", "--lab", "bug"]
action = "unmodeled"

# `--help` is not modeled
[[case]]
argv = ["gh", "pr", "list", "--help"]
action = "unmodeled"

# A single-valued flag given twice: pflag keeps the last, the grammar refuses it
[[case]]
argv = ["gh", "pr", "list", "-s", "open", "-s", "closed"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# pr view, diff, checks, status. help: pr view, pr diff, pr checks, pr status

# An operand after the flags, as a number, URL, or branch (help: pr ARGUMENTS)
[[case]]
argv = ["gh", "pr", "view", "--comments", "123"]
action = "pr_view"
fields = { comments = true, pr = "123" }
effects = ["read_remote"]

[[case]]
argv = ["gh", "pr", "view", "https://github.com/OWNER/REPO/pull/123", "-w"]
action = "pr_view"
fields = { pr = "https://github.com/OWNER/REPO/pull/123", web = true }
effects = ["open_browser", "read_remote"]

# At most one operand (src: pr/view/view.go, MaximumNArgs(1))
[[case]]
argv = ["gh", "pr", "view", "1", "2"]
action = "unmodeled"

# `--exclude` repeats (help example); `--color` takes a value
[[case]]
argv = ["gh", "pr", "diff", "123", "--exclude", "*.yml", "-e", "generated/*", "--color", "never"]
action = "pr_diff"
fields = { pr = "123", exclude = ["*.yml", "generated/*"], color = "never" }
effects = ["read_remote"]

[[case]]
argv = ["gh", "pr", "diff", "--name-only", "--patch"]
action = "pr_diff"
fields = { name_only = true, patch = true }
effects = ["read_remote"]

# `--watch` and `--fail-fast` only read
[[case]]
argv = ["gh", "pr", "checks", "--watch", "--fail-fast", "-i", "5"]
action = "pr_checks"
fields = { watch = true, fail_fast = true, interval = "5" }
effects = ["read_remote"]

[[case]]
argv = ["gh", "pr", "checks", "--watc"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr", "status", "-c", "--json", "number"]
action = "pr_status"
fields = { conflict_status = true, json = ["number"] }
effects = ["read_remote"]

# ---------------------------------------------------------------------------------------------
# pr checkout. help: pr checkout (alias `pr co`). It runs git, which writes local branches.

[[case]]
argv = ["gh", "pr", "checkout", "32"]
action = "pr_checkout"
fields = { pr = "32" }
effects = ["read_remote", "write_local"]

# The built-in alias, and the help example with --branch and --worktree
[[case]]
argv = ["gh", "pr", "co", "32", "--branch", "feature", "--worktree", "/path/to/wt-feature"]
action = "pr_checkout"
fields = { pr = "32", branch = "feature", worktree = "/path/to/wt-feature" }
effects = ["read_remote", "write_local"]

# `--force` resets the existing local branch
[[case]]
argv = ["gh", "pr", "checkout", "-f", "32"]
action = "pr_checkout"
fields = { force = true, pr = "32" }
effects = ["overwrite_local", "read_remote", "write_local"]

# The top-level `gh co` is a config alias that the operator can redefine, so it is not modeled
[[case]]
argv = ["gh", "co", "32"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# pr create. help: pr create (alias `new`). src: pkg/cmd/pr/create/create.go

# A plain create may fork, change local remotes, and push (src: create.go, handlePush)
[[case]]
argv = ["gh", "pr", "create", "--title", "The bug is fixed", "--body", "Everything works again"]
action = "pr_create"
fields = { title = "The bug is fixed", body = "Everything works again" }
effects = ["git_push", "write_local", "write_remote"]

# `--head` skips "any forking or pushing behavior" (help; src: skipPushRefs), so `git_push` and
# `write_local` are removed
[[case]]
argv = ["gh", "pr", "new", "--base", "develop", "--head", "monalisa:feature", "--fill"]
action = "pr_create"
fields = { base = "develop", head = "monalisa:feature", fill = true }
effects = ["write_remote"]

# `--dry-run` creates no pull request, but handlePush runs first and may fork the repository on
# GitHub, change local remotes, and push (help: "May still push git changes"; src: create.go)
[[case]]
argv = ["gh", "pr", "create", "--dry-run", "-f"]
action = "pr_create"
fields = { dry_run = true, fill = true }
effects = ["git_push", "write_local", "write_remote"]

# `--dry-run` with `--head` still keeps `write_remote`: the grammar cannot remove an effect only when
# two flags are both given
[[case]]
argv = ["gh", "pr", "create", "--dry-run", "-H", "feat", "-f"]
action = "pr_create"
fields = { dry_run = true, head = "feat", fill = true }
effects = ["write_remote"]

# `--web` runs handlePush, then opens the browser (src: create.go, WebMode branch)
[[case]]
argv = ["gh", "pr", "create", "-w"]
action = "pr_create"
fields = { web = true }
effects = ["git_push", "open_browser", "write_local", "write_remote"]

# `--reviewer` repeats and takes comma lists (help example); `-d` is draft
[[case]]
argv = ["gh", "pr", "create", "-d", "--reviewer", "monalisa,hubot", "--reviewer", "myorg/team-name", "-t", "x", "-b", "y"]
action = "pr_create"
fields = { draft = true, reviewer = ["monalisa,hubot", "myorg/team-name"], title = "x", body = "y" }
effects = ["git_push", "write_local", "write_remote"]

# `--attach` and `--body-file` send local file content
[[case]]
argv = ["gh", "pr", "create", "--attach", "./before.png", "--attach", "./after.png", "-F", "body.md", "-t", "x"]
action = "pr_create"
fields = { attach = ["./after.png", "./before.png"], body_file = "body.md", title = "x" }
effects = ["git_push", "upload_file", "write_local", "write_remote"]

# `--dry-run` returns before the upload (src: create.go, submitPR)
[[case]]
argv = ["gh", "pr", "create", "--dry-run", "--attach", "./a.png", "-t", "x", "-b", "y"]
action = "pr_create"
fields = { dry_run = true, attach = ["./a.png"], title = "x", body = "y" }
effects = ["git_push", "write_local", "write_remote"]

# A required value takes the next word, even one that looks like a flag
[[case]]
argv = ["gh", "pr", "create", "--title", "--web", "-b", "y"]
action = "pr_create"
fields = { title = "--web", body = "y" }
effects = ["git_push", "write_local", "write_remote"]

# `--editor` and `--recover` are not modeled
[[case]]
argv = ["gh", "pr", "create", "--editor"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr", "create", "--recover", "x.json"]
action = "unmodeled"

# `pr create` takes no operand
[[case]]
argv = ["gh", "pr", "create", "main"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# pr comment, review. help: pr comment, pr review

[[case]]
argv = ["gh", "pr", "comment", "123", "--body", "Looks good"]
action = "pr_comment"
fields = { pr = "123", body = "Looks good" }
effects = ["write_remote"]

# `--delete-last` deletes the user's last comment
[[case]]
argv = ["gh", "pr", "comment", "--delete-last", "--yes"]
action = "pr_comment"
fields = { delete_last = true, yes = true }
effects = ["delete_remote", "write_remote"]

# `--web` opens the browser to write the comment
[[case]]
argv = ["gh", "pr", "comment", "-w"]
action = "pr_comment"
fields = { web = true }
effects = ["open_browser"]

[[case]]
argv = ["gh", "pr", "comment", "--edit-last", "--create-if-none", "-F", "-"]
action = "pr_comment"
fields = { edit_last = true, create_if_none = true, body_file = "-" }
effects = ["upload_file", "write_remote"]

[[case]]
argv = ["gh", "pr", "comment", "-e"]
action = "unmodeled"

# `--approve` approves
[[case]]
argv = ["gh", "pr", "review", "--approve"]
action = "pr_review"
fields = { approve = true }
effects = ["approve", "write_remote"]

# A cluster: `-ab x` is `--approve --body x`
[[case]]
argv = ["gh", "pr", "review", "12", "-ab", "ship it"]
action = "pr_review"
fields = { approve = true, body = "ship it", pr = "12" }
effects = ["approve", "write_remote"]

[[case]]
argv = ["gh", "pr", "review", "-r", "-b", "needs tests"]
action = "pr_review"
fields = { request_changes = true, body = "needs tests" }
effects = ["write_remote"]

[[case]]
argv = ["gh", "pr", "review", "--comment", "-b", "note"]
action = "pr_review"
fields = { comment = true, body = "note" }
effects = ["write_remote"]

# ---------------------------------------------------------------------------------------------
# pr merge. help: pr merge

[[case]]
argv = ["gh", "pr", "merge", "123", "--squash"]
action = "pr_merge"
fields = { pr = "123", squash = true }
effects = ["merge", "write_remote"]

# `--admin` bypasses requirements and the merge queue (help)
[[case]]
argv = ["gh", "pr", "merge", "--admin", "-m", "123"]
action = "pr_merge"
fields = { admin = true, merge = true, pr = "123" }
effects = ["admin_bypass", "merge", "write_remote"]

# `--delete-branch` deletes the local and remote branch (help)
[[case]]
argv = ["gh", "pr", "merge", "-rd", "--auto"]
action = "pr_merge"
fields = { rebase = true, delete_branch = true, auto = true }
effects = ["delete_remote", "merge", "write_local", "write_remote"]

# `--disable-auto` turns auto-merge off and merges nothing
[[case]]
argv = ["gh", "pr", "merge", "--disable-auto", "123"]
action = "pr_merge"
fields = { disable_auto = true, pr = "123" }
effects = ["write_remote"]

[[case]]
argv = ["gh", "pr", "merge", "-s", "-t", "subject", "--body=body", "--match-head-commit", "abc123", "-A", "me@example.com"]
action = "pr_merge"
fields = { squash = true, subject = "subject", body = "body", match_head_commit = "abc123", author_email = "me@example.com" }
effects = ["merge", "write_remote"]

# `--admin=true` (a value on a flag) is not modeled
[[case]]
argv = ["gh", "pr", "merge", "--admin=true"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr", "merge", "--adm"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# pr close, reopen, edit, ready. help: pr close (operand required), pr reopen (required), pr edit, pr ready

[[case]]
argv = ["gh", "pr", "close", "123", "-c", "superseded", "--delete-branch"]
action = "pr_close"
fields = { pr = "123", comment = "superseded", delete_branch = true }
effects = ["delete_remote", "write_local", "write_remote"]

[[case]]
argv = ["gh", "pr", "close"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr", "reopen", "patch-1"]
action = "pr_reopen"
fields = { pr = "patch-1" }
effects = ["write_remote"]

[[case]]
argv = ["gh", "pr", "reopen"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr", "edit", "23", "--add-label", "bug", "--add-label", "help wanted", "--remove-reviewer", "monalisa", "--title", "new"]
action = "pr_edit"
fields = { pr = "23", add_label = ["bug", "help wanted"], remove_reviewer = ["monalisa"], title = "new" }
effects = ["write_remote"]

[[case]]
argv = ["gh", "pr", "edit", "--body-file", "b.md", "--remove-milestone"]
action = "pr_edit"
fields = { body_file = "b.md", remove_milestone = true }
effects = ["upload_file", "write_remote"]

[[case]]
argv = ["gh", "pr", "ready", "--undo", "7"]
action = "pr_ready"
fields = { undo = true, pr = "7" }
effects = ["write_remote"]

# Commands of the `pr` group that the grammar does not model
[[case]]
argv = ["gh", "pr", "revert", "7"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr", "update-branch", "7"]
action = "unmodeled"

[[case]]
argv = ["gh", "pr"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# issue. help: issue list (alias ls), view (operand required), status, create (alias new),
# comment, close, reopen, edit (one or more operands)

[[case]]
argv = ["gh", "issue", "ls", "-l", "bug", "--state=all", "--type", "Bug"]
action = "issue_list"
fields = { label = ["bug"], state = "all", type = "Bug" }
effects = ["read_remote"]

[[case]]
argv = ["gh", "issue", "list", "-R", "cli/cli", "--search", "is:open no:assignee"]
action = "issue_list"
fields = { repo = "cli/cli", search = "is:open no:assignee" }
effects = ["read_remote", "target_override"]

[[case]]
argv = ["gh", "issue", "view", "123", "--comments"]
action = "issue_view"
fields = { issue = "123", comments = true }
effects = ["read_remote"]

# `issue view` needs exactly one operand (src: issue/view/view.go, ExactArgs(1))
[[case]]
argv = ["gh", "issue", "view"]
action = "unmodeled"

[[case]]
argv = ["gh", "issue", "status", "--json", "number,title"]
action = "issue_status"
fields = { json = ["number,title"] }
effects = ["read_remote"]

[[case]]
argv = ["gh", "issue", "create", "--title", "I found a bug", "--body", "Nothing works", "-l", "bug", "-a", "@me"]
action = "issue_create"
fields = { title = "I found a bug", body = "Nothing works", label = ["bug"], assignee = ["@me"] }
effects = ["write_remote"]

[[case]]
argv = ["gh", "issue", "new", "--web"]
action = "issue_create"
fields = { web = true }
effects = ["open_browser"]

[[case]]
argv = ["gh", "issue", "create", "-t", "x", "-F", "body.md", "--parent", "12", "--blocked-by", "3", "--blocked-by", "4"]
action = "issue_create"
fields = { title = "x", body_file = "body.md", parent = "12", blocked_by = ["3", "4"] }
effects = ["upload_file", "write_remote"]

[[case]]
argv = ["gh", "issue", "create", "--editor"]
action = "unmodeled"

[[case]]
argv = ["gh", "issue", "comment", "12", "-b", "Hi"]
action = "issue_comment"
fields = { issue = "12", body = "Hi" }
effects = ["write_remote"]

[[case]]
argv = ["gh", "issue", "comment", "12", "--delete-last", "--yes"]
action = "issue_comment"
fields = { issue = "12", delete_last = true, yes = true }
effects = ["delete_remote", "write_remote"]

# `issue comment` needs its operand, unlike `pr comment`
[[case]]
argv = ["gh", "issue", "comment", "-b", "Hi"]
action = "unmodeled"

[[case]]
argv = ["gh", "issue", "close", "12", "-r", "not planned", "-c", "dup"]
action = "issue_close"
fields = { issue = "12", reason = "not planned", comment = "dup" }
effects = ["write_remote"]

[[case]]
argv = ["gh", "issue", "close", "12", "--duplicate-of", "10"]
action = "issue_close"
fields = { issue = "12", duplicate_of = "10" }
effects = ["write_remote"]

[[case]]
argv = ["gh", "issue", "reopen", "12", "--comment", "back"]
action = "issue_reopen"
fields = { issue = "12", comment = "back" }
effects = ["write_remote"]

# `issue edit` takes several issues (help usage `{<numbers> | <urls>}`, src MinimumNArgs(1))
[[case]]
argv = ["gh", "issue", "edit", "23", "34", "--add-label", "help wanted", "--remove-type"]
action = "issue_edit"
fields = { issue = ["23", "34"], add_label = ["help wanted"], remove_type = true }
effects = ["write_remote"]

[[case]]
argv = ["gh", "issue", "edit", "--title", "x"]
action = "unmodeled"

# `issue delete` and `issue transfer` are not modeled
[[case]]
argv = ["gh", "issue", "delete", "12", "--yes"]
action = "unmodeled"

[[case]]
argv = ["gh", "issue", "transfer", "12", "o/r"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# repo. help: repo view, list (alias ls), clone, create (alias new), fork, delete, archive, edit.
# These have no -R.

[[case]]
argv = ["gh", "repo", "view", "cli/cli", "--json", "name,visibility"]
action = "repo_view"
fields = { repository = "cli/cli", json = ["name,visibility"] }
effects = ["read_remote"]

[[case]]
argv = ["gh", "repo", "view", "-R", "cli/cli"]
action = "unmodeled"

[[case]]
argv = ["gh", "repo", "ls", "cli", "--topic", "go", "--topic", "cli", "-L", "5", "--no-archived"]
action = "repo_list"
fields = { owner = "cli", topic = ["cli", "go"], limit = "5", no_archived = true }
effects = ["read_remote"]

[[case]]
argv = ["gh", "repo", "clone", "cli/cli"]
action = "repo_clone"
fields = { repository = "cli/cli" }
effects = ["read_remote", "write_local"]

[[case]]
argv = ["gh", "repo", "clone", "cli/cli", "workspace/cli", "--no-upstream"]
action = "repo_clone"
fields = { repository = "cli/cli", directory = "workspace/cli", no_upstream = true }
effects = ["read_remote", "write_local"]

# Words after `--` go to `git clone` (help: "Pass additional `git clone` flags by listing them after `--`")
[[case]]
argv = ["gh", "repo", "clone", "cli/cli", "--", "--depth=1"]
action = "repo_clone"
fields = { repository = "cli/cli", gitflags = ["--depth=1"] }
effects = ["git_passthrough", "read_remote", "write_local"]

[[case]]
argv = ["gh", "repo", "clone", "cli/cli", "dir", "--", "-u", "evil-program"]
action = "repo_clone"
fields = { repository = "cli/cli", directory = "dir", gitflags = ["-u", "evil-program"] }
effects = ["git_passthrough", "read_remote", "write_local"]

# A git flag before `--` is unknown to gh
[[case]]
argv = ["gh", "repo", "clone", "cli/cli", "--depth", "1"]
action = "unmodeled"

[[case]]
argv = ["gh", "repo", "clone"]
action = "unmodeled"

# `-u` takes a value (the upstream remote name)
[[case]]
argv = ["gh", "repo", "clone", "-u", "@owner", "me/fork"]
action = "repo_clone"
fields = { upstream_remote_name = "@owner", repository = "me/fork" }
effects = ["read_remote", "write_local"]

[[case]]
argv = ["gh", "repo", "create", "my-project", "--private", "--add-readme"]
action = "repo_create"
fields = { name = "my-project", private = true, add_readme = true }
effects = ["write_remote"]

# `--public` makes the new repository public
[[case]]
argv = ["gh", "repo", "new", "my-project", "--public", "--clone"]
action = "repo_create"
fields = { name = "my-project", public = true, clone = true }
effects = ["make_public", "write_local", "write_remote"]

# `--push` with `--source` pushes local commits; `-r` adds a remote; `-h` is --homepage here
[[case]]
argv = ["gh", "repo", "create", "my-project", "--internal", "--source=.", "-r", "upstream", "--push", "-h", "https://example.com"]
action = "repo_create"
fields = { name = "my-project", internal = true, source = ".", remote = "upstream", push = true, homepage = "https://example.com" }
effects = ["git_push", "write_local", "write_remote"]

# `--source` alone adds the remote `origin` to the local repository (src: repo/create/create.go)
[[case]]
argv = ["gh", "repo", "create", "my-project", "--private", "-s", "."]
action = "repo_create"
fields = { name = "my-project", private = true, source = "." }
effects = ["write_local", "write_remote"]

# `--confirm` is a deprecated hidden flag and is not modeled
[[case]]
argv = ["gh", "repo", "create", "x", "--private", "--confirm"]
action = "unmodeled"

[[case]]
argv = ["gh", "repo", "fork", "cli/cli", "--clone", "--default-branch-only"]
action = "repo_fork"
fields = { repository = "cli/cli", clone = true, default_branch_only = true }
effects = ["write_local", "write_remote"]

[[case]]
argv = ["gh", "repo", "fork", "--org", "myorg", "--fork-name", "x"]
action = "repo_fork"
fields = { org = "myorg", fork_name = "x" }
effects = ["write_remote"]

[[case]]
argv = ["gh", "repo", "fork", "cli/cli", "--clone", "--", "--depth=1"]
action = "repo_fork"
fields = { repository = "cli/cli", clone = true, gitflags = ["--depth=1"] }
effects = ["git_passthrough", "write_local", "write_remote"]

[[case]]
argv = ["gh", "repo", "delete", "me/old", "--yes"]
action = "repo_delete"
fields = { repository = "me/old", yes = true }
effects = ["delete_remote"]

# `repo delete` has only the long `--yes`; `-y` is unknown
[[case]]
argv = ["gh", "repo", "delete", "me/old", "-y"]
action = "unmodeled"

[[case]]
argv = ["gh", "repo", "archive", "me/old", "-y"]
action = "repo_archive"
fields = { repository = "me/old", yes = true }
effects = ["write_remote"]

# `--visibility public` makes the repository public (help: repo edit)
[[case]]
argv = ["gh", "repo", "edit", "me/r", "--visibility", "public", "--accept-visibility-change-consequences"]
action = "repo_edit"
fields = { repository = "me/r", visibility = "public", accept_visibility_change_consequences = true }
effects = ["make_public", "write_remote"]

# `private` and `internal` do not
[[case]]
argv = ["gh", "repo", "edit", "--visibility=private", "--accept-visibility-change-consequences"]
action = "repo_edit"
fields = { visibility = "private", accept_visibility_change_consequences = true }
effects = ["write_remote"]

[[case]]
argv = ["gh", "repo", "edit", "--visibility", "internal", "--accept-visibility-change-consequences"]
action = "repo_edit"
fields = { visibility = "internal", accept_visibility_change_consequences = true }
effects = ["write_remote"]

# Any other spelling keeps `make_public`
[[case]]
argv = ["gh", "repo", "edit", "--visibility", "PUBLIC", "--accept-visibility-change-consequences"]
action = "repo_edit"
