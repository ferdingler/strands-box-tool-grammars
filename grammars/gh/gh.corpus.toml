[[case]]
argv = ["gh", "api", "-X", "Get", "repos/me/r"]
action = "api"
fields = { method = "Get", endpoint = "repos/me/r" }
effects = ["delete_remote", "read_remote", "write_remote"]

[[case]]
argv = ["gh", "api", "-X", "PUT", "user/starred/cli/cli"]
action = "api"
fields = { method = "PUT", endpoint = "user/starred/cli/cli" }
effects = ["read_remote", "write_remote"]

