options.field_selector = { flag = ["--field-selector"], value = "required", adds = ["broad_delete"] }
options.filename  = { flag = ["-f", "--filename"], value = "required", repeated = true, adds = ["manifest_input"] }
options.force     = { flag = ["--force"], value = "optional" }
options.grace_period = { flag = ["--grace-period"], value = "required" }
options.ignore_not_found = { flag = ["--ignore-not-found"], value = "optional" }
options.kustomize = { flag = ["-k", "--kustomize"], value = "required", adds = ["manifest_input", "broad_delete"] }
options.now       = { flag = ["--now"], value = "optional" }
options.output    = { flag = ["-o", "--output"], value = "required" }
options.recursive = { flag = ["-R", "--recursive"], adds = ["broad_delete"] }
options.selector  = { flag = ["-l", "--selector"], value = "required", adds = ["broad_delete"] }
options.timeout   = { flag = ["--timeout"], value = "required" }
options.wait      = { flag = ["--wait"], value = "optional" }

