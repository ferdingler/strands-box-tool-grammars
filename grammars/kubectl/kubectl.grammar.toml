# ---------------------------------------------------------------------------------------------
# Containers and this host
# ---------------------------------------------------------------------------------------------

# kubectl exec (POD | TYPE/NAME) -- COMMAND [args...]. kubectl v1.37 refuses a command without
# `--`. The command words are a set, so their order is lost. -f is not modeled.
[shell.exec]
usage = "kubectl [global options] exec [options] <pod> -- <command>..."
adds  = ["run_program"]
options.container = { flag = ["-c", "--container"], value = "required" }
options.pod_running_timeout = { flag = ["--pod-running-timeout"], value = "required" }
options.quiet     = { flag = ["-q", "--quiet"] }
options.stdin     = { flag = ["-i", "--stdin"] }
options.tty       = { flag = ["-t", "--tty"] }

# kubectl port-forward TYPE/NAME [LOCAL_PORT:]REMOTE_PORT...
[shell.port_forward]
usage = "kubectl [global options] port-forward [options] <target> <ports>..."
adds  = ["network_listen"]
options.address = { flag = ["--address"], value = "required", repeated = true, adds = ["listen_address"] }
options.pod_running_timeout = { flag = ["--pod-running-timeout"], value = "required" }

# kubectl cp <file-spec-src> <file-spec-dest>. A spec with `:` names a pod; kubectl runs `tar`
# in that container to copy. From a pod writes local files; to a pod uploads them.
[shell.cp]
usage = "kubectl [global options] cp [options] <file_spec_src> <file_spec_dest>"
adds  = ["run_program"]
options.container   = { flag = ["-c", "--container"], value = "required" }
options.no_preserve = { flag = ["--no-preserve"], value = "optional" }
options.retries     = { flag = ["--retries"], value = "required" }
operands.file_spec_src  = { like = ["*:*"], adds = ["write_local_files"] }
operands.file_spec_dest = { like = ["*:*"], adds = ["upload_files"] }
