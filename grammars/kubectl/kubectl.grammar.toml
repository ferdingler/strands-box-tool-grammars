# kubectl delete ([-f FILENAME] | [-k DIRECTORY] | TYPE [(NAME | -l label | --all)]).
# A Namespace or a CustomResourceDefinition removes every object in it, so it adds `broad_delete`;
# so do -R and -k. A Secret adds `write_secrets`.
# --raw and --interactive (a prompt) are not modeled.
[shell.delete]
usage = "kubectl [global options] delete [options] [<type>] [<name>...]"
adds  = ["cluster_delete"]
options.all       = { flag = ["--all"], value = "optional", like = ["", "true", "True", "TRUE", "t", "T", "1"], adds = ["broad_delete"] }
