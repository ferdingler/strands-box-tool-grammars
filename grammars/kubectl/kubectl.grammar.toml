options.field_manager = { flag = ["--field-manager"], value = "required" }
options.from_env_file = { flag = ["--from-env-file"], value = "required", repeated = true, adds = ["upload_files"] }
options.from_file = { flag = ["--from-file"], value = "required", repeated = true, adds = ["upload_files"] }
options.from_literal = { flag = ["--from-literal"], value = "required", repeated = true }
options.output    = { flag = ["-o", "--output"], value = "required", adds = ["read_secrets"] }
options.save_config = { flag = ["--save-config"], value = "optional" }
options.show_managed_fields = { flag = ["--show-managed-fields"], value = "optional" }
options.template  = { flag = ["--template"], value = "required", adds = ["read_secrets"] }
options.type      = { flag = ["--type"], value = "required" }
options.validate  = { flag = ["--validate"], value = "optional" }

[shell.create_configmap]
