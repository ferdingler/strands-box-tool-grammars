[[case]]
argv = ["kubectl", "create", "-f", "./pod.json"]
action = "create"
fields = { filename = ["./pod.json"] }
effects = ["cluster_write", "manifest_input"]

# --edit opens an editor: not modeled.
[[case]]
argv = ["kubectl", "create", "-f", "registry.yaml", "--edit", "-o", "json"]
action = "unmodeled"

# `kubectl create foo` could be a plugin (kubectl-create-foo): unmodeled.
[[case]]
argv = ["kubectl", "create", "foo"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "create", "namespace", "my-namespace"]
action = "create_namespace"
fields = { name = "my-namespace" }
effects = ["cluster_write"]

[[case]]
argv = ["kubectl", "create", "ns", "dev", "--dry-run=client", "-o", "yaml"]
action = "create_namespace"
fields = { name = "dev", dry_run = "client", output = "yaml" }
effects = []

[[case]]
argv = ["kubectl", "create", "secret", "generic", "my-secret", "--from-literal=key1=supersecret", "--from-literal=key2=topsecret"]
action = "create_secret_generic"
fields = { name = "my-secret", from_literal = ["key1=supersecret", "key2=topsecret"] }
effects = ["cluster_write", "write_secrets"]

[[case]]
argv = ["kubectl", "create", "secret", "generic", "ssh", "--from-file=ssh-privatekey=path/to/id_rsa", "--type", "kubernetes.io/ssh-auth"]
action = "create_secret_generic"
fields = { name = "ssh", from_file = ["ssh-privatekey=path/to/id_rsa"], type = "kubernetes.io/ssh-auth" }
effects = ["cluster_write", "upload_files", "write_secrets"]

# A client dry run removes the write and the upload; a server dry run still sends the data.
[[case]]
argv = ["kubectl", "create", "secret", "generic", "s", "--from-env-file", "a.env", "--dry-run=client", "-o", "yaml"]
action = "create_secret_generic"
fields = { name = "s", from_env_file = ["a.env"], dry_run = "client", output = "yaml" }
effects = []

[[case]]
argv = ["kubectl", "create", "secret", "generic", "s", "--from-file=k=key.pem", "--dry-run=server"]
action = "create_secret_generic"
fields = { name = "s", from_file = ["k=key.pem"], dry_run = "server" }
effects = ["upload_files"]

# Other secret kinds and `create secret` alone are not modeled.
[[case]]
argv = ["kubectl", "create", "secret", "tls", "t", "--cert=c", "--key=k"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "create", "secret", "s"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "create", "configmap", "my-config", "--from-file=path/to/bar"]
action = "create_configmap"
fields = { name = "my-config", from_file = ["path/to/bar"] }
effects = ["cluster_write", "upload_files"]

[[case]]
argv = ["kubectl", "create", "cm", "c", "--from-literal=k=v"]
action = "create_configmap"
fields = { name = "c", from_literal = ["k=v"] }
effects = ["cluster_write"]

[[case]]
argv = ["kubectl", "create", "deployment", "my-dep", "--image=busybox:latest", "--image=nginx", "-r", "3"]
action = "create_deployment"
fields = { name = "my-dep", image = ["busybox:latest", "nginx"], replicas = "3" }
effects = ["cluster_write"]

# `-- date`: the container command is a field after `--`; flags after `--` are command words.
[[case]]
argv = ["kubectl", "create", "deploy", "my-dep", "--image=busybox", "--", "sh", "-c", "date"]
action = "create_deployment"
fields = { name = "my-dep", image = ["busybox"], command = ["-c", "date", "sh"] }
effects = ["cluster_write"]

[[case]]
argv = ["kubectl", "create", "deployment"]
action = "unmodeled"

