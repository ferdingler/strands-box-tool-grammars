# Golden cases for kubectl.grammar.toml, checked against kubectl v1.37.2.
#
# Sources: the `--help` output of each command at v1.37.2 (`kubectl <cmd> --help`,
# `kubectl options`), and the kubectl source at staging tag v0.37.2 (pkg/cmd/...), with
# pflag v1.0.10 and cobra v1.10.2. Each group names the help page or the source file it pins.
# The expected values were written from that behaviour before the harness ran.

# ---------------------------------------------------------------------------------------------
# get (kubectl get --help)
# ---------------------------------------------------------------------------------------------

# `kubectl get pods`: a list read.
[[case]]
argv = ["kubectl", "get", "pods"]
action = "get"
fields = { type = "pods" }
effects = ["cluster_read"]

# `kubectl get pods -o wide`: `-o v` spelling.
[[case]]
argv = ["kubectl", "get", "pods", "-o", "wide"]
action = "get"
fields = { type = "pods", output = "wide" }
effects = ["cluster_read"]

# `kubectl get -o json pod web-pod-13je7`: an option before the operands, then a name.
[[case]]
argv = ["kubectl", "get", "-o", "json", "pod", "web-pod-13je7"]
action = "get"
fields = { type = "pod", name = ["web-pod-13je7"], output = "json" }
effects = ["cluster_read"]

# `--output=yaml` and the attached short value `-oyaml` (pflag).
[[case]]
argv = ["kubectl", "get", "deploy", "--output=yaml"]
action = "get"
fields = { type = "deploy", output = "yaml" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "get", "deploy", "-oyaml"]
action = "get"
fields = { type = "deploy", output = "yaml" }
effects = ["cluster_read"]

# pflag reads `-o=json` as the value `json`; the contract cannot express it, so it is unmodeled.
[[case]]
argv = ["kubectl", "get", "pods", "-o=json"]
action = "unmodeled"

# `kubectl get rc/web service/frontend pods/web-pod-13je7`: TYPE/NAME words.
[[case]]
argv = ["kubectl", "get", "rc/web", "service/frontend", "pods/web-pod-13je7"]
action = "get"
fields = { type = "rc/web", name = ["pods/web-pod-13je7", "service/frontend"] }
effects = ["cluster_read"]

# `kubectl get pods --all-namespaces` and its short form `-A`.
[[case]]
argv = ["kubectl", "get", "pods", "--all-namespaces"]
action = "get"
fields = { type = "pods", all_namespaces = true }
effects = ["cluster_read"]

# A short cluster: `-Aw` is `-A` and `-w`.
[[case]]
argv = ["kubectl", "get", "pods", "-Aw"]
action = "get"
fields = { type = "pods", all_namespaces = true, watch = true }
effects = ["cluster_read"]

# A cluster that ends in a value flag: `-Ao wide` is `-A` and `-o wide`.
[[case]]
argv = ["kubectl", "get", "pods", "-Ao", "wide"]
action = "get"
fields = { type = "pods", all_namespaces = true, output = "wide" }
effects = ["cluster_read"]

# -A is a boolean with a short form, so `--all-namespaces=true` is unmodeled here.
[[case]]
argv = ["kubectl", "get", "pods", "--all-namespaces=true"]
action = "unmodeled"

# A long-only boolean takes `=false` (pflag), and a bare one is `""`.
[[case]]
argv = ["kubectl", "get", "pods", "--show-labels", "--no-headers=true"]
action = "get"
fields = { type = "pods", show_labels = "", no_headers = "true" }
effects = ["cluster_read"]

# A long-only boolean never takes the next word: `--show-labels pods` is a bare flag and the type.
[[case]]
argv = ["kubectl", "get", "--show-labels", "pods"]
action = "get"
fields = { type = "pods", show_labels = "" }
effects = ["cluster_read"]

# -l selector and a repeated -L (StringSlice).
[[case]]
argv = ["kubectl", "get", "pods", "-l", "app=web", "-L", "tier", "-L", "env"]
action = "get"
fields = { type = "pods", selector = "app=web", label_columns = ["env", "tier"] }
effects = ["cluster_read"]

# A non-repeated option given twice is unmodeled.
[[case]]
argv = ["kubectl", "get", "pods", "-o", "json", "-o", "yaml"]
action = "unmodeled"

# `kubectl get -f pod.yaml -o json`: the target comes from a file.
[[case]]
argv = ["kubectl", "get", "-f", "pod.yaml", "-o", "json"]
action = "get"
fields = { filename = ["pod.yaml"], output = "json" }
effects = ["cluster_read", "manifest_input", "read_secrets"]

# `kubectl get -k dir/`
[[case]]
argv = ["kubectl", "get", "-k", "dir/"]
action = "get"
fields = { kustomize = "dir/" }
effects = ["cluster_read", "manifest_input", "read_secrets"]

# A Secret type reads Secret objects. Spellings: plural, singular, TYPE/NAME, a comma list,
# a grouped name, and upper case (the RESTMapper lowercases the resource).
[[case]]
argv = ["kubectl", "get", "secrets"]
action = "get"
fields = { type = "secrets" }
effects = ["cluster_read", "read_secrets"]

[[case]]
argv = ["kubectl", "get", "secret", "db-pass", "-o", "yaml"]
action = "get"
fields = { type = "secret", name = ["db-pass"], output = "yaml" }
effects = ["cluster_read", "read_secrets"]

[[case]]
argv = ["kubectl", "get", "secret/db-pass", "-o", "jsonpath={.data}"]
action = "get"
fields = { type = "secret/db-pass", output = "jsonpath={.data}" }
effects = ["cluster_read", "read_secrets"]

[[case]]
argv = ["kubectl", "get", "pods,secrets"]
action = "get"
fields = { type = "pods,secrets" }
effects = ["cluster_read", "read_secrets"]

[[case]]
argv = ["kubectl", "get", "secrets.v1."]
action = "get"
fields = { type = "secrets.v1." }
effects = ["cluster_read", "read_secrets"]

[[case]]
argv = ["kubectl", "get", "SeCrEtS"]
action = "get"
fields = { type = "SeCrEtS" }
effects = ["cluster_read", "read_secrets"]

# A Secret in a later TYPE/NAME word.
[[case]]
argv = ["kubectl", "get", "pod/web", "Secret/db-pass"]
action = "get"
fields = { type = "pod/web", name = ["Secret/db-pass"] }
effects = ["cluster_read", "read_secrets"]

# A plain name after a non-Secret type does not add read_secrets.
[[case]]
argv = ["kubectl", "get", "pods", "my-secret-app"]
action = "get"
fields = { type = "pods", name = ["my-secret-app"] }
effects = ["cluster_read"]

# --raw is not modeled.
[[case]]
argv = ["kubectl", "get", "--raw", "/api/v1/namespaces/default/secrets"]
action = "unmodeled"

# No abbreviation: `--selec` is not `--selector`.
[[case]]
argv = ["kubectl", "get", "pods", "--selec", "a=b"]
action = "unmodeled"

# pflag normalizes `_` to `-`; the grammar does not, so the line is unmodeled.
[[case]]
argv = ["kubectl", "get", "pods", "--all_namespaces"]
action = "unmodeled"

# --help is not modeled.
[[case]]
argv = ["kubectl", "get", "--help"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "get", "pods", "-h"]
action = "unmodeled"

# `--` ends options: `-x` after it is a name.
[[case]]
argv = ["kubectl", "get", "pods", "--", "-x"]
action = "get"
fields = { type = "pods", name = ["-x"] }
effects = ["cluster_read"]

# A value that looks like a flag: `--sort-by` takes the next word.
[[case]]
argv = ["kubectl", "get", "pods", "--sort-by", "--x"]
action = "get"
fields = { type = "pods", sort_by = "--x" }
effects = ["cluster_read"]

# Command words are case sensitive (cobra).
[[case]]
argv = ["kubectl", "GET", "pods"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# Persistent flags (kubectl options). Accepted before, between, and after the command words.
# ---------------------------------------------------------------------------------------------

# `-n` before the command word, and after the operands.
[[case]]
argv = ["kubectl", "-n", "kube-system", "get", "pods"]
action = "get"
fields = { namespace = "kube-system", type = "pods" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "get", "pods", "--namespace=backend"]
action = "get"
fields = { namespace = "backend", type = "pods" }
effects = ["cluster_read"]

# The attached short value `-nfoo` (pflag).
[[case]]
argv = ["kubectl", "get", "pods", "-nfoo"]
action = "get"
fields = { namespace = "foo", type = "pods" }
effects = ["cluster_read"]

# `-n=foo` is a pflag spelling the contract cannot express: unmodeled.
[[case]]
argv = ["kubectl", "get", "pods", "-n=foo"]
action = "unmodeled"

# A persistent flag given twice is unmodeled, even once before and once after the words.
[[case]]
argv = ["kubectl", "-n", "a", "get", "pods", "-n", "b"]
action = "unmodeled"

# Between two command words.
[[case]]
argv = ["kubectl", "rollout", "-n", "web", "status", "deploy/api"]
action = "rollout_status"
fields = { namespace = "web", type = "deploy/api" }
effects = ["cluster_read"]

# --context, --kubeconfig, --cluster, --user, and -s/--server change the target.
[[case]]
argv = ["kubectl", "--context", "prod", "get", "pods"]
action = "get"
fields = { context = "prod", type = "pods" }
effects = ["change_target", "cluster_read"]

[[case]]
argv = ["kubectl", "get", "nodes", "--kubeconfig=/tmp/other", "--cluster", "c1", "--user", "u1"]
action = "get"
fields = { kubeconfig = "/tmp/other", cluster = "c1", user = "u1", type = "nodes" }
effects = ["change_target", "cluster_read"]

[[case]]
argv = ["kubectl", "-s", "https://10.0.0.1:6443", "get", "pods"]
action = "get"
fields = { server = "https://10.0.0.1:6443", type = "pods" }
effects = ["change_target", "cluster_read"]

# --as, a repeated --as-group, and --as-uid impersonate.
[[case]]
argv = ["kubectl", "get", "pods", "--as", "jane", "--as-group", "dev", "--as-group=ops"]
action = "get"
fields = { as = "jane", as_group = ["dev", "ops"], type = "pods" }
effects = ["cluster_read", "impersonate"]

[[case]]
argv = ["kubectl", "get", "pods", "--as-uid=1234"]
action = "get"
fields = { as_uid = "1234", type = "pods" }
effects = ["cluster_read", "impersonate"]

# --token, --username, and --password pass a credential.
[[case]]
argv = ["kubectl", "--token", "abc", "get", "pods"]
action = "get"
fields = { token = "abc", type = "pods" }
effects = ["cluster_read", "credentials"]

[[case]]
argv = ["kubectl", "get", "pods", "--username=a", "--password=b"]
action = "get"
fields = { username = "a", password = "b", type = "pods" }
effects = ["cluster_read", "credentials"]

# --insecure-skip-tls-verify is a long-only boolean: bare and `=true` add insecure_tls,
# `=false` does not.
[[case]]
argv = ["kubectl", "get", "pods", "--insecure-skip-tls-verify"]
action = "get"
fields = { insecure_skip_tls_verify = "", type = "pods" }
effects = ["cluster_read", "insecure_tls"]

[[case]]
argv = ["kubectl", "--insecure-skip-tls-verify=true", "get", "pods"]
action = "get"
fields = { insecure_skip_tls_verify = "true", type = "pods" }
effects = ["cluster_read", "insecure_tls"]

[[case]]
argv = ["kubectl", "get", "pods", "--insecure-skip-tls-verify=false"]
action = "get"
fields = { insecure_skip_tls_verify = "false", type = "pods" }
effects = ["cluster_read"]

# -v takes a value; `-v6` is attached, `--v=6` is the long spelling.
[[case]]
argv = ["kubectl", "get", "pods", "-v6", "--request-timeout", "5s"]
action = "get"
fields = { v = "6", request_timeout = "5s", type = "pods" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "--v=9", "--warnings-as-errors", "get", "pods"]
action = "get"
fields = { v = "9", warnings_as_errors = "", type = "pods" }
effects = ["cluster_read"]

# An undeclared persistent flag (--kuberc changes defaults the grammar cannot see).
[[case]]
argv = ["kubectl", "--kuberc", "/tmp/rc", "get", "pods"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "get", "pods", "--client-key", "k.pem"]
action = "unmodeled"

# An action option before the command words is unmodeled.
[[case]]
argv = ["kubectl", "-o", "json", "get", "pods"]
action = "unmodeled"

# The bare program, `kubectl --help`, an unknown command, and a plugin are unmodeled.
[[case]]
argv = ["kubectl"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "--help"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "ctx", "prod"]
action = "unmodeled"

# `kubectl help get` is cobra's help command: not modeled.
[[case]]
argv = ["kubectl", "help", "get"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# describe, logs, explain (each --help page)
# ---------------------------------------------------------------------------------------------

[[case]]
argv = ["kubectl", "describe", "nodes", "kubernetes-node-emt8"]
action = "describe"
fields = { type = "nodes", name = ["kubernetes-node-emt8"] }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "describe", "pods", "-l", "name=myLabel"]
action = "describe"
fields = { type = "pods", selector = "name=myLabel" }
effects = ["cluster_read"]

# describe prints a service-account token in clear (describe.go describeSecret): read_secrets.
[[case]]
argv = ["kubectl", "describe", "secret", "db-pass"]
action = "describe"
fields = { type = "secret", name = ["db-pass"] }
effects = ["cluster_read", "read_secrets"]

[[case]]
argv = ["kubectl", "describe", "-f", "pod.json", "--show-events=false"]
action = "describe"
fields = { filename = ["pod.json"], show_events = "false" }
effects = ["cluster_read", "manifest_input", "read_secrets"]

[[case]]
argv = ["kubectl", "describe", "pods", "-o", "yaml"]
action = "unmodeled"

# logs: `kubectl logs -p -c ruby web-1`, `kubectl logs nginx --all-containers=true`.
[[case]]
argv = ["kubectl", "logs", "-p", "-c", "ruby", "web-1"]
action = "logs"
fields = { previous = true, container_option = "ruby", pod = "web-1" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "logs", "nginx", "--all-containers=true", "--timestamps=true"]
action = "logs"
fields = { pod = "nginx", all_containers = "true", timestamps = "true" }
effects = ["cluster_read"]

# `-fp` cluster, and a positional container (logs.go accepts POD CONTAINER).
[[case]]
argv = ["kubectl", "logs", "-fp", "web-1", "ruby", "--tail=20"]
action = "logs"
fields = { follow = true, previous = true, pod = "web-1", container = "ruby", tail = "20" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "logs", "-l", "app=nginx", "--max-log-requests=10", "--since", "1h"]
action = "logs"
fields = { selector = "app=nginx", max_log_requests = "10", since = "1h" }
effects = ["cluster_read"]

# --insecure-skip-tls-verify-backend skips the kubelet certificate check.
[[case]]
argv = ["kubectl", "logs", "--insecure-skip-tls-verify-backend", "nginx"]
action = "logs"
fields = { insecure_skip_tls_verify_backend = "", pod = "nginx" }
effects = ["cluster_read", "insecure_tls"]

# Three operands: logs.go refuses more than two.
[[case]]
argv = ["kubectl", "logs", "a", "b", "c"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "logs", "nginx", "--follow=true"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "explain", "pods.spec.containers", "--recursive"]
action = "explain"
fields = { type = "pods.spec.containers", recursive = true }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "explain", "deployments", "--api-version=apps/v1", "--max-depth", "2"]
action = "explain"
fields = { type = "deployments", api_version = "apps/v1", max_depth = "2" }
effects = ["cluster_read"]

# explain needs TYPE.
[[case]]
argv = ["kubectl", "explain"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# api-resources, api-versions, version, cluster-info, top, auth
# ---------------------------------------------------------------------------------------------

[[case]]
argv = ["kubectl", "api-resources", "--namespaced=false", "--verbs=list", "--verbs", "get"]
action = "api_resources"
fields = { namespaced = "false", verbs = ["get", "list"] }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "api-resources", "-o", "wide", "--api-group=rbac.authorization.k8s.io"]
action = "api_resources"
fields = { output = "wide", api_group = "rbac.authorization.k8s.io" }
effects = ["cluster_read"]

# api-resources takes no operand (apiresources.go: "unexpected arguments").
[[case]]
argv = ["kubectl", "api-resources", "pods"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "api-versions"]
action = "api_versions"
effects = ["cluster_read"]

# version contacts the server; --client (bare or true) removes that.
[[case]]
argv = ["kubectl", "version"]
action = "version"
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "version", "--client", "-o", "yaml"]
action = "version"
fields = { client = "", output = "yaml" }
effects = []

[[case]]
argv = ["kubectl", "version", "--client=false"]
action = "version"
fields = { client = "false" }
effects = ["cluster_read"]

# `kubectl --version` is not a kubectl flag; it is unmodeled.
[[case]]
argv = ["kubectl", "--version"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "cluster-info"]
action = "cluster_info"
effects = ["cluster_read"]

# `cluster-info dump` is not modeled: the longest match is cluster-info, with a word left over.
[[case]]
argv = ["kubectl", "cluster-info", "dump"]
action = "unmodeled"

# top pod and its aliases `pods` and `po` (top_pod.go); top node and `nodes`, `no` (top_node.go).
[[case]]
argv = ["kubectl", "top", "pod", "web-1", "--containers"]
action = "top_pod"
fields = { name = "web-1", containers = "" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "top", "po", "-A", "--sort-by=cpu"]
action = "top_pod"
fields = { all_namespaces = true, sort_by = "cpu" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "top", "pods", "-l", "name=myLabel"]
action = "top_pod"
fields = { selector = "name=myLabel" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "top", "nodes"]
action = "top_node"
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "top", "no", "node-1", "--show-capacity"]
action = "top_node"
fields = { name = "node-1", show_capacity = "" }
effects = ["cluster_read"]

# `top` alone and an unknown flag for top node (-A is a top pod flag) are unmodeled.
[[case]]
argv = ["kubectl", "top"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "top", "node", "-A"]
action = "unmodeled"

# auth can-i (kubectl auth can-i --help).
[[case]]
argv = ["kubectl", "auth", "can-i", "create", "pods", "--all-namespaces"]
action = "auth_can_i"
fields = { verb = "create", type = "pods", all_namespaces = true }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "auth", "can-i", "list", "pods", "--as=system:serviceaccount:dev:foo", "-n", "prod"]
action = "auth_can_i"
fields = { verb = "list", type = "pods", as = "system:serviceaccount:dev:foo", namespace = "prod" }
effects = ["cluster_read", "impersonate"]

[[case]]
argv = ["kubectl", "auth", "can-i", "--list", "--namespace=foo"]
action = "auth_can_i"
fields = { list = "", namespace = "foo" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "auth", "whoami", "-o", "json"]
action = "auth_whoami"
fields = { output = "json" }
effects = ["cluster_read"]

[[case]]
argv = ["kubectl", "auth", "reconcile", "-f", "rbac.yaml"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# config (kubectl config <cmd> --help; config/view.go, config/use_context.go)
# ---------------------------------------------------------------------------------------------

# config view redacts only datapolicy fields; auth-provider and exec env values print in clear,
# so every config view reads secrets.
[[case]]
argv = ["kubectl", "config", "view", "--minify"]
action = "config_view"
fields = { minify = "" }
effects = ["read_secrets"]

[[case]]
argv = ["kubectl", "config", "view", "--raw"]
action = "config_view"
fields = { raw = "" }
effects = ["read_secrets"]

[[case]]
argv = ["kubectl", "config", "view", "--flatten=true", "-o", "json"]
action = "config_view"
fields = { flatten = "true", output = "json" }
effects = ["read_secrets"]

[[case]]
argv = ["kubectl", "config", "view", "--raw=false"]
action = "config_view"
fields = { raw = "false" }
effects = ["read_secrets"]

# config view takes no operand.
[[case]]
argv = ["kubectl", "config", "view", "extra"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "config", "get-contexts", "my-context", "-o", "name"]
action = "config_get_contexts"
fields = { context_name = "my-context", output = "name" }
effects = []

[[case]]
argv = ["kubectl", "config", "current-context"]
action = "config_current_context"
effects = []

# use-context writes current-context into the kubeconfig; its alias is `use`.
[[case]]
argv = ["kubectl", "config", "use-context", "minikube"]
action = "config_use_context"
fields = { context_name = "minikube" }
effects = ["change_target", "override_config"]

[[case]]
argv = ["kubectl", "config", "use", "prod", "--kubeconfig", "/tmp/k"]
action = "config_use_context"
fields = { context_name = "prod", kubeconfig = "/tmp/k" }
effects = ["change_target", "override_config"]

[[case]]
argv = ["kubectl", "config", "use-context"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "config", "set-context", "--current", "--namespace=x"]
action = "unmodeled"

# ---------------------------------------------------------------------------------------------
# apply (kubectl apply --help; util/helpers.go GetDryRunStrategy and AddDryRunFlag)
# ---------------------------------------------------------------------------------------------

[[case]]
argv = ["kubectl", "apply", "-f", "./pod.json"]
action = "apply"
fields = { filename = ["./pod.json"] }
effects = ["cluster_write", "manifest_input"]

[[case]]
argv = ["kubectl", "apply", "-k", "dir/", "--server-side", "--force-conflicts"]
action = "apply"
fields = { kustomize = "dir/", server_side = "", force_conflicts = "" }
effects = ["cluster_write", "manifest_input"]

# A repeated -f, and the attached short value.
[[case]]
argv = ["kubectl", "apply", "-fa.yaml", "-f", "b.yaml", "--filename=c.yaml"]
action = "apply"
fields = { filename = ["a.yaml", "b.yaml", "c.yaml"] }
effects = ["cluster_write", "manifest_input"]

# --dry-run=client and --dry-run=server remove the write; a bare --dry-run is client.
[[case]]
argv = ["kubectl", "apply", "-f", "x.yaml", "--dry-run=client"]
action = "apply"
fields = { filename = ["x.yaml"], dry_run = "client" }
effects = ["manifest_input"]

[[case]]
argv = ["kubectl", "apply", "--dry-run=server", "-f", "x.yaml"]
action = "apply"
