# delete (kubectl delete --help; delete/delete_flags.go: --cascade has NoOptDefVal "background")
# ---------------------------------------------------------------------------------------------

[[case]]
argv = ["kubectl", "delete", "pod", "foo", "--now"]
action = "delete"
fields = { type = "pod", name = ["foo"], now = "" }
effects = ["cluster_delete"]

[[case]]
argv = ["kubectl", "delete", "pod,service", "baz", "foo"]
action = "delete"
fields = { type = "pod,service", name = ["baz", "foo"] }
effects = ["cluster_delete"]

[[case]]
argv = ["kubectl", "delete", "-f", "./pod.json"]
action = "delete"
fields = { filename = ["./pod.json"] }
effects = ["cluster_delete", "manifest_input"]

# --all, -A, -l, and --field-selector delete many objects.
[[case]]
argv = ["kubectl", "delete", "pods", "--all"]
action = "delete"
fields = { type = "pods", all = "" }
effects = ["broad_delete", "cluster_delete"]

[[case]]
argv = ["kubectl", "delete", "pods", "--all=false", "foo"]
action = "delete"
fields = { type = "pods", all = "false", name = ["foo"] }
effects = ["cluster_delete"]

[[case]]
argv = ["kubectl", "delete", "pods", "--all", "-A"]
action = "delete"
fields = { type = "pods", all = "", all_namespaces = true }
effects = ["broad_delete", "cluster_delete"]

[[case]]
argv = ["kubectl", "delete", "pods,services", "-l", "name=myLabel"]
action = "delete"
fields = { type = "pods,services", selector = "name=myLabel" }
effects = ["broad_delete", "cluster_delete"]

[[case]]
argv = ["kubectl", "delete", "pods", "--field-selector=status.phase=Failed"]
action = "delete"
fields = { type = "pods", field_selector = "status.phase=Failed" }
effects = ["broad_delete", "cluster_delete"]

# --dry-run removes both delete effects.
[[case]]
argv = ["kubectl", "delete", "pods", "--all", "--dry-run=server"]
action = "delete"
fields = { type = "pods", all = "", dry_run = "server" }
effects = []

# `--dry-run server pod x`: pflag reads a bare --dry-run (client), and `server` is the TYPE.
[[case]]
argv = ["kubectl", "delete", "--dry-run", "server", "pod"]
action = "delete"
fields = { dry_run = "", type = "server", name = ["pod"] }
effects = []

# --cascade takes only `=value`; --grace-period takes the next word.
[[case]]
argv = ["kubectl", "delete", "pod", "foo", "--force", "--grace-period", "0", "--cascade=foreground"]
action = "delete"
fields = { type = "pod", name = ["foo"], force = "", grace_period = "0", cascade = "foreground" }
effects = ["cluster_delete"]

# --interactive and --raw are not modeled.
[[case]]
argv = ["kubectl", "delete", "pods", "--all", "--interactive"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "delete", "pods", "--al"]
action = "unmodeled"

