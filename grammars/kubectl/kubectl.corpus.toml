# ---------------------------------------------------------------------------------------------
# exec, port-forward, cp (each --help page; exec/exec.go, cp/cp.go extractFileSpec)
# ---------------------------------------------------------------------------------------------

[[case]]
argv = ["kubectl", "exec", "mypod", "--", "date"]
action = "exec"
fields = { pod = "mypod", command = ["date"] }
effects = ["run_program"]

# `-it` is the cluster `-i -t`; flags after `--` belong to the command.
[[case]]
argv = ["kubectl", "exec", "-it", "mypod", "-c", "ruby-container", "--", "bash", "-il"]
action = "exec"
fields = { stdin = true, tty = true, pod = "mypod", container = "ruby-container", command = ["-il", "bash"] }
effects = ["run_program"]

[[case]]
argv = ["kubectl", "exec", "deploy/mydeployment", "-n", "web", "--", "ls", "-t", "/usr"]
action = "exec"
fields = { pod = "deploy/mydeployment", namespace = "web", command = ["-t", "/usr", "ls"] }
effects = ["run_program"]

# A global option after `--` is a command word, not a kubectl option.
[[case]]
argv = ["kubectl", "exec", "mypod", "--", "env", "--context", "x"]
action = "exec"
fields = { pod = "mypod", command = ["--context", "env", "x"] }
effects = ["run_program"]

# kubectl v1.37 refuses `exec POD COMMAND` without `--` (exec.go).
[[case]]
argv = ["kubectl", "exec", "mypod", "date"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "exec", "mypod", "--"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "exec", "-f", "pod.yaml", "--", "date"]
action = "unmodeled"

[[case]]
argv = ["kubectl", "port-forward", "pod/mypod", "5000", "6000"]
action = "port_forward"
fields = { target = "pod/mypod", ports = ["5000", "6000"] }
effects = ["network_listen"]

[[case]]
argv = ["kubectl", "port-forward", "--address", "0.0.0.0", "pod/mypod", "8888:5000"]
action = "port_forward"
fields = { address = ["0.0.0.0"], target = "pod/mypod", ports = ["8888:5000"] }
effects = ["listen_address", "network_listen"]

[[case]]
argv = ["kubectl", "port-forward", "service/myservice", "8443:https", "--address=localhost", "--address", "10.19.21.23"]
action = "port_forward"
fields = { address = ["10.19.21.23", "localhost"], target = "service/myservice", ports = ["8443:https"] }
effects = ["listen_address", "network_listen"]

[[case]]
argv = ["kubectl", "port-forward", "pod/mypod"]
action = "unmodeled"

# cp to a pod uploads local files; from a pod writes local files. Both run tar in the container.
[[case]]
argv = ["kubectl", "cp", "/tmp/foo", "some-pod:/tmp/bar", "-c", "app"]
action = "cp"
fields = { file_spec_src = "/tmp/foo", file_spec_dest = "some-pod:/tmp/bar", container = "app" }
effects = ["run_program", "upload_files"]

[[case]]
argv = ["kubectl", "cp", "ns1/some-pod:/tmp/foo", "/tmp/bar"]
action = "cp"
fields = { file_spec_src = "ns1/some-pod:/tmp/foo", file_spec_dest = "/tmp/bar" }
effects = ["run_program", "write_local_files"]

[[case]]
argv = ["kubectl", "cp", "--no-preserve=true", "--retries", "3", "a", "p:/b"]
action = "cp"
fields = { no_preserve = "true", retries = "3", file_spec_src = "a", file_spec_dest = "p:/b" }
effects = ["run_program", "upload_files"]

[[case]]
argv = ["kubectl", "cp", "/tmp/foo"]
action = "unmodeled"

