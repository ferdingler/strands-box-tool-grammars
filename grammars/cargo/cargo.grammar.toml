# Tool grammar for Cargo, the Rust package manager.
#
# Project:    Cargo, https://github.com/rust-lang/cargo (shipped with the Rust toolchain)
# Executable: cargo, usually the rustup proxy, which reads `+<toolchain>` and runs that
#             toolchain's cargo. `+<toolchain>` is a usage token here, not an option.
# Checked:    cargo 1.99.1 (5f94df478 2026-08-27), Rust 1.99.1, clippy and rustfmt of that
#             toolchain. Sources: `cargo <cmd> --help` output, `cargo help <cmd>`, and the cargo
#             source at commit 5f94df478 (src/bin/cargo/cli.rs, main.rs, commands/*.rs,
#             src/util/command_prelude.rs).
#
# What this grammar cannot see:
# - Configuration files. `.cargo/config.toml` in the working directory and every parent, and
#   `$CARGO_HOME/config.toml`, can set `build.rustc-wrapper`, `target.<triple>.runner`,
#   `net.offline`, registries, and `[alias]` entries. A config file can make any build run any
#   program. Only `--config` on the command line is visible (effect `override_config`).
# - Environment variables, such as CARGO_NET_OFFLINE, CARGO_TARGET_DIR, RUSTFLAGS,
#   RUSTC_WRAPPER, CARGO_REGISTRY_TOKEN, and BROWSER.
# - User aliases. cargo reads `[alias]` from config before it looks for a built-in alias, so
#   `b`, `c`, `d`, `r`, `t`, and `rm` can mean anything (main.rs `aliased_command`). This
#   grammar does not model them: those lines are `unmodeled`. A config alias cannot replace a
#   built-in command name such as `build` (cli.rs `expand_aliases`).
# - External subcommands. `cargo <x>` runs a `cargo-<x>` program from `$CARGO_HOME/bin` or
#   `PATH`. Only `clippy` and `fmt` are modeled. A config alias can also shadow them.
# - Child processes: build scripts, procedural macros, rustc, rustdoc, rustfmt, clippy-driver,
#   test and bench binaries, the program `cargo run` starts, the browser `doc --open` starts,
#   and the VCS program `new`/`init` can start. Effects name when they can run; what they do
#   is not decided by this grammar.
# - The meaning of a value: a package spec, a feature name, a target triple.
#
# Value spelling: an option that cargo reads as `[<VALUE>]` (`-p`, `--bin`, `--example`,
# `--test`, `--bench`, `--target`, `tree -i`) is `value = "required"` here. Bare, cargo prints
# the choices and exits with an error, and builds nothing. The grammar instead takes the next
# word as the value, even one that starts with `-`. See README.md, Known limits.

format  = 1
version = 1
name    = "cargo"
program = "cargo"

[effects]
network            = "Cargo itself can contact a registry or a git source"
update_lockfile    = "Can create or rewrite Cargo.lock"
run_build_scripts  = "Compiles code, which runs build scripts and procedural macros on this machine"
execute_built_code = "Runs a test, bench, or binary that the build produced"
override_config    = "Changes configuration or the manifest from the command line, which can name programs cargo runs"
edit_manifest      = "Writes dependency changes to Cargo.toml"
write_source       = "Rewrites source files in place"
pass_through_args  = "Passes extra arguments straight to rustfmt or the clippy compiler driver"
create_package     = "Creates a new package, and can add it to the members of a parent workspace"
write_files        = "Writes dependency sources into a vendor directory, and deletes stale crates there"
delete_files       = "Deletes build output"
publish_crate      = "Uploads a package to a registry"
install_binary     = "Installs binaries into the cargo install root"
uninstall_binary   = "Deletes installed binaries from the cargo install root"
open_browser       = "Opens the generated documentation with a browser program"

# cli.rs `cli()`: each of these is `global(true)`, so it may come before or after the command.
# `-C`, `--list`, `--explain`, and `-V` are not global and need no command, so they stay
# undeclared (`unmodeled`).
[global]
options.verbose           = { flag = ["-v", "--verbose"], anywhere = true }
options.quiet             = { flag = ["-q", "--quiet"], anywhere = true }
options.color             = { flag = ["--color"], value = "required", anywhere = true }
options.locked            = { flag = ["--locked"], anywhere = true, removes = ["update_lockfile"] }
options.offline           = { flag = ["--offline"], anywhere = true, removes = ["network"] }
options.frozen            = { flag = ["--frozen"], anywhere = true, removes = ["network", "update_lockfile"] }
options.config            = { flag = ["--config"], value = "required", repeated = true, anywhere = true, adds = ["override_config"] }
options.unstable_features = { flag = ["-Z"], value = "required", repeated = true, anywhere = true, adds = ["override_config"] }


