usage = "cargo [+<toolchain>] clippy [options] [-- <lint_args>...]"
adds  = ["network", "update_lockfile", "run_build_scripts"]
options.fix = { flag = ["--fix"], adds = ["write_source"] }
options.no_deps = { flag = ["--no-deps"] }
options.allow_dirty = { flag = ["--allow-dirty"] }
options.allow_staged = { flag = ["--allow-staged"] }
options.allow_no_vcs = { flag = ["--allow-no-vcs"] }
options.future_incompat_report = { flag = ["--future-incompat-report"] }
options.message_format = { flag = ["--message-format"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.package = { flag = ["-p", "--package"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.workspace = { flag = ["--workspace"] }
options.exclude = { flag = ["--exclude"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.all = { flag = ["--all"] }
options.lib = { flag = ["--lib"] }
options.bins = { flag = ["--bins"] }
options.bin = { flag = ["--bin"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.examples = { flag = ["--examples"] }
options.example = { flag = ["--example"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.tests = { flag = ["--tests"] }
options.test = { flag = ["--test"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.benches = { flag = ["--benches"] }
options.bench = { flag = ["--bench"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.all_targets = { flag = ["--all-targets"] }
options.features = { flag = ["-F", "--features"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.all_features = { flag = ["--all-features"] }
options.no_default_features = { flag = ["--no-default-features"] }
options.release = { flag = ["-r", "--release"] }
options.profile = { flag = ["--profile"], value = "required", when = [{ like = "--fix", adds = ["write_source"] }] }
options.jobs = { flag = ["-j", "--jobs"], value = "required", when = [{ like = "--fix", adds = ["write_source"] }] }
options.keep_going = { flag = ["--keep-going"] }
options.target = { flag = ["--target"], value = "required", repeated = true, when = [{ like = "--fix", adds = ["write_source"] }] }
options.target_dir = { flag = ["--target-dir"], value = "required", when = [{ like = "--fix", adds = ["write_source"] }] }
options.timings = { flag = ["--timings"] }
options.manifest_path = { flag = ["-m", "--manifest-path"], value = "required", adds = ["override_config"], when = [{ like = "--fix", adds = ["write_source"] }] }
options.ignore_rust_version = { flag = ["--ignore-rust-version"] }
options.verbose = { flag = ["-v", "--verbose"] }
options.quiet = { flag = ["-q", "--quiet"] }
options.color = { flag = ["--color"], value = "required", when = [{ like = "--fix", adds = ["write_source"] }] }
options.locked = { flag = ["--locked"], removes = ["update_lockfile"] }
options.offline = { flag = ["--offline"], removes = ["network"] }
options.frozen = { flag = ["--frozen"], removes = ["network", "update_lockfile"] }
options.config = { flag = ["--config"], value = "required", repeated = true, adds = ["override_config"], when = [{ like = "--fix", adds = ["write_source"] }] }
options.unstable_features = { flag = ["-Z"], value = "required", repeated = true, adds = ["override_config"], when = [{ like = "--fix", adds = ["write_source"] }] }
operands.lint_args = { adds = ["pass_through_args"] }

# cargo fmt --help; rust-lang/rust 1.99.1 src/tools/rustfmt/src/cargo-fmt/main.rs (Opts). Its own clap parser, so no cargo global option.
[shell.fmt]
usage = "cargo [+<toolchain>] fmt [options] [-- <rustfmt_options>...]"
adds  = ["write_source"]
options.quiet = { flag = ["-q", "--quiet"] }
options.verbose = { flag = ["-v", "--verbose"] }
options.package = { flag = ["-p", "--package"], value = "many" }
options.manifest_path = { flag = ["--manifest-path"], value = "required", adds = ["override_config"] }
options.message_format = { flag = ["--message-format"], value = "required" }
options.all = { flag = ["--all"] }
options.check = { flag = ["--check"], removes = ["write_source"] }
operands.rustfmt_options = { adds = ["pass_through_args"] }

