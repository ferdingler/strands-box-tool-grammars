# Was EXPECTED-FAIL (F1): install --bin is no longer modeled.
# install --bin is optional_multi_opt (num_args 0..=1), so clap does not take
# `--root` as its value. With crate operands, install.rs passes workspace None to compile_options,
# so check_optional_opts does not run and the install goes on into /r. Verified with cargo 1.98.1
# (same helper): `cargo install --bin --root R --list` lists R. The grammar reads root as absent
# and `/r` as a crate.
