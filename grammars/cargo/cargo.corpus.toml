argv = ["cargo", "install", "--example", "--config", "build.rustc-wrapper=\"/x\"", "foo"]
action = "unmodeled"

# Was EXPECTED-FAIL (F1): install --bin is no longer modeled. Bare --bin hides --git.
[[case]]
argv = ["cargo", "install", "--bin", "--git", "https://example.invalid/x.git", "foo"]
action = "unmodeled"

# clippy --fix (exact word, before `--`) switches cargo-clippy to `cargo fix`.
[[case]]
argv = ["cargo", "clippy", "--fix", "--allow-dirty"]
action = "clippy"
fields = { fix = true, allow_dirty = true }
effects = ["network", "run_build_scripts", "update_lockfile", "write_source"]

# clippy scans raw args, so `--fix` after -p still selects fix mode.
[[case]]
argv = ["cargo", "clippy", "-p", "--fix"]
action = "clippy"
fields = { package = ["--fix"] }
effects = ["ambiguous_argv", "network", "run_build_scripts", "update_lockfile", "write_source"]

# clippy stops its scan at `--`: a later --fix goes to clippy-driver and is not fix mode.
[[case]]
argv = ["cargo", "clippy", "--", "-D", "warnings", "--fix"]
action = "clippy"
fields = { lint_args = ["--fix", "-D", "warnings"] }
effects = ["network", "pass_through_args", "run_build_scripts", "update_lockfile"]

# cargo-clippy forwards --frozen to `cargo check`.
[[case]]
argv = ["cargo", "clippy", "--frozen"]
action = "clippy"
fields = { frozen = true }
effects = ["run_build_scripts"]

# A global option before an external subcommand.
[[case]]
argv = ["cargo", "-q", "clippy"]
action = "unmodeled"

# cargo-fmt: -p is num_args(1..), collects until the next flag.
[[case]]
argv = ["cargo", "fmt", "-p", "a", "b", "--check"]
action = "fmt"
fields = { package = ["a", "b"], check = true }
effects = []

# cargo-fmt has its own clap parser and no --offline.
[[case]]
argv = ["cargo", "fmt", "--offline"]
action = "unmodeled"

# Was EXPECTED-FAIL (verifier F3). cargo-fmt runs `rustfmt <files> ... --check --print-config
# default`; rustfmt determine_operation reads --print-config before --check and File::create's the
# first free argument (a crate source file). So --check does not stop a write. The grammar cannot
# add write_source back over the `--check` removal (a remove always wins; repro remove-unless), so
# the write is carried by pass_through_args, which nothing removes. Expectation changed to that
# reading; the cargo source does not make the verifier's claim wrong, the grammar cannot express it.
[[case]]
argv = ["cargo", "fmt", "--check", "--", "--print-config", "default"]
action = "fmt"
fields = { check = true, rustfmt_options = ["--print-config", "default"] }
effects = ["pass_through_args"]

# Was EXPECTED-FAIL (F2). rustup 1.29.3 proxy_mode.rs: `+<toolchain>` goes to Cfg::local_toolchain,
# which installs a missing toolchain when auto-install is on (the default since 1.28.1). That
# download happens even with --frozen, and before cargo starts, so the word adds install_toolchain,
# which --frozen does not remove.
[[case]]
argv = ["cargo", "+nightly", "--frozen", "fetch"]
action = "fetch"
fields = { frozen = true, toolchain = "nightly" }
effects = ["install_toolchain"]

# clean gc is a hidden nested subcommand; not modeled.
[[case]]
argv = ["cargo", "clean", "gc"]
action = "unmodeled"

# clean -n -p: the dry run still resolves the workspace (resolve_ws with dry_run) but writes nothing.
[[case]]
argv = ["cargo", "clean", "-n", "-p", "foo"]
action = "clean"
fields = { dry_run = true, package = ["foo"] }
effects = ["network"]

# clean --target-dir names the directory that is deleted.
[[case]]
argv = ["cargo", "clean", "--target-dir", "/"]
action = "clean"
fields = { target_dir = "/" }
effects = ["delete_files"]

# metadata --no-deps does not resolve.
[[case]]
argv = ["cargo", "metadata", "--no-deps", "--format-version", "1"]
action = "metadata"
fields = { no_deps = true, format_version = "1" }
effects = []

# update --aggressive is a clap alias of --recursive, not declared.
[[case]]
argv = ["cargo", "update", "--aggressive"]
action = "unmodeled"

# add --git with a dry run.
[[case]]
argv = ["cargo", "add", "-n", "serde", "--git", "https://example.invalid/serde.git"]
action = "add"
fields = { dry_run = true, dep_id = ["serde"], git = "https://example.invalid/serde.git" }
effects = ["network"]

# version accepts the global options after the command word.
[[case]]
argv = ["cargo", "version", "-v"]
action = "version"
fields = { verbose = true }
effects = []

# doc --open adds open_browser.
[[case]]
argv = ["cargo", "doc", "--open", "--no-deps", "--offline", "--locked"]
action = "doc"
fields = { open = true, no_deps = true, offline = true, locked = true }
effects = ["open_browser", "run_build_scripts"]

# vendor -s names another manifest.
[[case]]
argv = ["cargo", "vendor", "-s", "../other/Cargo.toml", "out"]
action = "vendor"
fields = { sync = ["../other/Cargo.toml"], path = "out" }
effects = ["network", "override_config", "update_lockfile", "write_files"]

# --- independent verifier cases, round 2 (against 0349f63) ---
# Sources as in round 1, plus command_prelude.rs `packages_from_flags` (no zero-value check),
# commands/{publish,package,tree,fetch}.rs.

# publish: a bare -p proceeds with the default package; the swallowed --dry-run is cargo's, so the
# real line is a dry run. The grammar keeps publish_crate (safe side) and adds ambiguous_argv.
[[case]]
argv = ["cargo", "publish", "-p", "--dry-run"]
action = "publish"
fields = { package = ["--dry-run"] }
effects = ["ambiguous_argv", "network", "publish_crate", "run_build_scripts", "update_lockfile"]

# publish: a swallowed option that takes a value leaves a word that publish does not take.
[[case]]
argv = ["cargo", "publish", "-p", "--registry", "evil"]
action = "unmodeled"

# publish: --package=--x is a literal value to clap; still flagged.
[[case]]
argv = ["cargo", "publish", "--package=--workspace"]
action = "publish"
fields = { package = ["--workspace"] }
effects = ["ambiguous_argv", "network", "publish_crate", "run_build_scripts", "update_lockfile"]

# package: an attached short value that starts with `-`.
[[case]]
argv = ["cargo", "package", "-p-l"]
action = "package"
fields = { package = ["-l"] }
effects = ["ambiguous_argv", "network", "run_build_scripts", "update_lockfile"]

# test --target followed by an option: ambiguous (cargo bails in `targets()`).
[[case]]
argv = ["cargo", "test", "--target", "--release"]
action = "test"
fields = { target = ["--release"] }
effects = ["ambiguous_argv", "execute_built_code", "network", "run_build_scripts", "update_lockfile"]

# tree: a bare -i at the end has no next word; unmodeled.
[[case]]
argv = ["cargo", "tree", "-p", "foo", "-i"]
action = "unmodeled"

# add --target is a plain opt (required), so no ambiguous_argv.
[[case]]
argv = ["cargo", "add", "--target", "x86_64-unknown-linux-gnu", "libc"]
action = "add"
fields = { target = "x86_64-unknown-linux-gnu", dep_id = ["libc"] }
effects = ["edit_manifest", "network", "update_lockfile"]

# install --bins and --examples stay modeled.
[[case]]
argv = ["cargo", "install", "foo", "--bins", "--examples"]
action = "install"
fields = { crate = ["foo"], bins = true, examples = true }
effects = ["install_binary", "network", "run_build_scripts"]

# install --bin=rg is also unmodeled now.
[[case]]
argv = ["cargo", "install", "--bin=rg", "ripgrep"]
action = "unmodeled"

# Any +toolchain, on any action, adds install_toolchain.
[[case]]
argv = ["cargo", "+stable", "version"]
action = "version"
fields = { toolchain = "stable" }
effects = ["install_toolchain"]

[[case]]
argv = ["cargo", "+nightly", "fmt", "--check"]
action = "fmt"
fields = { check = true, toolchain = "nightly" }
effects = ["install_toolchain"]

# version without a toolchain still reads.
[[case]]
argv = ["cargo", "version"]
action = "version"
effects = []
