# --- independent verifier cases ---
# Written by the verifier from the cargo 1.99.1 source (5f94df478: src/bin/cargo/cli.rs,
# main.rs, commands/*.rs, src/util/command_prelude.rs), rust 1.99.1 src/tools/clippy/src/main.rs,
# src/tools/rustfmt/src/{cargo-fmt,bin}/main.rs, and rustup 1.29.3 src/cli/proxy_mode.rs.
# A case marked "Was EXPECTED-FAIL" failed against 3dfda07 and pins the fix.

# cli.rs: -v (Count), -q, --color are global(true); accepted after the command.
[[case]]
argv = ["cargo", "build", "-vv", "--release", "-q", "--color=never"]
action = "build"
fields = { verbose = true, release = true, quiet = true, color = "never" }
effects = ["network", "run_build_scripts", "update_lockfile"]

# --locked before the command and --offline after it (both global(true)).
[[case]]
argv = ["cargo", "--locked", "check", "--offline"]
action = "check"
fields = { locked = true, offline = true }
effects = ["run_build_scripts"]

# --frozen = --locked + --offline (context/mod.rs offline_flag, locked_flag); --config still adds.
[[case]]
argv = ["cargo", "build", "--frozen", "--config", "net.offline=false"]
action = "build"
fields = { frozen = true, config = ["net.offline=false"] }
effects = ["override_config", "run_build_scripts"]

# --config is multi_opt (Append): `=` and separate forms collect.
[[case]]
argv = ["cargo", "--config=build.rustc-wrapper=\"/x\"", "doc", "--config", "k=1"]
action = "doc"
fields = { config = ["build.rustc-wrapper=\"/x\"", "k=1"] }
effects = ["network", "override_config", "run_build_scripts", "update_lockfile"]

# -Z attached in a cluster after the command.
[[case]]
argv = ["cargo", "check", "-vZunstable-options"]
action = "check"
fields = { verbose = true, unstable_features = ["unstable-options"] }
effects = ["network", "override_config", "run_build_scripts", "update_lockfile"]

# No prefix matching: clap in cargo does not set infer_long_args.
[[case]]
argv = ["cargo", "build", "--relea"]
action = "unmodeled"

# -C is not global and nightly-only.
[[case]]
argv = ["cargo", "-C", "/tmp/other", "build"]
action = "unmodeled"

# build takes no positional; `--` with nothing to fill is left over.
[[case]]
argv = ["cargo", "build", "--", "x"]
action = "unmodeled"

# Built-in aliases: aliased_command reads a user [alias] first, so `c` and `rm` can mean anything.
[[case]]
argv = ["cargo", "c", "--locked"]
action = "unmodeled"

[[case]]
argv = ["cargo", "rm", "serde"]
action = "unmodeled"

# run ARGS is trailing_var_arg: after `--` every word goes to the program, not to cargo.
[[case]]
argv = ["cargo", "run", "--release", "--", "--config", "x=1"]
action = "run"
fields = { release = true, args_list = ["--config", "x=1"] }
effects = ["execute_built_code", "network", "run_build_scripts", "update_lockfile"]

# run: after the first positional, a cargo-looking flag belongs to the program.
[[case]]
argv = ["cargo", "run", "srv", "--config", "x=1"]
action = "run"
fields = { args_list = ["--config", "srv", "x=1"] }
effects = ["execute_built_code", "network", "run_build_scripts", "update_lockfile"]

# run: before the first positional, --config is cargo's own.
