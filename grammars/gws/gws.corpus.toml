action = "drive_files_copy"
fields = { params = '{"fileId":"f1"}', json = '{"parents":["0AsharedDrive"]}' }
effects = ["share_external", "write_data"]

[[case]]
argv = ["gws", "drive", "files", "update", "--params", '{"fileId":"f1","add_parents":"folder1"}']
action = "drive_files_update"
fields = { params = '{"fileId":"f1","add_parents":"folder1"}' }
effects = ["share_external", "write_data"]

