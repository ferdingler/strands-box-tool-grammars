# Calendar
# ==================================================================================================

[[case]]
argv = ["gws", "calendar", "events", "list", "--params", '{"calendarId":"primary","timeMin":"2026-11-11T00:00:00Z"}']
action = "calendar_events_list"
fields = { params = '{"calendarId":"primary","timeMin":"2026-11-11T00:00:00Z"}' }
effects = ["read_data"]

[[case]]
argv = ["gws", "calendar", "events", "get", "--params", '{"calendarId":"primary","eventId":"e1"}']
action = "calendar_events_get"
fields = { params = '{"calendarId":"primary","eventId":"e1"}' }
effects = ["read_data"]

[[case]]
argv = ["gws", "calendar", "events", "instances", "--params", '{"calendarId":"primary","eventId":"e1"}']
action = "calendar_events_instances"
fields = { params = '{"calendarId":"primary","eventId":"e1"}' }
effects = ["read_data"]

# Without sendUpdates the API's default is to send no notification (disc: calendar.events.insert
# sendUpdates, "The default is false"; Google notes some emails might still be sent).
[[case]]
argv = ["gws", "calendar", "events", "insert", "--params", '{"calendarId":"primary"}', "--json", '{"summary":"Review","start":{"date":"2026-11-12"},"end":{"date":"2026-11-13"}}']
action = "calendar_events_insert"
fields = { params = '{"calendarId":"primary"}', json = '{"summary":"Review","start":{"date":"2026-11-12"},"end":{"date":"2026-11-13"}}' }
effects = ["write_data"]

# `sendUpdates` in --params asks Google to email the guests, so `send_email` is added.
[[case]]
argv = ["gws", "calendar", "events", "insert", "--params", '{"calendarId":"primary","sendUpdates":"all"}', "--json", '{"summary":"Review"}']
action = "calendar_events_insert"
fields = { params = '{"calendarId":"primary","sendUpdates":"all"}', json = '{"summary":"Review"}' }
effects = ["send_email", "write_data"]

# Any value of sendUpdates is flagged, `none` too: an over-approximation.
[[case]]
argv = ["gws", "calendar", "events", "patch", "--params", '{"calendarId":"primary","eventId":"e1","sendUpdates":"none"}', "--json", '{"summary":"x"}']
action = "calendar_events_patch"
fields = { params = '{"calendarId":"primary","eventId":"e1","sendUpdates":"none"}', json = '{"summary":"x"}' }
effects = ["send_email", "write_data"]

# The deprecated `sendNotifications` is flagged as well.
[[case]]
argv = ["gws", "calendar", "events", "update", "--params", '{"calendarId":"primary","eventId":"e1","sendNotifications":true}', "--json", '{"summary":"x"}']
action = "calendar_events_update"
fields = { params = '{"calendarId":"primary","eventId":"e1","sendNotifications":true}', json = '{"summary":"x"}' }
effects = ["send_email", "write_data"]

# A `\u` escape could spell the key, so it is flagged.
[[case]]
argv = ["gws", "calendar", "events", "move", "--params", '{"calendarId":"primary","eventId":"e1","destination":"c2","sendUpdates":"all"}']
action = "calendar_events_move"
fields = { params = '{"calendarId":"primary","eventId":"e1","destination":"c2","sendUpdates":"all"}' }
effects = ["send_email", "write_data"]

# events move has no request body.
[[case]]
argv = ["gws", "calendar", "events", "move", "--json", "{}"]
action = "unmodeled"

[[case]]
argv = ["gws", "calendar", "events", "import", "--params", '{"calendarId":"primary"}', "--json", '{"iCalUID":"x@example.com"}']
action = "calendar_events_import"
fields = { params = '{"calendarId":"primary"}', json = '{"iCalUID":"x@example.com"}' }
effects = ["write_data"]

[[case]]
argv = ["gws", "calendar", "events", "delete", "--params", '{"calendarId":"primary","eventId":"e1","sendUpdates":"all"}']
action = "calendar_events_delete"
fields = { params = '{"calendarId":"primary","eventId":"e1","sendUpdates":"all"}' }
effects = ["delete_data", "send_email"]

