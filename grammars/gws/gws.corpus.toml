# V-1: `published`, `publishAuto`, and `publishedOutsideDomain` publish a Docs Editors file to the
# web (disc: drive v3 schemas.Revision). Any letter case of `publish`, or any `\u`, flags it.
[[case]]
argv = ["gws", "drive", "revisions", "update", "--params", '{"fileId":"f1","revisionId":"head"}', "--json", '{"Published":true}']
action = "drive_revisions_update"
fields = { params = '{"fileId":"f1","revisionId":"head"}', json = '{"Published":true}' }
effects = ["make_public", "share_external", "write_data"]

[[case]]
argv = ["gws", "drive", "revisions", "update", "--params", '{"fileId":"f1","revisionId":"head"}', "--json", '{"published_outside_domain":true}']
action = "drive_revisions_update"
fields = { params = '{"fileId":"f1","revisionId":"head"}', json = '{"published_outside_domain":true}' }
effects = ["make_public", "share_external", "write_data"]

[[case]]
argv = ["gws", "drive", "revisions", "update", "--params", '{"fileId":"f1","revisionId":"head"}', "--json", '{"published":true}']
action = "drive_revisions_update"
fields = { params = '{"fileId":"f1","revisionId":"head"}', json = '{"published":true}' }
effects = ["make_public", "share_external", "write_data"]

# The same dry run removes them.
[[case]]
argv = ["gws", "drive", "revisions", "update", "--dry-run", "--params", '{"fileId":"f1","revisionId":"head"}', "--json", '{"published":true}']
action = "drive_revisions_update"
fields = { dry_run = true, params = '{"fileId":"f1","revisionId":"head"}', json = '{"published":true}' }

# V-2: a share with a group also sends the notification email.
[[case]]
argv = ["gws", "drive", "permissions", "create", "--params", '{"fileId":"f1","sendNotificationEmail":false}', "--json", '{"role":"reader","type":"group","emailAddress":"team@example.com"}']
action = "drive_permissions_create"
fields = { params = '{"fileId":"f1","sendNotificationEmail":false}', json = '{"role":"reader","type":"group","emailAddress":"team@example.com"}' }
effects = ["send_email", "share_external"]

# V-3: a calendar ACL update notifies by default.
[[case]]
argv = ["gws", "calendar", "acl", "update", "--params", '{"calendarId":"primary","ruleId":"r1"}', "--json", '{"role":"reader","scope":{"type":"user","value":"alex@example.com"}}']
action = "calendar_acl_update"
