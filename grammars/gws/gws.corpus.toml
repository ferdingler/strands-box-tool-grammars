# --- independent verifier cases ---
# Written by the verifier from gws 0.22.5 source (tag v0.22.5: main.rs run/filter_args_for_subcommand,
# commands.rs build_resource_command, executor.rs execute_method) and the Discovery documents
# (drive v3 20261106, gmail v1 20261106, calendar v3 20261109). clap 4.6.0.

# clap accepts `-ov` for a short option with a value.
[[case]]
argv = ["gws", "drive", "files", "get", "--params", '{"fileId":"f1","alt":"media"}', "-oout.bin"]
action = "drive_files_get"
fields = { params = '{"fileId":"f1","alt":"media"}', output = "out.bin" }
effects = ["read_data", "write_local_file"]

# clap also accepts `-o=v`; the grammar refuses an attached `=` value, so the line is unmodeled (safe).
[[case]]
argv = ["gws", "drive", "files", "get", "-o=out.bin"]
action = "unmodeled"

# `--params=<json>` is one clap value.
[[case]]
argv = ["gws", "drive", "files", "delete", '--params={"fileId":"f1"}']
action = "drive_files_delete"
fields = { params = '{"fileId":"f1"}' }
effects = ["delete_data"]

# --dry-run is a clap global; gws accepts it between the command words, the grammar does not.
[[case]]
argv = ["gws", "drive", "--dry-run", "files", "delete", "--params", '{"fileId":"f1"}']
action = "unmodeled"

[[case]]
argv = ["gws", "--dry-run", "drive", "files", "delete", "--params", '{"fileId":"f1"}']
action = "unmodeled"

# --dry-run after the method returns before any request (executor.rs execute_method).
[[case]]
argv = ["gws", "drive", "files", "create", "--upload", "secret.txt", "--json", '{"name":"x"}', "--dry-run"]
action = "drive_files_create"
fields = { upload = "secret.txt", json = '{"name":"x"}', dry_run = true }
effects = []

# A value option takes the next word even when it is `--dry-run`; clap instead errors (value
# required), so nothing runs. The grammar keeps the effect, which is the safe direction.
[[case]]
argv = ["gws", "drive", "files", "delete", "--format", "--dry-run", "--params", '{"fileId":"f1"}']
action = "drive_files_delete"
fields = { format = "--dry-run", params = '{"fileId":"f1"}' }
effects = ["delete_data"]

# --dry-run=true: clap SetTrue takes no value; the grammar refuses it too.
[[case]]
argv = ["gws", "drive", "files", "delete", "--dry-run=true"]
action = "unmodeled"

