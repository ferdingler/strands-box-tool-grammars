effects = ["make_public", "send_email", "share_external"]

# V-4: a file put in a folder gets that folder's audience. `parents` in the create or copy body, or
# `addParents` in update's --params, adds share_external (disc: File.parents,
# drive.files.update addParents).
[[case]]
argv = ["gws", "drive", "files", "create", "--json", '{"name":"a.txt","parents":["folder1"]}', "--upload", "a.txt"]
action = "drive_files_create"
fields = { json = '{"name":"a.txt","parents":["folder1"]}', upload = "a.txt" }
effects = ["share_external", "upload_file", "write_data"]

[[case]]
