options.page_all  = { flag = ["--page-all"] }
options.page_limit = { flag = ["--page-limit"], value = "required" }
options.page_delay = { flag = ["--page-delay"], value = "required" }
options.dry_run   = { flag = ["--dry-run"], removes = ["read_data", "write_data", "delete_data", "trash_data", "send_email", "share_external", "make_public", "change_sharing_rules", "upload_file", "write_local_file"] }

