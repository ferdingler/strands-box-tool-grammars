    '*anYone*', '*anYonE*', '*anYoNe*', '*anYoNE*', '*anYOne*', '*anYOnE*', '*anYONe*', '*anYONE*',
    '*aNyone*', '*aNyonE*', '*aNyoNe*', '*aNyoNE*', '*aNyOne*', '*aNyOnE*', '*aNyONe*', '*aNyONE*',
    '*aNYone*', '*aNYonE*', '*aNYoNe*', '*aNYoNE*', '*aNYOne*', '*aNYOnE*', '*aNYONe*', '*aNYONE*',
    '*Anyone*', '*AnyonE*', '*AnyoNe*', '*AnyoNE*', '*AnyOne*', '*AnyOnE*', '*AnyONe*', '*AnyONE*',
