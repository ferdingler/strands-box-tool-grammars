# Tool grammar for npm, the Node.js package manager.
#
# Project:    npm CLI, https://github.com/npm/cli (official, npm/GitHub)
# Executable: npm (bin/npm-cli.js, a Node.js script run by `node`)
# Checked:    npm 12.2.2 (tag v12.2.2, commit 60e11343), on Node.js 26.13.0. Sources: `npm <cmd> --help`,
#             the npm-<cmd>(1) and npm-config(7) man pages that npm 12.2.2 ships, and the v12.2.2 source
#             (lib/commands/*.js, lib/utils/cmd-list.js, workspaces/arborist, nopt 10.0.1).
#
# What this grammar cannot see:
# - Configuration outside argv. npm reads every setting also from `.npmrc` files (project, user,
#   global, builtin) and from `npm_config_*` environment variables. `ignore-scripts=true` in an
#   `.npmrc` removes no effect here, and `registry=...` in an `.npmrc` or `npm_config_registry`
#   adds no `override_registry`. The effects come from the command line only.
# - Package contents. `run_lifecycle_scripts` and `run_program` say that npm may run code from
#   package.json `scripts` or a package binary. Which code that is depends on files on disk.
# - The allowScripts policy. npm 12 blocks dependency install scripts that the project's
#   `allowScripts` (package.json or .npmrc) does not approve. The grammar does not read it, so
#   `run_lifecycle_scripts` means "may run", not "will run".
# - Child processes. Lifecycle scripts, `npm run`/`test`/`exec` targets, `npm init <initializer>`,
#   and git (for `npm version` and git dependencies) run inside the tool's own sandbox and are not
#   decided by the Shell.
# - `npm init` without an initializer loads the `init-module` file (default `~/.npm-init.js`,
#   settable in `.npmrc`), which init-package-json runs as code. The grammar cannot see it.
# - `npx`. It is a different program name, so this grammar does not bind it.
# - Command abbreviations and camelCase. npm resolves any unique prefix of a command (`npm pub`,
#   `npm uni`) and `runScript`-style names. Only the spellings npm documents are modeled; every
#   other spelling is `unmodeled`.
#
# How npm's option parser (nopt) differs, and what this grammar does about it:
# - A boolean flag followed by the word `true` or `false` takes that word as its value
#   (`--ignore-scripts false` means "run scripts"). Each flag is `value = "boolean"`, so the grammar
#   reads the word the same way, and `--x false` neither adds nor removes the flag's effects. A
#   following `yes`, `no`, `1`, `0`, or another casing of `true` or `false` is `unmodeled`.
# - A String option (`--tag`) whose next word looks like a flag gets the empty value, and npm reads
#   that next word as a flag. `--tag` is `value = "optional-next"`, which reads it the same way. nopt
#   also splits an attached `--tag=-x` and reads `-x` as a flag, so a value like `-*` still adds
#   `ambiguous_argv`.
# - Other options with a value keep `value = "required"`, because nopt's rule for a next word that
#   starts with `-` depends on the option's type. Each adds `ambiguous_argv` when its value starts
#   with `-`.
# - Single-letter options that take a value (`-w`, `-C`, `-c`, `-L`) are not modeled, because npm
#   expands `-wg` into `--workspace --global` and this parser would read it as `-w g`. Use the
#   long spelling.

format  = 1
version = 1
name    = "npm"
program = "npm"

[effects]
network                = "Contacts the npm registry or another remote host"
modify_node_modules    = "Changes the installed package tree (node_modules, or the global prefix)"
modify_lockfile        = "Writes package-lock.json"
modify_package_json    = "Writes package.json"
run_lifecycle_scripts  = "May run package lifecycle scripts (package.json scripts of the project or of a dependency)"
run_program            = "Runs a package script or a package binary that the command line names"
global_install         = "Acts on the global package prefix, not on the project"
bypass_script_policy   = "Lets dependency install scripts run that the allowScripts policy has not approved"
override_registry      = "Sends registry traffic to a registry that the command line names"
override_config        = "Reads or writes an npm configuration file that the command line names, or changes saved npm configuration"
override_prefix        = "Acts on a project directory that --prefix names, not the working directory"
publish                = "Publishes a package version to a registry"
make_public            = "Publishes with public access"
git_commit             = "Creates a git commit and a git tag"
force                  = "Overrides one of npm's safety checks (--force)"
delete_cache           = "Deletes entries from the npm cache"
ambiguous_argv         = "Holds a word that npm reads differently from this grammar: a value that starts with '-'"

# npm accepts each configuration flag before or after the command, so the global options are
# `anywhere`.
[global]
options.registry     = { flag = ["--registry"], value = "required", anywhere = true, adds = ["override_registry"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.userconfig   = { flag = ["--userconfig"], value = "required", anywhere = true, adds = ["override_config"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.globalconfig = { flag = ["--globalconfig"], value = "required", anywhere = true, adds = ["override_config"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.prefix       = { flag = ["--prefix"], value = "required", anywhere = true, adds = ["override_prefix"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.loglevel     = { flag = ["--loglevel"], value = "required", anywhere = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.silent       = { flag = ["-s", "--silent"], value = "boolean", anywhere = true }
options.quiet        = { flag = ["-q", "--quiet"], value = "boolean", anywhere = true }

# ---------------------------------------------------------------------------------------------
# Installing and changing the dependency tree
# ---------------------------------------------------------------------------------------------

# A bare `npm install` runs the project's own preinstall/install/postinstall/prepare scripts
# (lib/commands/install.js `runRootLifecycle`, which --dry-run and --package-lock-only do not
# stop). Arborist runs approved dependency scripts. A package spec saves to package.json.
[shell.install]
usage   = "npm [global options] install [options] [<package_spec>...]"
aliases = ["add", "i", "in", "ins", "inst", "insta", "instal", "isnt", "isnta", "isntal", "isntall"]
adds    = ["network", "modify_node_modules", "modify_lockfile", "run_lifecycle_scripts"]
options.save                          = { flag = ["-S", "--save"], value = "boolean" }
options.no_save                       = { flag = ["--no-save"], value = "boolean", removes = ["modify_package_json", "modify_lockfile"] }
options.save_prod                     = { flag = ["-P", "--save-prod"], value = "boolean" }
options.save_dev                      = { flag = ["-D", "--save-dev"], value = "boolean" }
options.save_optional                 = { flag = ["-O", "--save-optional"], value = "boolean" }
options.save_peer                     = { flag = ["--save-peer"], value = "boolean" }
options.save_bundle                   = { flag = ["-B", "--save-bundle"], value = "boolean" }
options.save_exact                    = { flag = ["-E", "--save-exact"], value = "boolean" }
options.global                        = { flag = ["-g", "--global"], value = "boolean", adds = ["global_install"], removes = ["modify_lockfile", "modify_package_json"] }
options.install_strategy              = { flag = ["--install-strategy"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.legacy_bundling               = { flag = ["--legacy-bundling"], value = "boolean" }
options.global_style                  = { flag = ["--global-style"], value = "boolean" }
options.omit                          = { flag = ["--omit"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.include                       = { flag = ["--include"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.strict_peer_deps              = { flag = ["--strict-peer-deps"], value = "boolean" }
options.legacy_peer_deps              = { flag = ["--legacy-peer-deps"], value = "boolean" }
options.prefer_dedupe                 = { flag = ["--prefer-dedupe"], value = "boolean" }
options.no_package_lock               = { flag = ["--no-package-lock"], value = "boolean", removes = ["modify_lockfile"] }
options.package_lock_only             = { flag = ["--package-lock-only"], value = "boolean", removes = ["modify_node_modules"] }
options.foreground_scripts            = { flag = ["--foreground-scripts"], value = "boolean" }
options.ignore_scripts                = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
options.allow_scripts                 = { flag = ["--allow-scripts"], value = "required", repeated = true, adds = ["bypass_script_policy"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.strict_allow_scripts          = { flag = ["--strict-allow-scripts"], value = "boolean" }
options.dangerously_allow_all_scripts = { flag = ["--dangerously-allow-all-scripts"], value = "boolean", adds = ["bypass_script_policy"] }
options.no_audit                      = { flag = ["--no-audit"], value = "boolean" }
options.no_fund                       = { flag = ["--no-fund"], value = "boolean" }
options.no_bin_links                  = { flag = ["--no-bin-links"], value = "boolean" }
options.before                        = { flag = ["--before"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.min_release_age               = { flag = ["--min-release-age"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.dry_run                       = { flag = ["--dry-run"], value = "boolean", removes = ["modify_node_modules", "modify_lockfile", "modify_package_json"] }
options.force                         = { flag = ["-f", "--force"], value = "boolean", adds = ["force"] }
options.offline                       = { flag = ["--offline"], value = "boolean", removes = ["network"] }
options.prefer_offline                = { flag = ["--prefer-offline"], value = "boolean" }
options.workspace                     = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces                    = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root        = { flag = ["--include-workspace-root"], value = "boolean" }
options.install_links                 = { flag = ["--install-links"], value = "boolean" }
operands.package_spec = { adds = ["modify_package_json"] }

# `npm ci` never writes package.json or the lockfile (`save: false`). It runs the root lifecycle
# scripts even with --dry-run (lib/commands/ci.js checks only ignore-scripts).
[shell.ci]
usage   = "npm [global options] ci [options]"
aliases = ["clean-install", "ic", "install-clean", "isntall-clean"]
adds    = ["network", "modify_node_modules", "run_lifecycle_scripts"]
options.install_strategy              = { flag = ["--install-strategy"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.legacy_bundling               = { flag = ["--legacy-bundling"], value = "boolean" }
options.global_style                  = { flag = ["--global-style"], value = "boolean" }
options.omit                          = { flag = ["--omit"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.include                       = { flag = ["--include"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.strict_peer_deps              = { flag = ["--strict-peer-deps"], value = "boolean" }
options.legacy_peer_deps              = { flag = ["--legacy-peer-deps"], value = "boolean" }
options.foreground_scripts            = { flag = ["--foreground-scripts"], value = "boolean" }
options.ignore_scripts                = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
options.allow_scripts                 = { flag = ["--allow-scripts"], value = "required", repeated = true, adds = ["bypass_script_policy"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.strict_allow_scripts          = { flag = ["--strict-allow-scripts"], value = "boolean" }
options.dangerously_allow_all_scripts = { flag = ["--dangerously-allow-all-scripts"], value = "boolean", adds = ["bypass_script_policy"] }
options.no_audit                      = { flag = ["--no-audit"], value = "boolean" }
options.no_fund                       = { flag = ["--no-fund"], value = "boolean" }
options.no_bin_links                  = { flag = ["--no-bin-links"], value = "boolean" }
options.dry_run                       = { flag = ["--dry-run"], value = "boolean", removes = ["modify_node_modules"] }
options.offline                       = { flag = ["--offline"], value = "boolean", removes = ["network"] }
options.prefer_offline                = { flag = ["--prefer-offline"], value = "boolean" }
options.workspace                     = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces                    = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root        = { flag = ["--include-workspace-root"], value = "boolean" }
options.install_links                 = { flag = ["--install-links"], value = "boolean" }

# Uninstall saves to package.json and the lockfile by default. Arborist runs the root
# `dependencies` script when the tree changes, and submits an audit report (network).
[shell.uninstall]
usage   = "npm [global options] uninstall [options] <pkg>..."
aliases = ["unlink", "remove", "rm", "r", "un"]
adds    = ["network", "modify_node_modules", "modify_lockfile", "modify_package_json", "run_lifecycle_scripts"]
options.save                   = { flag = ["-S", "--save"], value = "boolean" }
options.no_save                = { flag = ["--no-save"], value = "boolean", removes = ["modify_package_json", "modify_lockfile"] }
options.save_prod              = { flag = ["-P", "--save-prod"], value = "boolean" }
options.save_dev               = { flag = ["-D", "--save-dev"], value = "boolean" }
options.save_optional          = { flag = ["-O", "--save-optional"], value = "boolean" }
options.save_peer              = { flag = ["--save-peer"], value = "boolean" }
options.save_bundle            = { flag = ["-B", "--save-bundle"], value = "boolean" }
options.global                 = { flag = ["-g", "--global"], value = "boolean", adds = ["global_install"], removes = ["modify_lockfile", "modify_package_json"] }
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces             = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
options.install_links          = { flag = ["--install-links"], value = "boolean" }
operands.pkg = {}

# `npm update` writes the lockfile but not package.json unless --save (arborist reify.js
# `_saveIdealTree` keeps saving for updates).
[shell.update]
usage   = "npm [global options] update [options] [<pkg>...]"
aliases = ["u", "up", "upgrade", "udpate"]
adds    = ["network", "modify_node_modules", "modify_lockfile", "run_lifecycle_scripts"]
options.save                          = { flag = ["-S", "--save"], value = "boolean", adds = ["modify_package_json"] }
options.no_save                       = { flag = ["--no-save"], value = "boolean" }
options.global                        = { flag = ["-g", "--global"], value = "boolean", adds = ["global_install"], removes = ["modify_lockfile", "modify_package_json"] }
options.install_strategy              = { flag = ["--install-strategy"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.legacy_bundling               = { flag = ["--legacy-bundling"], value = "boolean" }
options.global_style                  = { flag = ["--global-style"], value = "boolean" }
options.omit                          = { flag = ["--omit"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.include                       = { flag = ["--include"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.strict_peer_deps              = { flag = ["--strict-peer-deps"], value = "boolean" }
options.legacy_peer_deps              = { flag = ["--legacy-peer-deps"], value = "boolean" }
options.no_package_lock               = { flag = ["--no-package-lock"], value = "boolean", removes = ["modify_lockfile"] }
options.foreground_scripts            = { flag = ["--foreground-scripts"], value = "boolean" }
options.ignore_scripts                = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
options.allow_scripts                 = { flag = ["--allow-scripts"], value = "required", repeated = true, adds = ["bypass_script_policy"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.strict_allow_scripts          = { flag = ["--strict-allow-scripts"], value = "boolean" }
options.dangerously_allow_all_scripts = { flag = ["--dangerously-allow-all-scripts"], value = "boolean", adds = ["bypass_script_policy"] }
options.no_audit                      = { flag = ["--no-audit"], value = "boolean" }
options.before                        = { flag = ["--before"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.min_release_age               = { flag = ["--min-release-age"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.no_bin_links                  = { flag = ["--no-bin-links"], value = "boolean" }
options.no_fund                       = { flag = ["--no-fund"], value = "boolean" }
options.dry_run                       = { flag = ["--dry-run"], value = "boolean", removes = ["modify_node_modules", "modify_lockfile", "modify_package_json", "run_lifecycle_scripts"] }
options.workspace                     = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces                    = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root        = { flag = ["--include-workspace-root"], value = "boolean" }
options.install_links                 = { flag = ["--install-links"], value = "boolean" }
operands.pkg = {}

[shell.dedupe]
usage   = "npm [global options] dedupe [options]"
aliases = ["ddp"]
adds    = ["network", "modify_node_modules", "modify_lockfile", "run_lifecycle_scripts"]
options.install_strategy       = { flag = ["--install-strategy"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.legacy_bundling        = { flag = ["--legacy-bundling"], value = "boolean" }
options.global_style           = { flag = ["--global-style"], value = "boolean" }
options.strict_peer_deps       = { flag = ["--strict-peer-deps"], value = "boolean" }
options.no_package_lock        = { flag = ["--no-package-lock"], value = "boolean", removes = ["modify_lockfile"] }
options.omit                   = { flag = ["--omit"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.include                = { flag = ["--include"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.ignore_scripts         = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
options.no_audit               = { flag = ["--no-audit"], value = "boolean" }
options.no_bin_links           = { flag = ["--no-bin-links"], value = "boolean" }
options.no_fund                = { flag = ["--no-fund"], value = "boolean" }
options.dry_run                = { flag = ["--dry-run"], value = "boolean", removes = ["modify_node_modules", "modify_lockfile", "run_lifecycle_scripts"] }
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces             = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
options.install_links          = { flag = ["--install-links"], value = "boolean" }

[shell.prune]
usage = "npm [global options] prune [options] [<pkg>...]"
adds  = ["network", "modify_node_modules", "modify_lockfile", "run_lifecycle_scripts"]
options.omit                   = { flag = ["--omit"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.include                = { flag = ["--include"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.dry_run                = { flag = ["--dry-run"], value = "boolean", removes = ["modify_node_modules", "modify_lockfile", "run_lifecycle_scripts"] }
options.json                   = { flag = ["--json"], value = "boolean" }
options.foreground_scripts     = { flag = ["--foreground-scripts"], value = "boolean" }
options.ignore_scripts         = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces             = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
options.install_links          = { flag = ["--install-links"], value = "boolean" }
operands.pkg = {}

# `npm link` always writes the global prefix (no argument: links this folder there; with an
# argument: installs it there first). `-g` is an error for link, so it is not modeled. It saves
# to package.json only with an explicit --save or --save-* (lib/commands/link.js).
[shell.link]
usage   = "npm [global options] link [options] [<package_spec>...]"
aliases = ["ln"]
adds    = ["network", "global_install", "modify_node_modules", "run_lifecycle_scripts"]
options.save                   = { flag = ["-S", "--save"], value = "boolean", adds = ["modify_package_json", "modify_lockfile"] }
options.save_prod              = { flag = ["-P", "--save-prod"], value = "boolean", adds = ["modify_package_json", "modify_lockfile"] }
options.save_dev               = { flag = ["-D", "--save-dev"], value = "boolean", adds = ["modify_package_json", "modify_lockfile"] }
options.save_optional          = { flag = ["-O", "--save-optional"], value = "boolean", adds = ["modify_package_json", "modify_lockfile"] }
options.save_peer              = { flag = ["--save-peer"], value = "boolean", adds = ["modify_package_json", "modify_lockfile"] }
options.save_exact             = { flag = ["-E", "--save-exact"], value = "boolean" }
options.install_strategy       = { flag = ["--install-strategy"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.strict_peer_deps       = { flag = ["--strict-peer-deps"], value = "boolean" }
options.no_package_lock        = { flag = ["--no-package-lock"], value = "boolean", removes = ["modify_lockfile"] }
options.omit                   = { flag = ["--omit"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.include                = { flag = ["--include"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.ignore_scripts         = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
options.no_audit               = { flag = ["--no-audit"], value = "boolean" }
options.no_bin_links           = { flag = ["--no-bin-links"], value = "boolean" }
options.no_fund                = { flag = ["--no-fund"], value = "boolean" }
options.dry_run                = { flag = ["--dry-run"], value = "boolean", removes = ["modify_node_modules", "modify_lockfile", "modify_package_json", "run_lifecycle_scripts"] }
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces             = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
operands.package_spec = {}

# ---------------------------------------------------------------------------------------------
# Running scripts and programs
# ---------------------------------------------------------------------------------------------

# `npm run` with no script lists the scripts and runs nothing. --ignore-scripts skips only the
# pre/post scripts; the named script still runs (lib/commands/run.js). npm passes words after `--`
# to the script.
[shell.run]
usage   = "npm [global options] run [options] [<command>] [-- <script_args>...]"
aliases = ["run-script", "rum", "urn"]
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces             = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
options.if_present             = { flag = ["--if-present"], value = "boolean" }
options.ignore_scripts         = { flag = ["--ignore-scripts"], value = "boolean" }
options.foreground_scripts     = { flag = ["--foreground-scripts"], value = "boolean" }
options.script_shell           = { flag = ["--script-shell"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
operands.command     = { adds = ["run_program"] }
operands.script_args = { adds = ["run_program"] }

[shell.test]
usage   = "npm [global options] test [options] [-- <script_args>...]"
aliases = ["tst", "t"]
adds    = ["run_program"]
options.ignore_scripts = { flag = ["--ignore-scripts"], value = "boolean" }
options.script_shell   = { flag = ["--script-shell"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }

[shell.start]
usage = "npm [global options] start [options] [-- <script_args>...]"
adds  = ["run_program"]
options.ignore_scripts = { flag = ["--ignore-scripts"], value = "boolean" }
options.script_shell   = { flag = ["--script-shell"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }

[shell.stop]
usage = "npm [global options] stop [options] [-- <script_args>...]"
adds  = ["run_program"]
options.ignore_scripts = { flag = ["--ignore-scripts"], value = "boolean" }
options.script_shell   = { flag = ["--script-shell"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }

[shell.restart]
usage = "npm [global options] restart [options] [-- <script_args>...]"
adds  = ["run_program"]
