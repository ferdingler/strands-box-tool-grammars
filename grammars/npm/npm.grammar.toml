# ---------------------------------------------------------------------------------------------
# Packing, publishing, versioning
# ---------------------------------------------------------------------------------------------

# `npm pack` runs prepack/prepare/postpack for a folder even with --dry-run (libnpmpack checks
# only ignoreScripts). A registry spec is fetched, so a spec adds `network`; for a folder such as
# `.` that over-states it.
[shell.pack]
usage = "npm [global options] pack [options] [<package_spec>...]"
adds  = ["run_lifecycle_scripts"]
options.dry_run                = { flag = ["--dry-run"], value = "boolean" }
options.json                   = { flag = ["--json"], value = "boolean" }
options.pack_destination       = { flag = ["--pack-destination"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces             = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
options.ignore_scripts         = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
operands.package_spec = { adds = ["network"] }

# `npm publish --dry-run` still contacts the registry and still runs prepublishOnly, prepack,
# prepare, publish, and postpublish for a folder (lib/commands/publish.js); it only skips the
# upload. `--access public` makes a scoped package public; an unscoped package is public anyway.
[shell.publish]
usage = "npm [global options] publish [options] [<package_spec>]"
adds  = ["network", "publish", "run_lifecycle_scripts"]
options.tag                    = { flag = ["--tag"], value = "optional-next", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.access                 = { flag = ["--access"], value = "required", when = [{ like = "public", adds = ["make_public"] }, { like = "-*", adds = ["ambiguous_argv"] }] }
options.dry_run                = { flag = ["--dry-run"], value = "boolean", removes = ["publish", "make_public"] }
options.provenance             = { flag = ["--provenance"], value = "boolean" }
options.force                  = { flag = ["-f", "--force"], value = "boolean", adds = ["force"] }
options.ignore_scripts         = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces             = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
operands.package_spec = {}

# `npm version` with no argument prints versions. With one, it writes package.json and the
# lockfile, runs preversion/version/postversion, and in a git work tree commits and tags
# (libnpmversion). With --workspace/--workspaces it then reifies the tree
# (lib/commands/version.js -> lib/utils/update-workspaces.js) unless --no-workspaces-update; with no
# <newversion> it only lists, so the workspace effects over-state that case.
[shell.version]
usage   = "npm [global options] version [options] [<newversion>]"
aliases = ["verison"]
options.allow_same_version     = { flag = ["--allow-same-version"], value = "boolean" }
options.no_commit_hooks        = { flag = ["--no-commit-hooks"], value = "boolean" }
options.no_git_tag_version     = { flag = ["--no-git-tag-version"], value = "boolean", removes = ["git_commit"] }
options.json                   = { flag = ["--json"], value = "boolean" }
options.preid                  = { flag = ["--preid"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.sign_git_tag           = { flag = ["--sign-git-tag"], value = "boolean" }
options.ignore_scripts         = { flag = ["--ignore-scripts"], value = "boolean", removes = ["run_lifecycle_scripts"] }
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, adds = ["network", "modify_node_modules"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces             = { flag = ["--workspaces"], value = "boolean", adds = ["network", "modify_node_modules"] }
options.no_workspaces_update   = { flag = ["--no-workspaces-update"], value = "boolean", removes = ["modify_node_modules"] }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
operands.newversion = { adds = ["modify_package_json", "modify_lockfile", "git_commit", "run_lifecycle_scripts"] }

# `npm init` writes package.json. `npm init <initializer> [args...]` runs `create-<initializer>`
# through `npm exec`, passing the extra words to it (lib/commands/init.js). `--workspace` creates a
# workspace and then reifies the tree (init.js `update` -> lib/utils/update-workspaces.js), unless
# --no-workspaces-update. With an initializer, init.js returns before that reify, so the
# --workspace effects over-state that case.
[shell.init]
usage   = "npm [global options] init [options] [<package_spec> [<initializer_args>...]]"
aliases = ["create", "innit"]
adds    = ["modify_package_json"]
options.yes                    = { flag = ["-y", "--yes"], value = "boolean" }
options.force                  = { flag = ["-f", "--force"], value = "boolean", adds = ["force"] }
options.scope                  = { flag = ["--scope"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.init_author_name       = { flag = ["--init-author-name"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.init_license           = { flag = ["--init-license"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.init_version           = { flag = ["--init-version"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.init_type              = { flag = ["--init-type"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.init_private           = { flag = ["--init-private"], value = "boolean" }
options.workspace              = { flag = ["--workspace"], value = "required", repeated = true, adds = ["network", "modify_node_modules", "modify_lockfile", "run_lifecycle_scripts"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.no_workspaces_update   = { flag = ["--no-workspaces-update"], value = "boolean", removes = ["modify_node_modules", "modify_lockfile", "run_lifecycle_scripts"] }
options.include_workspace_root = { flag = ["--include-workspace-root"], value = "boolean" }
operands.package_spec     = { adds = ["network", "run_program"] }
operands.initializer_args = { adds = ["network", "run_program"] }

