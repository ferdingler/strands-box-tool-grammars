usage   = "npm [global options] exec [options] [<command>...]"
aliases = ["x"]
adds    = ["network", "run_program"]
options.package                       = { flag = ["--package"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.call                          = { flag = ["--call"], value = "required", when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.yes                           = { flag = ["-y", "--yes"], value = "boolean" }
options.workspace                     = { flag = ["--workspace"], value = "required", repeated = true, when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.workspaces                    = { flag = ["--workspaces"], value = "boolean" }
options.include_workspace_root        = { flag = ["--include-workspace-root"], value = "boolean" }
options.allow_scripts                 = { flag = ["--allow-scripts"], value = "required", repeated = true, adds = ["bypass_script_policy", "run_lifecycle_scripts"], when = [{ like = "-*", adds = ["ambiguous_argv"] }] }
options.strict_allow_scripts          = { flag = ["--strict-allow-scripts"], value = "boolean" }
options.dangerously_allow_all_scripts = { flag = ["--dangerously-allow-all-scripts"], value = "boolean", adds = ["bypass_script_policy", "run_lifecycle_scripts"] }

