[[case]]
argv = ["npm", "audit", "fixx"]
action = "unmodeled"

# =============================================================================================
# pack, publish
# =============================================================================================

[[case]]
argv = ["npm", "pack"]
action = "pack"
effects = ["run_lifecycle_scripts"]

# pack --dry-run still runs prepack/prepare/postpack (libnpmpack checks only ignoreScripts).
[[case]]
argv = ["npm", "pack", "--dry-run", "--json"]
action = "pack"
fields = { dry_run = true, json = true }
effects = ["run_lifecycle_scripts"]

[[case]]
argv = ["npm", "pack", "lodash@4", "--pack-destination", "dist", "--ignore-scripts"]
action = "pack"
fields = { package_spec = ["lodash@4"], pack_destination = "dist", ignore_scripts = true }
effects = ["network"]

[[case]]
argv = ["npm", "publish"]
action = "publish"
effects = ["network", "publish", "run_lifecycle_scripts"]

# --dry-run removes publish, but npm still contacts the registry and runs the scripts.
[[case]]
argv = ["npm", "publish", "--dry-run"]
action = "publish"
fields = { dry_run = true }
effects = ["network", "run_lifecycle_scripts"]

# --access public adds make_public (`--access=v` and `--access v`).
[[case]]
argv = ["npm", "publish", "--access", "public"]
action = "publish"
fields = { access = "public" }
effects = ["make_public", "network", "publish", "run_lifecycle_scripts"]

[[case]]
argv = ["npm", "publish", "--access=restricted", "--tag", "beta"]
action = "publish"
fields = { access = "restricted", tag = "beta" }
effects = ["network", "publish", "run_lifecycle_scripts"]

[[case]]
argv = ["npm", "publish", "--access=public", "--dry-run"]
action = "publish"
fields = { access = "public", dry_run = true }
effects = ["network", "run_lifecycle_scripts"]

[[case]]
argv = ["npm", "publish", "./pkg.tgz", "--provenance", "--ignore-scripts"]
action = "publish"
fields = { package_spec = "./pkg.tgz", provenance = true, ignore_scripts = true }
effects = ["network", "publish"]

# nopt: `--tag --access=public` gives tag "" and reads --access=public, so the value adds
# ambiguous_argv.
[[case]]
argv = ["npm", "publish", "--tag", "--access=public"]
action = "publish"
fields = { tag = "--access=public" }
effects = ["ambiguous_argv", "network", "publish", "run_lifecycle_scripts"]

# nopt: `--dry-run false` is dry-run=false, a real publish; the operand `false` flags it.
[[case]]
argv = ["npm", "publish", "--dry-run", "false"]
action = "publish"
fields = { dry_run = true, package_spec = "false" }
effects = ["ambiguous_argv", "network", "run_lifecycle_scripts"]

[[case]]
argv = ["npm", "--registry", "https://npm.example.com/", "publish"]
action = "publish"
fields = { registry = "https://npm.example.com/" }
effects = ["network", "override_registry", "publish", "run_lifecycle_scripts"]

# --otp is not modeled; two specs are unmodeled.
[[case]]
argv = ["npm", "publish", "--otp", "123456"]
action = "unmodeled"

[[case]]
argv = ["npm", "publish", "a", "b"]
action = "unmodeled"

