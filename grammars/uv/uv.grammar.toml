# Tool grammar for uv, the Python package and project manager by Astral.
#
# Project:    https://github.com/astral-sh/uv
# Executable: `uv`, a native binary. `uvx` is a separate program name; this grammar does not bind it,
#             so `uvx ...` is a plain `shell:spawn` unless another grammar names `uvx`.
# Checked:    uv 0.13.7 (tag 0.13.7, commit 316c827e0), against `uv <command> --help` and the clap
#             definitions in crates/uv-cli/src/lib.rs and crates/uv-cache/src/cli.rs at that tag.
#
# What this grammar cannot see:
# - Environment variables. Almost every option has a `UV_*` twin (UV_INDEX_URL, UV_OFFLINE, UV_FROZEN,
#   UV_PUBLISH_TOKEN, UV_INSECURE_HOST, ...). A value set there has no field and no effect here.
# - Configuration files: pyproject.toml `[tool.uv]`, uv.toml, and the user and system uv.toml. They can
#   set indexes, `offline`, `allow-insecure-host`, `native-tls`, and more. Only the `--config-file` and
#   `--no-config` flags are visible (effect `override_config`).
# - Child processes. uv starts Python interpreters to inspect them (a `--python` value or a `python
#   find`/`pin` request names one, so those add `run_program`), PEP 517 build backends, `git`, and the
#   program after `uv run` / `uv tool run`. These run inside the tool's own sandbox and are not decided
#   by Box. The effects `run_program` and `build_code` mark the lines that start them.
# - What a requirement or a script resolves to: a package name, URL, or `# /// script` block is data.
#
# Shape: `uv [global options] <command words> [options] [operands]`. uv's global options are clap
# `global = true`, so they are accepted before, between, and after the command words (`anywhere`).
# `--python`/`-p` and the index options are per-command options in uv, not global, so each action that
# accepts them declares them. Undeclared and hidden flags (`--no-offline`, `--no-frozen`, `--cert`,
# `-C/--config-setting`, `--keyring-provider`, `-h`, `-V`, ...) make the line `unmodeled`.

# Generated by gen/gen.py from gen/head.toml; edit those and run `python3 grammars/uv/gen/gen.py`.

format  = 1
version = 1
name    = "uv"
program = "uv"

[effects]
read_only                = "Makes no change to files, environments, or settings"
network                  = "uv may contact package indexes, Git hosts, or Python download servers"
run_program              = "Runs a program, script, or module that the command line names"
build_code               = "May run a package build backend, which is arbitrary code from a source distribution or a local project"
modify_environment       = "Creates or changes a Python environment, or the packages installed in it"
modify_project           = "Writes project files such as pyproject.toml, uv.lock, or .python-version"
modify_user              = "Changes user-level state outside the project: installed tools, managed Pythons, shell files, or uv itself"
delete_data              = "Deletes cache entries, tools, Python installations, packages, or a directory's contents"
publish                  = "Uploads distributions to a package index"
credentials              = "The command line carries a password, a token, or a URL with credentials"
disable_tls_verification = "Allows insecure (unverified TLS or plain HTTP) connections to a host"
override_index           = "Uses a package index or upload URL that the command line names"
override_config          = "Uses a configuration file that the command line names, or ignores the discovered ones"
other_directory          = "Runs against a directory or project that the command line names, not the working directory"
system_python            = "May change a system Python environment, not a virtual environment"
write_file               = "Writes into, or removes from, a file or directory that the command line names"

[global]
options.quiet               = { flag = ["-q", "--quiet"], anywhere = true }
options.verbose             = { flag = ["-v", "--verbose"], anywhere = true }
options.color               = { flag = ["--color"], value = "required", anywhere = true }
options.system_certs        = { flag = ["--system-certs"], anywhere = true }
options.native_tls          = { flag = ["--native-tls"], anywhere = true }
options.offline             = { flag = ["--offline"], removes = ["network"], anywhere = true }
options.allow_insecure_host = { flag = ["--allow-insecure-host", "--trusted-host"], value = "required", repeated = true, adds = ["disable_tls_verification"], anywhere = true }
options.no_progress         = { flag = ["--no-progress"], anywhere = true }
options.directory           = { flag = ["--directory"], value = "required", adds = ["other_directory"], anywhere = true }
options.project             = { flag = ["--project"], value = "required", adds = ["other_directory"], anywhere = true }
options.config_file         = { flag = ["--config-file"], value = "required", adds = ["override_config"], anywhere = true }
options.no_config           = { flag = ["--no-config"], adds = ["override_config"], anywhere = true }
options.no_cache            = { flag = ["-n", "--no-cache", "--no-cache-dir"], anywhere = true }
options.cache_dir           = { flag = ["--cache-dir"], value = "required", anywhere = true }
options.managed_python      = { flag = ["--managed-python"], anywhere = true }
options.no_managed_python   = { flag = ["--no-managed-python"], anywhere = true }
options.no_python_downloads = { flag = ["--no-python-downloads"], anywhere = true }
options.preview             = { flag = ["--preview"], anywhere = true }

# `uv run <cmd> [args]` runs a program that the line names, after uv locks and syncs the project.
# The command and every word after it belong to that program, so they are one `rest` operand.
[shell.run]
usage   = "uv [global options] run [options] <command>..."
adds    = ["run_program", "network", "modify_environment", "modify_project", "build_code"]
options.extra              = { flag = ["--extra"], value = "required", repeated = true }
options.all_extras         = { flag = ["--all-extras"] }
options.no_dev             = { flag = ["--no-dev"] }
options.only_dev           = { flag = ["--only-dev"] }
options.group              = { flag = ["--group"], value = "required", repeated = true }
options.no_group           = { flag = ["--no-group"], value = "required", repeated = true }
options.only_group         = { flag = ["--only-group"], value = "required", repeated = true }
options.all_groups         = { flag = ["--all-groups"] }
options.no_default_groups  = { flag = ["--no-default-groups"] }
options.module             = { flag = ["-m", "--module"] }
options.script             = { flag = ["-s", "--script"] }
options.with               = { flag = ["-w", "--with"], value = "required", repeated = true }
options.with_editable      = { flag = ["--with-editable"], value = "required", repeated = true }
options.with_requirements  = { flag = ["--with-requirements"], value = "required", repeated = true }
options.isolated           = { flag = ["--isolated"] }
options.active             = { flag = ["--active"] }
options.exact              = { flag = ["--exact"] }
options.no_sync            = { flag = ["--no-sync"], removes = ["modify_project"] }
options.env_file           = { flag = ["--env-file"], value = "required", repeated = true }
options.no_env_file        = { flag = ["--no-env-file"] }
options.all_packages       = { flag = ["--all-packages"] }
options.package            = { flag = ["--package"], value = "required" }
options.no_project         = { flag = ["--no-project"] }
options.locked             = { flag = ["--locked"], removes = ["modify_project"] }
options.frozen             = { flag = ["--frozen"], removes = ["modify_project"] }
options.index              = { flag = ["--index"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.default_index      = { flag = ["--default-index"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.index_url          = { flag = ["-i", "--index-url"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.extra_index_url    = { flag = ["--extra-index-url"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.find_links         = { flag = ["-f", "--find-links"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.no_index           = { flag = ["--no-index"] }
options.upgrade            = { flag = ["-U", "--upgrade"] }
options.upgrade_package    = { flag = ["-P", "--upgrade-package"], value = "required", repeated = true }
options.resolution         = { flag = ["--resolution"], value = "required" }
options.prerelease         = { flag = ["--prerelease"], value = "required" }
options.exclude_newer      = { flag = ["--exclude-newer"], value = "required" }
options.reinstall          = { flag = ["--reinstall"] }
options.reinstall_package  = { flag = ["--reinstall-package"], value = "required", repeated = true }
options.compile_bytecode   = { flag = ["--compile-bytecode"] }
options.no_build           = { flag = ["--no-build"] }
options.no_build_isolation = { flag = ["--no-build-isolation"] }
options.refresh            = { flag = ["--refresh"] }
options.refresh_package    = { flag = ["--refresh-package"], value = "required", repeated = true }
options.python             = { flag = ["-p", "--python"], value = "required", adds = ["run_program"], removes = ["read_only"] }
operands.command = { rest = true }

[shell.init]
usage   = "uv [global options] init [options] [<path>]"
adds    = ["modify_project", "network"]
options.name           = { flag = ["--name"], value = "required" }
options.bare           = { flag = ["--bare"] }
options.package        = { flag = ["--package"] }
options.no_package     = { flag = ["--no-package"] }
options.app            = { flag = ["--app"] }
options.lib            = { flag = ["--lib"] }
options.script         = { flag = ["--script"] }
options.description    = { flag = ["--description"], value = "required" }
options.no_description = { flag = ["--no-description"] }
options.vcs            = { flag = ["--vcs"], value = "required" }
options.build_backend  = { flag = ["--build-backend"], value = "required" }
options.no_readme      = { flag = ["--no-readme"] }
options.author_from    = { flag = ["--author-from"], value = "required" }
options.no_pin_python  = { flag = ["--no-pin-python"] }
options.no_workspace   = { flag = ["--no-workspace"] }
options.python         = { flag = ["-p", "--python"], value = "required", adds = ["run_program"], removes = ["read_only"] }
operands.path = { adds = ["write_file"] }

# `uv add` edits pyproject.toml, then locks and syncs. `--frozen` skips the lock and `--locked` asserts it,
# but both still edit pyproject.toml, so neither removes `modify_project`.
[shell.add]
usage   = "uv [global options] add [options] [--] [<packages>...]"
adds    = ["modify_project", "network", "modify_environment", "build_code"]
options.requirements       = { flag = ["-r", "--requirements"], value = "required", repeated = true }
options.constraints        = { flag = ["-c", "--constraints"], value = "required", repeated = true }
options.editable           = { flag = ["--editable"] }
options.raw                = { flag = ["--raw"] }
options.bounds             = { flag = ["--bounds"], value = "required" }
options.rev                = { flag = ["--rev"], value = "required" }
options.tag                = { flag = ["--tag"], value = "required" }
options.branch             = { flag = ["--branch"], value = "required" }
options.extra              = { flag = ["--extra"], value = "required", repeated = true }
options.no_install_project = { flag = ["--no-install-project"] }
options.dev                = { flag = ["--dev"] }
options.optional           = { flag = ["--optional"], value = "required" }
options.group              = { flag = ["--group"], value = "required" }
options.no_sync            = { flag = ["--no-sync"], removes = ["modify_environment"] }
options.active             = { flag = ["--active"] }
options.locked             = { flag = ["--locked"] }
options.frozen             = { flag = ["--frozen"] }
options.package            = { flag = ["--package"], value = "required" }
options.script             = { flag = ["--script"], value = "required" }
options.index              = { flag = ["--index"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.default_index      = { flag = ["--default-index"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.index_url          = { flag = ["-i", "--index-url"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.extra_index_url    = { flag = ["--extra-index-url"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.find_links         = { flag = ["-f", "--find-links"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.no_index           = { flag = ["--no-index"] }
options.upgrade            = { flag = ["-U", "--upgrade"] }
options.upgrade_package    = { flag = ["-P", "--upgrade-package"], value = "required", repeated = true }
options.resolution         = { flag = ["--resolution"], value = "required" }
options.prerelease         = { flag = ["--prerelease"], value = "required" }
options.exclude_newer      = { flag = ["--exclude-newer"], value = "required" }
options.reinstall          = { flag = ["--reinstall"] }
options.reinstall_package  = { flag = ["--reinstall-package"], value = "required", repeated = true }
options.compile_bytecode   = { flag = ["--compile-bytecode"] }
options.no_build           = { flag = ["--no-build"] }
options.no_build_isolation = { flag = ["--no-build-isolation"] }
options.refresh            = { flag = ["--refresh"] }
options.refresh_package    = { flag = ["--refresh-package"], value = "required", repeated = true }
options.python             = { flag = ["-p", "--python"], value = "required", adds = ["run_program"], removes = ["read_only"] }

[shell.remove]
usage   = "uv [global options] remove [options] [--] <packages>..."
adds    = ["modify_project", "network", "modify_environment", "build_code"]
options.dev                = { flag = ["--dev"] }
options.optional           = { flag = ["--optional"], value = "required" }
options.group              = { flag = ["--group"], value = "required" }
options.no_sync            = { flag = ["--no-sync"], removes = ["modify_environment"] }
options.active             = { flag = ["--active"] }
options.locked             = { flag = ["--locked"] }
options.frozen             = { flag = ["--frozen"] }
options.package            = { flag = ["--package"], value = "required" }
options.script             = { flag = ["--script"], value = "required" }
options.index              = { flag = ["--index"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.default_index      = { flag = ["--default-index"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.index_url          = { flag = ["-i", "--index-url"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.extra_index_url    = { flag = ["--extra-index-url"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.find_links         = { flag = ["-f", "--find-links"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.no_index           = { flag = ["--no-index"] }
options.upgrade            = { flag = ["-U", "--upgrade"] }
options.upgrade_package    = { flag = ["-P", "--upgrade-package"], value = "required", repeated = true }
options.resolution         = { flag = ["--resolution"], value = "required" }
options.prerelease         = { flag = ["--prerelease"], value = "required" }
options.exclude_newer      = { flag = ["--exclude-newer"], value = "required" }
options.reinstall          = { flag = ["--reinstall"] }
options.reinstall_package  = { flag = ["--reinstall-package"], value = "required", repeated = true }
options.compile_bytecode   = { flag = ["--compile-bytecode"] }
options.no_build           = { flag = ["--no-build"] }
options.no_build_isolation = { flag = ["--no-build-isolation"] }
options.refresh            = { flag = ["--refresh"] }
options.refresh_package    = { flag = ["--refresh-package"], value = "required", repeated = true }
options.python             = { flag = ["-p", "--python"], value = "required", adds = ["run_program"], removes = ["read_only"] }

# `uv sync` may update uv.lock, then installs into the project environment. `--locked` and `--frozen`
# keep uv.lock unchanged. `--dry-run` and `--check` change neither the lockfile nor the environment.
[shell.sync]
usage   = "uv [global options] sync [options]"
adds    = ["modify_environment", "modify_project", "network", "build_code"]
options.extra                = { flag = ["--extra"], value = "required", repeated = true }
options.all_extras           = { flag = ["--all-extras"] }
options.no_dev               = { flag = ["--no-dev"] }
options.only_dev             = { flag = ["--only-dev"] }
options.group                = { flag = ["--group"], value = "required", repeated = true }
options.no_group             = { flag = ["--no-group"], value = "required", repeated = true }
options.only_group           = { flag = ["--only-group"], value = "required", repeated = true }
options.all_groups           = { flag = ["--all-groups"] }
options.no_default_groups    = { flag = ["--no-default-groups"] }
options.inexact              = { flag = ["--inexact"] }
options.active               = { flag = ["--active"] }
options.no_install_project   = { flag = ["--no-install-project"] }
options.no_install_workspace = { flag = ["--no-install-workspace"] }
options.no_install_package   = { flag = ["--no-install-package"], value = "required", repeated = true }
options.dry_run              = { flag = ["--dry-run"], removes = ["modify_environment", "modify_project"] }
options.check                = { flag = ["--check"], removes = ["modify_environment", "modify_project"] }
options.all_packages         = { flag = ["--all-packages"] }
options.package              = { flag = ["--package"], value = "required", repeated = true }
options.script               = { flag = ["--script"], value = "required" }
options.locked               = { flag = ["--locked"], removes = ["modify_project"] }
options.frozen               = { flag = ["--frozen"], removes = ["modify_project"] }
options.index                = { flag = ["--index"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.default_index        = { flag = ["--default-index"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.index_url            = { flag = ["-i", "--index-url"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.extra_index_url      = { flag = ["--extra-index-url"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.find_links           = { flag = ["-f", "--find-links"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.no_index             = { flag = ["--no-index"] }
options.upgrade              = { flag = ["-U", "--upgrade"] }
options.upgrade_package      = { flag = ["-P", "--upgrade-package"], value = "required", repeated = true }
options.resolution           = { flag = ["--resolution"], value = "required" }
options.prerelease           = { flag = ["--prerelease"], value = "required" }
options.exclude_newer        = { flag = ["--exclude-newer"], value = "required" }
options.reinstall            = { flag = ["--reinstall"] }
options.reinstall_package    = { flag = ["--reinstall-package"], value = "required", repeated = true }
options.compile_bytecode     = { flag = ["--compile-bytecode"] }
options.no_build             = { flag = ["--no-build"] }
options.no_build_isolation   = { flag = ["--no-build-isolation"] }
options.refresh              = { flag = ["--refresh"] }
options.refresh_package      = { flag = ["--refresh-package"], value = "required", repeated = true }
options.python               = { flag = ["-p", "--python"], value = "required", adds = ["run_program"], removes = ["read_only"] }

[shell.lock]
usage   = "uv [global options] lock [options]"
adds    = ["modify_project", "network", "build_code"]
options.check              = { flag = ["--check"], removes = ["modify_project"] }
options.check_exists       = { flag = ["--check-exists"], removes = ["modify_project"] }
options.dry_run            = { flag = ["--dry-run"], removes = ["modify_project"] }
options.script             = { flag = ["--script"], value = "required" }
options.index              = { flag = ["--index"], value = "required", repeated = true, adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
options.default_index      = { flag = ["--default-index"], value = "required", adds = ["override_index"], when = [{ like = "*://*@*", adds = ["credentials"] }] }
