effects = ["read_only"]

[[case]]
argv = ["uv", "version", "--short"]
action = "version"
fields = { short = true }
effects = ["read_only"]

# A value or `--bump` writes pyproject.toml, then locks and syncs (source version.rs).
[[case]]
argv = ["uv", "version", "1.2.0"]
action = "version"
fields = { value = "1.2.0" }
effects = ["build_code", "modify_environment", "modify_project", "network"]

[[case]]
argv = ["uv", "version", "--bump", "major", "--bump=alpha"]
