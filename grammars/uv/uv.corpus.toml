# ---------------------------------------------------------------- publish (no global options)
[[case]]
argv = ["uv", "publish"]
action = "publish"
effects = ["network", "publish"]

# `-t/--token` and `-p/--password` carry credentials (help: uv publish).
[[case]]
argv = ["uv", "publish", "--token", "pypi-xxxx", "dist/pkg-1.0.tar.gz"]
action = "publish"
fields = { token = "pypi-xxxx", files = ["dist/pkg-1.0.tar.gz"] }
effects = ["credentials", "network", "publish"]

# In `uv publish`, `-p` is `--password`, not `--python`.
[[case]]
argv = ["uv", "publish", "-u", "__token__", "-p", "secret"]
action = "publish"
fields = { username = "__token__", password = "secret" }
effects = ["credentials", "network", "publish"]

[[case]]
argv = ["uv", "publish", "--dry-run"]
action = "publish"
fields = { dry_run = true }
effects = ["network"]

[[case]]
argv = ["uv", "publish", "--publish-url", "https://test.pypi.org/legacy/", "-q"]
action = "publish"
fields = { publish_url = "https://test.pypi.org/legacy/", quiet = true }
effects = ["network", "override_index", "publish"]

# `uv publish` shadows the global `--offline` with a hidden one (source `PublishArgs::offline`), so it
# and any global option before `publish` are unmodeled.
[[case]]
argv = ["uv", "publish", "--offline"]
action = "unmodeled"

[[case]]
argv = ["uv", "--offline", "publish"]
action = "unmodeled"

[[case]]
argv = ["uv", "publish", "--keyring-provider", "subprocess"]
action = "unmodeled"

