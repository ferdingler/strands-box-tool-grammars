# --- independent verifier cases ---
# Written by the verifier from uv 0.13.7 source (crates/uv-cli/src/lib.rs) and clap behaviour, not from
# the grammar. Cases marked "Fixed after verification" were failing at cb8a475 (see VERIFY.md).

# External subcommand: every word after the program goes to it, global flags included (clap
# `external_subcommand`, `RunArgs::command`). Probe: `uv run echo -q hi --no-sync` prints `-q hi --no-sync`.
[[case]]
argv = ["uv", "run", "python", "-q", "--offline", "--frozen"]
action = "run"
fields = { command = ["python", "-q", "--offline", "--frozen"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "run_program"]

# Global flags before and after `run` (clap `global = true`), and `--` before the program.
