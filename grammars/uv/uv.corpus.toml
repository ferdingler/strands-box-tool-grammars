action = "version"
fields = { bump = ["patch"], no_sync = true }
effects = ["build_code", "modify_project", "network"]

# `--dry-run` writes nothing and skips the lock and sync; `--bump` already removed `read_only`.
[[case]]
argv = ["uv", "version", "--bump", "minor", "--dry-run"]
action = "version"
fields = { bump = ["minor"], dry_run = true }
effects = []

[[case]]
argv = ["uv", "version", "1.0", "2.0"]
action = "unmodeled"

