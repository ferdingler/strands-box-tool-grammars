# Golden cases for uv.grammar.toml (uv 0.13.7). Each expectation was written from uv's documented
# behaviour before the harness ran. "help" means the captured `uv <command> --help` output for 0.13.7;
# "source" means crates/uv-cli/src/lib.rs (or the file named) at tag 0.13.7.
# `fields` lists only non-default values.

# ---------------------------------------------------------------- run
# `uv run [OPTIONS] [COMMAND]`: the command and all its words go to the program (help: uv run;
# source: `RunArgs::command` is a clap external subcommand). uv locks, syncs, then runs it.
[[case]]
argv = ["uv", "run", "pytest", "-x"]
action = "run"
fields = { command = ["pytest", "-x"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "run_program"]

# `-w/--with` may repeat (source: `with: Vec<...>`); a short flag takes an attached value.
[[case]]
argv = ["uv", "run", "--with", "requests", "-whttpx", "python", "script.py"]
action = "run"
fields = { with = ["httpx", "requests"], command = ["python", "script.py"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "run_program"]

# `--frozen` runs without updating uv.lock (help).
[[case]]
argv = ["uv", "run", "--frozen", "python", "-c", "print(1)"]
action = "run"
fields = { frozen = true, command = ["python", "-c", "print(1)"] }
effects = ["build_code", "modify_environment", "network", "run_program"]

# `--locked` asserts uv.lock stays unchanged (help).
[[case]]
argv = ["uv", "run", "--locked", "pytest"]
action = "run"
fields = { locked = true, command = ["pytest"] }
effects = ["build_code", "modify_environment", "network", "run_program"]

# `--no-sync` implies `--frozen` (source doc comment on `RunArgs::no_sync`), but `--with` still installs
# into an overlay environment, so `modify_environment` stays.
[[case]]
argv = ["uv", "run", "--no-sync", "--with", "rich", "python"]
action = "run"
fields = { no_sync = true, with = ["rich"], command = ["python"] }
effects = ["build_code", "modify_environment", "network", "run_program"]

# The global `--offline` before the command words removes uv's own `network`.
[[case]]
argv = ["uv", "--offline", "run", "python"]
action = "run"
fields = { offline = true, command = ["python"] }
effects = ["build_code", "modify_environment", "modify_project", "run_program"]

# `--offline` after the program name belongs to the program, not to uv: it removes nothing.
[[case]]
argv = ["uv", "run", "python", "--offline"]
action = "run"
fields = { command = ["python", "--offline"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "run_program"]

# `--` before the command is dropped; the words after it are the command.
[[case]]
argv = ["uv", "run", "--", "python", "-V"]
action = "run"
fields = { command = ["python", "-V"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "run_program"]

# A cluster of an anywhere global (`-q`) and an action flag (`-m`, help: `-m, --module`).
[[case]]
argv = ["uv", "run", "-qm", "http.server"]
action = "run"
fields = { quiet = true, module = true, command = ["http.server"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "run_program"]

# `-p/--python` is a per-command option of `uv run` (help: Python options). `-s/--script` is a flag in
# `uv run` (help: "Run the given path as a Python script"), so the path is the command.
[[case]]
argv = ["uv", "run", "-p", "3.12", "--script", "tool.py"]
action = "run"
fields = { python = "3.12", script = true, command = ["tool.py"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "run_program"]

[[case]]
argv = ["uv", "run", "-p", "3.12", "-s", "tool.py"]
action = "run"
fields = { python = "3.12", script = true, command = ["tool.py"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "run_program"]

# `--directory` changes where uv runs (help: Global options).
[[case]]
argv = ["uv", "run", "--directory", "../other", "python"]
action = "run"
fields = { directory = "../other", command = ["python"] }
effects = ["build_code", "modify_environment", "modify_project", "network", "other_directory", "run_program"]

# An index URL with credentials in it adds `credentials` and `override_index`.
[[case]]
argv = ["uv", "run", "--index-url", "https://user:pw@pypi.example.com/simple", "python"]
action = "run"
fields = { index_url = "https://user:pw@pypi.example.com/simple", command = ["python"] }
effects = ["build_code", "credentials", "modify_environment", "modify_project", "network", "override_index", "run_program"]

# `-w=x` is not a value spelling this grammar reads.
[[case]]
argv = ["uv", "run", "-w=rich", "python"]
action = "unmodeled"

# No command: `uv run` alone lists scripts in uv; it is not modeled.
[[case]]
argv = ["uv", "run"]
action = "unmodeled"

# An undeclared flag, a prefix of `--with`, and `--help`.
[[case]]
argv = ["uv", "run", "--bogus", "python"]
action = "unmodeled"

[[case]]
argv = ["uv", "run", "--wit", "rich", "python"]
action = "unmodeled"

[[case]]
argv = ["uv", "run", "--help"]
action = "unmodeled"

# ---------------------------------------------------------------- init
# `uv init [OPTIONS] [PATH]` (help); it may download a Python to pin.
[[case]]
argv = ["uv", "init", "myproj", "--lib"]
action = "init"
fields = { path = "myproj", lib = true }
effects = ["modify_project", "network", "write_file"]

[[case]]
argv = ["uv", "init", "--vcs=none", "--name", "demo"]
action = "init"
fields = { vcs = "none", name = "demo" }
effects = ["modify_project", "network"]

[[case]]
argv = ["uv", "init", "a", "b"]
action = "unmodeled"

[[case]]
argv = ["uv", "init", "--template", "x"]
action = "unmodeled"

# ---------------------------------------------------------------- add / remove
# `uv add` edits pyproject.toml, locks, and syncs (help: `--no-sync`, `--frozen`).
[[case]]
argv = ["uv", "add", "requests", "httpx>=0.27"]
action = "add"
fields = { packages = ["httpx>=0.27", "requests"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

[[case]]
argv = ["uv", "add", "--dev", "pytest"]
action = "add"
fields = { dev = true, packages = ["pytest"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

[[case]]
argv = ["uv", "add", "--group", "lint", "ruff"]
action = "add"
fields = { group = "lint", packages = ["ruff"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

[[case]]
argv = ["uv", "add", "--optional", "cli", "rich"]
action = "add"
fields = { optional = "cli", packages = ["rich"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

# `--no-sync` skips the environment sync.
[[case]]
argv = ["uv", "add", "--no-sync", "requests"]
action = "add"
fields = { no_sync = true, packages = ["requests"] }
effects = ["build_code", "modify_project", "network"]

# `--frozen` still edits pyproject.toml, so it removes nothing.
[[case]]
argv = ["uv", "add", "--frozen", "requests"]
action = "add"
fields = { frozen = true, packages = ["requests"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

# `-r` alone, with no package operand (help: `<PACKAGES|--requirements <REQUIREMENTS>>`).
[[case]]
argv = ["uv", "add", "-r", "requirements.txt", "-r", "dev.txt"]
action = "add"
fields = { requirements = ["dev.txt", "requirements.txt"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

# `--` ends the options.
[[case]]
argv = ["uv", "add", "--dev", "--", "pytest"]
action = "add"
fields = { dev = true, packages = ["pytest"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

# `--group` takes one value in `uv add` (source: `AddArgs::group: Option<GroupName>`).
[[case]]
argv = ["uv", "add", "--group", "a", "--group", "b", "x"]
action = "unmodeled"

[[case]]
argv = ["uv", "add", "--devv", "x"]
action = "unmodeled"

[[case]]
argv = ["uv", "remove", "requests"]
action = "remove"
fields = { packages = ["requests"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

[[case]]
argv = ["uv", "remove", "--dev", "--no-sync", "pytest"]
action = "remove"
fields = { dev = true, no_sync = true, packages = ["pytest"] }
effects = ["build_code", "modify_project", "network"]

# `<PACKAGES>...` is required (help).
[[case]]
argv = ["uv", "remove"]
action = "unmodeled"

# ---------------------------------------------------------------- sync
[[case]]
argv = ["uv", "sync"]
action = "sync"
effects = ["build_code", "modify_environment", "modify_project", "network"]

[[case]]
argv = ["uv", "sync", "--locked"]
action = "sync"
fields = { locked = true }
effects = ["build_code", "modify_environment", "network"]

[[case]]
argv = ["uv", "sync", "--frozen", "--offline"]
action = "sync"
fields = { frozen = true, offline = true }
effects = ["build_code", "modify_environment"]

# `--dry-run` writes neither the lockfile nor the environment (help).
[[case]]
argv = ["uv", "sync", "--dry-run"]
action = "sync"
fields = { dry_run = true }
effects = ["build_code", "network"]

[[case]]
argv = ["uv", "sync", "--check"]
action = "sync"
fields = { check = true }
effects = ["build_code", "network"]

# `--group` may repeat in `uv sync`; `--extra=v` and `--extra v` both work.
[[case]]
argv = ["uv", "sync", "--all-extras", "--group", "dev", "--group", "docs", "--extra=a", "--extra", "b"]
action = "sync"
fields = { all_extras = true, group = ["dev", "docs"], extra = ["a", "b"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

# `--no-build` does not remove `build_code`: uv may still build editable requirements (source doc
# comment on `no_build`).
[[case]]
argv = ["uv", "sync", "--no-build"]
action = "sync"
fields = { no_build = true }
effects = ["build_code", "modify_environment", "modify_project", "network"]

# `-P` repeats and takes an attached value.
[[case]]
argv = ["uv", "sync", "-U", "-P", "requests", "-Phttpx"]
action = "sync"
fields = { upgrade = true, upgrade_package = ["httpx", "requests"] }
effects = ["build_code", "modify_environment", "modify_project", "network"]

# `--allow-insecure-host` (global, alias `--trusted-host`) disables TLS verification for a host.
[[case]]
argv = ["uv", "sync", "--allow-insecure-host", "pypi.internal"]
action = "sync"
fields = { allow_insecure_host = ["pypi.internal"] }
effects = ["build_code", "disable_tls_verification", "modify_environment", "modify_project", "network"]

# The hidden opposite `--no-frozen` and `-C/--config-setting` are not declared.
[[case]]
argv = ["uv", "sync", "--frozen", "--no-frozen"]
action = "unmodeled"

[[case]]
argv = ["uv", "sync", "-C", "key=value"]
action = "unmodeled"

[[case]]
argv = ["uv", "sync", "extra-operand"]
action = "unmodeled"

