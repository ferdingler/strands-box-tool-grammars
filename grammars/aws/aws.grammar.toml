# Tool grammar for the AWS CLI version 2 (https://github.com/aws/aws-cli, branch v2).
# Executable: `aws`. Checked against aws-cli 2.40.0 (tag 2.40.0, commit ebbb625e), from its
# `help` pages and its source: awscli/clidriver.py, awscli/argparser.py, awscli/paramfile.py,
# awscli/data/cli.json, and awscli/customizations/{s3,logs,cloudformation,configure}.
#
# Scope. The AWS CLI has hundreds of services and thousands of operations. This grammar models the
# global options and a small set of common operations in sts, s3, s3api, ec2, lambda,
# cloudformation, iam, logs, dynamodb, ssm, secretsmanager, and configure. Every other command,
# and every option that is not declared here, is `unmodeled`.
#
# How the CLI reads a line. The main parser reads the global options anywhere on the line, so each
# global option here is `anywhere`. A service operation takes `--name value` or `--name=value`, a
# list option takes one or more words (`value = "many"`), and a boolean option has a `--no-` form.
# The CLI has no short flags. argparse accepts a unique prefix of a long option (`--reg` for
# `--region`); this grammar does not, so such a line is `unmodeled`.
#
# Values from local files. When the value of an option or a single operand starts with `file://`
# or `fileb://`, the CLI reads that local file and sends its content as the value. The rule sees
# only the `file://...` text. Each such value adds `value_from_file`. An option where the real
# value decides an effect (an ACL, a grant, `--capabilities`, `configure get`) also adds that
# effect when the value comes from a file. Options with a fixed list of choices (`s3 cp --acl`,
# `--storage-class`) refuse a `file://` value before the CLI loads it.
#
# Not declared, so `unmodeled`: `--cli-input-json` and `--cli-input-yaml` (a JSON or YAML document,
# often a file, that can set any parameter of the operation, so the fields would not describe the
# request), `--generate-cli-skeleton`, `--cli-auto-prompt` (an interactive prompt that builds any
# command), `--help`, `--version`, and the `help` word after an API operation.
#
# What this grammar cannot see:
# - Environment variables: AWS_PROFILE, AWS_REGION, AWS_DEFAULT_REGION, AWS_ENDPOINT_URL and
#   AWS_ENDPOINT_URL_<SERVICE>, AWS_CA_BUNDLE, AWS_ACCESS_KEY_ID and the other credential
#   variables, AWS_CONFIG_FILE, AWS_SHARED_CREDENTIALS_FILE, AWS_CLI_AUTO_PROMPT, AWS_PAGER. They
#   change the account, the region, the endpoint, and the TLS trust without a word on the line.
# - The config and credentials files (~/.aws/config, ~/.aws/credentials): region, endpoint_url,
#   ca_bundle, role_arn and source_profile, cli_auto_prompt, and credential_process, which runs a
#   program to get credentials.
# - CLI aliases in ~/.aws/cli/alias. An alias can take the name of a built-in command or
#   subcommand and give it another meaning, and an alias that starts with `!` runs a shell command.
# - Plugins that the `[plugins]` section of the config file loads.
# - Child processes: the output pager, credential_process, `!` aliases, and plugins.
# - The content of a `file://` or `fileb://` value, and of an uploaded file.
# - Whether a required option such as `--bucket` is present. The CLI refuses a line without it.

format  = 1
version = 1
name    = "aws"
program = "aws"

[effects]
read_data         = "Reads data or metadata from an AWS account: list, describe, get, download"
write_data        = "Creates or changes resources or data in an AWS account"
delete_data       = "Deletes resources or data in an AWS account, or the local files that s3 mv and s3 sync --delete remove"
read_secret       = "Returns secret plain text: a secret value, a decrypted parameter, unmasked log data, or a credential from the config file"
credentials       = "Obtains, creates, or prints AWS credentials"
iam_write         = "Changes IAM identities, policies, or permissions, or lets a stack do so"
make_public       = "Grants access to everyone, or to every AWS account (a public ACL or grant)"
grant_access      = "Gives another party access to data: a presigned URL or an ACL grant"
run_program       = "Runs code in AWS (a Lambda function)"
upload_local_file = "Sends the content of local files to AWS"
write_local_file  = "Writes a local file (a download, or a response saved to a file)"
value_from_file   = "A value starts with file:// or fileb://, so the CLI sends the content of a local file that the rule cannot see"
override_endpoint = "Sends the requests to an endpoint URL that the line names (--endpoint-url)"
change_account    = "Selects a named profile (--profile), which can hold other credentials, another account, or another role"
insecure_tls      = "Weakens TLS: skips certificate checks, trusts a CA bundle the line names, or uses an http:// endpoint"
read_config       = "Reads the local AWS CLI configuration"

# Global options (awscli/data/cli.json). The main parser reads them anywhere on the line.
[global]
options.debug               = { flag = "--debug", anywhere = true }
options.endpoint_url        = { flag = "--endpoint-url", value = "required", anywhere = true, adds = ["override_endpoint"], when = [{ like = "http://*", adds = ["insecure_tls"] }] }
options.no_verify_ssl       = { flag = "--no-verify-ssl", anywhere = true, adds = ["insecure_tls"] }
options.no_paginate         = { flag = "--no-paginate", anywhere = true }
options.output              = { flag = "--output", value = "required", anywhere = true }
options.query               = { flag = "--query", value = "required", anywhere = true }
options.profile             = { flag = "--profile", value = "required", anywhere = true, adds = ["change_account"] }
options.region              = { flag = "--region", value = "required", anywhere = true }
options.color               = { flag = "--color", value = "required", anywhere = true }
options.no_sign_request     = { flag = "--no-sign-request", anywhere = true }
options.ca_bundle           = { flag = "--ca-bundle", value = "required", anywhere = true, adds = ["insecure_tls"] }
options.cli_read_timeout    = { flag = "--cli-read-timeout", value = "required", anywhere = true }
options.cli_connect_timeout = { flag = "--cli-connect-timeout", value = "required", anywhere = true }
options.cli_binary_format   = { flag = "--cli-binary-format", value = "required", anywhere = true }
options.no_cli_pager        = { flag = "--no-cli-pager", anywhere = true }
options.no_cli_auto_prompt  = { flag = "--no-cli-auto-prompt", anywhere = true }
options.cli_error_format    = { flag = "--cli-error-format", value = "required", anywhere = true }

# --------------------------------------------------------------------------------------------------
# sts: who am I, and temporary credentials. `aws sts <op> help`, 2.40.0.

[shell.sts_get_caller_identity]
usage = "aws [global options] sts get-caller-identity"
adds  = ["read_data"]

[shell.sts_assume_role]
usage = "aws [global options] sts assume-role [options]"
adds  = ["credentials"]
options.role_arn          = { flag = "--role-arn", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.role_session_name = { flag = "--role-session-name", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.duration_seconds  = { flag = "--duration-seconds", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.external_id       = { flag = "--external-id", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.policy            = { flag = "--policy", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.policy_arns       = { flag = "--policy-arns", value = "many", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.serial_number     = { flag = "--serial-number", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.token_code        = { flag = "--token-code", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.source_identity   = { flag = "--source-identity", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }

[shell.sts_get_session_token]
usage = "aws [global options] sts get-session-token [options]"
adds  = ["credentials"]
options.duration_seconds = { flag = "--duration-seconds", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.serial_number    = { flag = "--serial-number", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.token_code       = { flag = "--token-code", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }

# --------------------------------------------------------------------------------------------------
# s3: the high-level transfer commands (awscli/customizations/s3/subcommands.py, 2.40.0).
# A single path is loaded from a file when it starts with file://; the two paths of cp, mv,
# and sync are not (they are a two-item list, and the loader reads only a one-item list).

[shell.s3_ls]
usage = "aws [global options] s3 ls [options] [<path>]"
adds  = ["read_data"]
options.recursive          = { flag = "--recursive" }
options.page_size          = { flag = "--page-size", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.human_readable     = { flag = "--human-readable" }
options.summarize          = { flag = "--summarize" }
options.bucket_name_prefix = { flag = "--bucket-name-prefix", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.bucket_region      = { flag = "--bucket-region", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
operands.path              = { when = [{ like = "file*://*", adds = ["value_from_file"] }] }

[shell.s3_cp]
usage = "aws [global options] s3 cp [options] <source> <destination>"
options.dryrun                  = { flag = "--dryrun", removes = ["write_data", "delete_data", "upload_local_file", "write_local_file", "make_public", "grant_access"] }
options.quiet                   = { flag = "--quiet" }
options.include                 = { flag = "--include", value = "required", repeated = true }
options.exclude                 = { flag = "--exclude", value = "required", repeated = true }
options.acl                     = { flag = "--acl", value = "required", when = [{ like = ["public-read", "public-read-write", "authenticated-read"], adds = ["make_public"] }] }
options.grants                  = { flag = "--grants", value = "many", adds = ["grant_access"], when = [{ like = ["*AllUsers*", "*AuthenticatedUsers*"], adds = ["make_public"] }, { like = "file*://*", adds = ["make_public", "value_from_file"] }] }
options.follow_symlinks         = { flag = "--follow-symlinks" }
options.no_follow_symlinks      = { flag = "--no-follow-symlinks" }
options.no_guess_mime_type      = { flag = "--no-guess-mime-type" }
options.sse_kms_key_id          = { flag = "--sse-kms-key-id", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.storage_class           = { flag = "--storage-class", value = "required" }
options.content_type            = { flag = "--content-type", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.cache_control           = { flag = "--cache-control", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_disposition     = { flag = "--content-disposition", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_encoding        = { flag = "--content-encoding", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_language        = { flag = "--content-language", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.expires                 = { flag = "--expires", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.source_region           = { flag = "--source-region", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.only_show_errors        = { flag = "--only-show-errors" }
options.no_progress             = { flag = "--no-progress" }
options.page_size               = { flag = "--page-size", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.ignore_glacier_warnings = { flag = "--ignore-glacier-warnings" }
options.force_glacier_transfer  = { flag = "--force-glacier-transfer" }
options.checksum_mode           = { flag = "--checksum-mode", value = "required" }
options.checksum_algorithm      = { flag = "--checksum-algorithm", value = "required" }
options.metadata_directive      = { flag = "--metadata-directive", value = "required" }
options.no_overwrite            = { flag = "--no-overwrite" }
options.recursive               = { flag = "--recursive" }
options.expected_size           = { flag = "--expected-size", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
operands.source                 = { adds = ["upload_local_file"], when = [{ like = "s3://*", adds = ["read_data"], removes = ["upload_local_file"] }] }
operands.destination            = { adds = ["write_local_file"], when = [{ like = "s3://*", adds = ["write_data"], removes = ["write_local_file"] }] }

[shell.s3_mv]
usage = "aws [global options] s3 mv [options] <source> <destination>"
adds  = ["delete_data"]
options.dryrun                  = { flag = "--dryrun", removes = ["write_data", "delete_data", "upload_local_file", "write_local_file", "make_public", "grant_access"] }
options.quiet                   = { flag = "--quiet" }
options.include                 = { flag = "--include", value = "required", repeated = true }
options.exclude                 = { flag = "--exclude", value = "required", repeated = true }
options.acl                     = { flag = "--acl", value = "required", when = [{ like = ["public-read", "public-read-write", "authenticated-read"], adds = ["make_public"] }] }
options.grants                  = { flag = "--grants", value = "many", adds = ["grant_access"], when = [{ like = ["*AllUsers*", "*AuthenticatedUsers*"], adds = ["make_public"] }, { like = "file*://*", adds = ["make_public", "value_from_file"] }] }
options.follow_symlinks         = { flag = "--follow-symlinks" }
options.no_follow_symlinks      = { flag = "--no-follow-symlinks" }
options.no_guess_mime_type      = { flag = "--no-guess-mime-type" }
options.sse_kms_key_id          = { flag = "--sse-kms-key-id", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.storage_class           = { flag = "--storage-class", value = "required" }
options.content_type            = { flag = "--content-type", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.cache_control           = { flag = "--cache-control", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_disposition     = { flag = "--content-disposition", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_encoding        = { flag = "--content-encoding", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_language        = { flag = "--content-language", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.expires                 = { flag = "--expires", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.source_region           = { flag = "--source-region", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.only_show_errors        = { flag = "--only-show-errors" }
options.no_progress             = { flag = "--no-progress" }
options.page_size               = { flag = "--page-size", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.ignore_glacier_warnings = { flag = "--ignore-glacier-warnings" }
options.force_glacier_transfer  = { flag = "--force-glacier-transfer" }
options.checksum_mode           = { flag = "--checksum-mode", value = "required" }
options.checksum_algorithm      = { flag = "--checksum-algorithm", value = "required" }
options.metadata_directive      = { flag = "--metadata-directive", value = "required" }
options.no_overwrite            = { flag = "--no-overwrite" }
options.recursive               = { flag = "--recursive" }
options.validate_same_s3_paths  = { flag = "--validate-same-s3-paths" }
operands.source                 = { adds = ["upload_local_file"], when = [{ like = "s3://*", adds = ["read_data"], removes = ["upload_local_file"] }] }
operands.destination            = { adds = ["write_local_file"], when = [{ like = "s3://*", adds = ["write_data"], removes = ["write_local_file"] }] }

[shell.s3_sync]
usage = "aws [global options] s3 sync [options] <source> <destination>"
options.dryrun                  = { flag = "--dryrun", removes = ["write_data", "delete_data", "upload_local_file", "write_local_file", "make_public", "grant_access"] }
options.quiet                   = { flag = "--quiet" }
options.include                 = { flag = "--include", value = "required", repeated = true }
options.exclude                 = { flag = "--exclude", value = "required", repeated = true }
options.acl                     = { flag = "--acl", value = "required", when = [{ like = ["public-read", "public-read-write", "authenticated-read"], adds = ["make_public"] }] }
options.grants                  = { flag = "--grants", value = "many", adds = ["grant_access"], when = [{ like = ["*AllUsers*", "*AuthenticatedUsers*"], adds = ["make_public"] }, { like = "file*://*", adds = ["make_public", "value_from_file"] }] }
options.follow_symlinks         = { flag = "--follow-symlinks" }
options.no_follow_symlinks      = { flag = "--no-follow-symlinks" }
options.no_guess_mime_type      = { flag = "--no-guess-mime-type" }
options.sse_kms_key_id          = { flag = "--sse-kms-key-id", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.storage_class           = { flag = "--storage-class", value = "required" }
options.content_type            = { flag = "--content-type", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.cache_control           = { flag = "--cache-control", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_disposition     = { flag = "--content-disposition", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_encoding        = { flag = "--content-encoding", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.content_language        = { flag = "--content-language", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.expires                 = { flag = "--expires", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.source_region           = { flag = "--source-region", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.only_show_errors        = { flag = "--only-show-errors" }
options.no_progress             = { flag = "--no-progress" }
options.page_size               = { flag = "--page-size", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.ignore_glacier_warnings = { flag = "--ignore-glacier-warnings" }
options.force_glacier_transfer  = { flag = "--force-glacier-transfer" }
options.checksum_mode           = { flag = "--checksum-mode", value = "required" }
options.checksum_algorithm      = { flag = "--checksum-algorithm", value = "required" }
options.metadata_directive      = { flag = "--metadata-directive", value = "required" }
options.no_overwrite            = { flag = "--no-overwrite" }
options.size_only               = { flag = "--size-only" }
options.exact_timestamps        = { flag = "--exact-timestamps" }
options.delete                  = { flag = "--delete", adds = ["delete_data"] }
operands.source                 = { adds = ["upload_local_file"], when = [{ like = "s3://*", adds = ["read_data"], removes = ["upload_local_file"] }] }
operands.destination            = { adds = ["write_local_file"], when = [{ like = "s3://*", adds = ["write_data"], removes = ["write_local_file"] }] }

[shell.s3_rm]
usage = "aws [global options] s3 rm [options] <path>"
adds  = ["delete_data"]
options.dryrun           = { flag = "--dryrun", removes = ["delete_data"] }
options.quiet            = { flag = "--quiet" }
options.recursive        = { flag = "--recursive" }
options.include          = { flag = "--include", value = "required", repeated = true }
options.exclude          = { flag = "--exclude", value = "required", repeated = true }
options.only_show_errors = { flag = "--only-show-errors" }
options.page_size        = { flag = "--page-size", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
operands.path            = { when = [{ like = "file*://*", adds = ["value_from_file"] }] }

[shell.s3_mb]
usage = "aws [global options] s3 mb <path>"
adds  = ["write_data"]
operands.path = { when = [{ like = "file*://*", adds = ["value_from_file"] }] }

[shell.s3_rb]
usage = "aws [global options] s3 rb [options] <path>"
adds  = ["delete_data"]
options.force = { flag = "--force" }
operands.path = { when = [{ like = "file*://*", adds = ["value_from_file"] }] }

[shell.s3_presign]
usage = "aws [global options] s3 presign [options] <path>"
adds  = ["grant_access"]
options.expires_in = { flag = "--expires-in", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
operands.path      = { when = [{ like = "file*://*", adds = ["value_from_file"] }] }

# --------------------------------------------------------------------------------------------------
# s3api: one API operation per command. Every value of these options is loaded from a local
# file when it starts with file:// or fileb:// (awscli/paramfile.py), so each one carries
# `value_from_file`.

[shell.s3api_list_buckets]
usage = "aws [global options] s3api list-buckets [options]"
adds  = ["read_data"]
options.prefix         = { flag = "--prefix", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.bucket_region  = { flag = "--bucket-region", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.starting_token = { flag = "--starting-token", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.page_size      = { flag = "--page-size", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.max_items      = { flag = "--max-items", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }

[shell.s3api_list_objects_v2]
usage = "aws [global options] s3api list-objects-v2 [options]"
adds  = ["read_data"]
options.bucket                = { flag = "--bucket", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.prefix                = { flag = "--prefix", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.delimiter             = { flag = "--delimiter", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.start_after           = { flag = "--start-after", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.fetch_owner           = { flag = "--fetch-owner" }
options.no_fetch_owner        = { flag = "--no-fetch-owner" }
options.expected_bucket_owner = { flag = "--expected-bucket-owner", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.starting_token        = { flag = "--starting-token", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.page_size             = { flag = "--page-size", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.max_items             = { flag = "--max-items", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }

[shell.s3api_head_object]
usage = "aws [global options] s3api head-object [options]"
adds  = ["read_data"]
options.bucket                = { flag = "--bucket", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.key                   = { flag = "--key", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.version_id            = { flag = "--version-id", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.expected_bucket_owner = { flag = "--expected-bucket-owner", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }

[shell.s3api_get_object]
usage = "aws [global options] s3api get-object [options] <outfile>"
adds  = ["read_data", "write_local_file"]
options.bucket                = { flag = "--bucket", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.key                   = { flag = "--key", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.version_id            = { flag = "--version-id", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
options.range                 = { flag = "--range", value = "required", when = [{ like = "file*://*", adds = ["value_from_file"] }] }
