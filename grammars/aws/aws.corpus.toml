# Golden cases for aws.grammar.toml, checked against aws-cli 2.40.0.
#
# Sources: the `help` page of each command at 2.40.0 (`aws <service> <operation> help`), and the
# source at tag 2.40.0: awscli/clidriver.py and awscli/argparser.py (how a line is parsed),
# awscli/data/cli.json (the global options), awscli/paramfile.py (file:// and fileb:// values),
# awscli/arguments.py (a list option takes words with nargs "*", a boolean has a --no- form), and
# awscli/customizations/ (s3, logs tail, cloudformation deploy, configure).
#
# The expected action, fields, and effects come from that documented behaviour. A case with no
# `effects` key expects no effect.

# ==================================================================================================
# Global options (aws help, GLOBAL OPTIONS; awscli/data/cli.json)
# ==================================================================================================

# The simplest read. get-caller-identity takes no parameter of its own.
[[case]]
argv = ["aws", "sts", "get-caller-identity"]
action = "sts_get_caller_identity"
effects = ["read_data"]

# A global option before the service name, with `--x v`.
[[case]]
argv = ["aws", "--region", "us-east-1", "sts", "get-caller-identity"]
action = "sts_get_caller_identity"
fields = { region = "us-east-1" }
effects = ["read_data"]

# The `--x=v` spelling of a global option, after the operation.
[[case]]
argv = ["aws", "sts", "get-caller-identity", "--region=eu-west-1", "--output=json"]
action = "sts_get_caller_identity"
fields = { region = "eu-west-1", output = "json" }
effects = ["read_data"]

# The main parser reads global options anywhere, so one between the service and the command
# counts. `--profile` selects other credentials, so it adds `change_account`.
[[case]]
argv = ["aws", "s3", "--profile", "prod", "ls"]
action = "s3_ls"
fields = { profile = "prod" }
effects = ["change_account", "read_data"]

# Every other global option that takes a value or is a flag. None of them adds an effect.
[[case]]
argv = ["aws", "ec2", "describe-vpcs", "--debug", "--no-paginate", "--query", "Vpcs[].VpcId", "--color", "off", "--no-sign-request", "--cli-read-timeout", "5", "--cli-connect-timeout", "5", "--cli-binary-format", "raw-in-base64-out", "--no-cli-pager", "--no-cli-auto-prompt", "--cli-error-format", "json"]
action = "ec2_describe_vpcs"
fields = { debug = true, no_paginate = true, query = "Vpcs[].VpcId", color = "off", no_sign_request = true, cli_read_timeout = "5", cli_connect_timeout = "5", cli_binary_format = "raw-in-base64-out", no_cli_pager = true, no_cli_auto_prompt = true, cli_error_format = "json" }
effects = ["read_data"]

# `--endpoint-url` sends signed requests to another URL. An http:// URL also has no TLS.
[[case]]
argv = ["aws", "--endpoint-url", "http://localhost:4566", "s3", "ls"]
action = "s3_ls"
fields = { endpoint_url = "http://localhost:4566" }
effects = ["insecure_tls", "override_endpoint", "read_data"]

[[case]]
argv = ["aws", "s3", "ls", "--endpoint-url=https://s3.example.com"]
action = "s3_ls"
fields = { endpoint_url = "https://s3.example.com" }
effects = ["override_endpoint", "read_data"]

# `--no-verify-ssl` skips certificate checks, and `--ca-bundle` trusts a bundle the line names.
[[case]]
argv = ["aws", "sts", "get-caller-identity", "--no-verify-ssl"]
action = "sts_get_caller_identity"
fields = { no_verify_ssl = true }
effects = ["insecure_tls", "read_data"]

[[case]]
argv = ["aws", "--ca-bundle", "./ca.pem", "sts", "get-caller-identity"]
action = "sts_get_caller_identity"
fields = { ca_bundle = "./ca.pem" }
effects = ["insecure_tls", "read_data"]

# A value that starts with `-` but is a number: argparse takes `-1` as the value of a required
# option, and so does the grammar.
[[case]]
argv = ["aws", "sts", "get-caller-identity", "--cli-read-timeout", "-1"]
action = "sts_get_caller_identity"
fields = { cli_read_timeout = "-1" }
effects = ["read_data"]

# A global option given twice is unmodeled (argparse keeps the last one; the grammar refuses to
# guess).
[[case]]
argv = ["aws", "--region", "us-east-1", "sts", "get-caller-identity", "--region", "eu-west-1"]
action = "unmodeled"

# A global option with no value.
[[case]]
argv = ["aws", "sts", "get-caller-identity", "--region"]
action = "unmodeled"

# argparse accepts a unique prefix (`--reg`). The grammar does not.
[[case]]
argv = ["aws", "--reg", "us-east-1", "sts", "get-caller-identity"]
action = "unmodeled"

# `--cli-auto-prompt` opens a prompt that can build any command, so it is not declared.
[[case]]
argv = ["aws", "--cli-auto-prompt", "s3", "ls"]
action = "unmodeled"

# `--version`, `--help`, and `help` are not modeled.
[[case]]
argv = ["aws", "--version"]
action = "unmodeled"

[[case]]
argv = ["aws", "s3", "ls", "--version"]
action = "unmodeled"

[[case]]
argv = ["aws", "sts", "get-caller-identity", "--help"]
action = "unmodeled"

[[case]]
argv = ["aws", "help"]
action = "unmodeled"

[[case]]
argv = ["aws", "s3", "help"]
action = "unmodeled"

# After an API operation, `help` is the operation parser's optional `help` positional
# (clidriver.py, ServiceOperation._add_help). The grammar has no operand there, so it is unmodeled.
[[case]]
argv = ["aws", "sts", "get-caller-identity", "help"]
action = "unmodeled"

# The program alone, an unknown service, and a service with no operation.
[[case]]
argv = ["aws"]
action = "unmodeled"

[[case]]
argv = ["aws", "ecs", "list-clusters"]
action = "unmodeled"

[[case]]
argv = ["aws", "sts"]
action = "unmodeled"

# Command words are case sensitive.
[[case]]
argv = ["aws", "STS", "get-caller-identity"]
action = "unmodeled"

# `--cli-input-json` and `--cli-input-yaml` can set any parameter of the operation, so a line with
# either one is unmodeled. So is `--generate-cli-skeleton`.
[[case]]
argv = ["aws", "ssm", "get-parameter", "--cli-input-json", "{\"Name\":\"/db\",\"WithDecryption\":true}"]
action = "unmodeled"

[[case]]
argv = ["aws", "dynamodb", "put-item", "--cli-input-yaml", "file://item.yaml"]
action = "unmodeled"

[[case]]
argv = ["aws", "ec2", "terminate-instances", "--generate-cli-skeleton"]
action = "unmodeled"

# ==================================================================================================
# sts (aws sts assume-role help, get-session-token help)
# ==================================================================================================

[[case]]
argv = ["aws", "sts", "assume-role", "--role-arn", "arn:aws:iam::123456789012:role/Deploy", "--role-session-name", "agent", "--duration-seconds", "900"]
action = "sts_assume_role"
fields = { role_arn = "arn:aws:iam::123456789012:role/Deploy", role_session_name = "agent", duration_seconds = "900" }
effects = ["credentials"]

# A session policy from a local file: the CLI sends the file content, which the rule cannot see.
# `--policy-arns` is a list, so it takes several words.
[[case]]
argv = ["aws", "sts", "assume-role", "--role-arn=arn:aws:iam::123456789012:role/Deploy", "--role-session-name=agent", "--policy", "file://session-policy.json", "--policy-arns", "arn=arn:aws:iam::aws:policy/ReadOnlyAccess", "arn=arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess"]
action = "sts_assume_role"
fields = { role_arn = "arn:aws:iam::123456789012:role/Deploy", role_session_name = "agent", policy = "file://session-policy.json", policy_arns = ["arn=arn:aws:iam::aws:policy/ReadOnlyAccess", "arn=arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess"] }
effects = ["credentials", "value_from_file"]

[[case]]
argv = ["aws", "sts", "get-session-token", "--serial-number", "arn:aws:iam::123456789012:mfa/me", "--token-code", "123456"]
action = "sts_get_session_token"
fields = { serial_number = "arn:aws:iam::123456789012:mfa/me", token_code = "123456" }
effects = ["credentials"]

# `--tags` is not declared, so the line is unmodeled.
[[case]]
argv = ["aws", "sts", "assume-role", "--role-arn", "arn:aws:iam::123456789012:role/Deploy", "--role-session-name", "a", "--tags", "Key=team,Value=x"]
action = "unmodeled"

# ==================================================================================================
# s3 high-level commands (aws s3 <command> help; awscli/customizations/s3/subcommands.py)
# ==================================================================================================

# `aws s3 ls` with no path lists the buckets.
[[case]]
argv = ["aws", "s3", "ls"]
action = "s3_ls"
effects = ["read_data"]

[[case]]
argv = ["aws", "s3", "ls", "s3://logs/2026/", "--recursive", "--human-readable", "--summarize", "--page-size", "100"]
action = "s3_ls"
fields = { path = "s3://logs/2026/", recursive = true, human_readable = true, summarize = true, page_size = "100" }
effects = ["read_data"]

# The single path of ls is loaded from a file when it starts with file://.
[[case]]
argv = ["aws", "s3", "ls", "file://bucket.txt"]
action = "s3_ls"
fields = { path = "file://bucket.txt" }
effects = ["read_data", "value_from_file"]

# `aws s3 ls help` prints help (ArgTableArgParser reads a lone `help`). The grammar reads it as a
# path, with the effects of a list. That is more than the CLI does, never less.
[[case]]
argv = ["aws", "s3", "ls", "help"]
action = "s3_ls"
fields = { path = "help" }
effects = ["read_data"]

# ls takes one path at most.
[[case]]
argv = ["aws", "s3", "ls", "s3://a", "s3://b"]
action = "unmodeled"

# Upload: a local source sends local files, and an s3:// destination writes to S3.
[[case]]
argv = ["aws", "s3", "cp", "./dist", "s3://site-bucket/", "--recursive"]
action = "s3_cp"
fields = { source = "./dist", destination = "s3://site-bucket/", recursive = true }
effects = ["upload_local_file", "write_data"]

# Download: an s3:// source reads, and a local destination writes a local file.
[[case]]
argv = ["aws", "s3", "cp", "s3://data/report.csv", "./report.csv"]
action = "s3_cp"
fields = { source = "s3://data/report.csv", destination = "./report.csv" }
effects = ["read_data", "write_local_file"]

# Copy between buckets, with options before the operands.
[[case]]
argv = ["aws", "s3", "cp", "--recursive", "--storage-class", "STANDARD_IA", "s3://a/x/", "s3://b/x/"]
action = "s3_cp"
fields = { recursive = true, storage_class = "STANDARD_IA", source = "s3://a/x/", destination = "s3://b/x/" }
effects = ["read_data", "write_data"]

# `-` as the source is standard input, and as the destination is standard output. A lone `-` is
# an operand.
[[case]]
argv = ["aws", "s3", "cp", "-", "s3://b/stream.txt"]
action = "s3_cp"
fields = { source = "-", destination = "s3://b/stream.txt" }
effects = ["upload_local_file", "write_data"]

[[case]]
argv = ["aws", "s3", "cp", "s3://b/stream.txt", "-"]
action = "s3_cp"
fields = { source = "s3://b/stream.txt", destination = "-" }
effects = ["read_data", "write_local_file"]

# A public canned ACL adds `make_public`. `authenticated-read` grants every AWS account.
[[case]]
argv = ["aws", "s3", "cp", "index.html", "s3://site/index.html", "--acl", "public-read"]
action = "s3_cp"
fields = { source = "index.html", destination = "s3://site/index.html", acl = "public-read" }
effects = ["make_public", "upload_local_file", "write_data"]

[[case]]
argv = ["aws", "s3", "cp", "a.txt", "s3://b/a.txt", "--acl=authenticated-read"]
action = "s3_cp"
fields = { source = "a.txt", destination = "s3://b/a.txt", acl = "authenticated-read" }
effects = ["make_public", "upload_local_file", "write_data"]

[[case]]
argv = ["aws", "s3", "cp", "a.txt", "s3://b/a.txt", "--acl", "bucket-owner-full-control"]
action = "s3_cp"
fields = { source = "a.txt", destination = "s3://b/a.txt", acl = "bucket-owner-full-control" }
effects = ["upload_local_file", "write_data"]

# `--grants` takes one or more grants. Each grant adds `grant_access`, and a grant to the AllUsers
# group adds `make_public`.
[[case]]
argv = ["aws", "s3", "cp", "a.txt", "s3://b/a.txt", "--grants", "read=uri=http://acs.amazonaws.com/groups/global/AllUsers", "full=id=79a59df900b949e5"]
action = "s3_cp"
fields = { source = "a.txt", destination = "s3://b/a.txt", grants = ["read=uri=http://acs.amazonaws.com/groups/global/AllUsers", "full=id=79a59df900b949e5"] }
effects = ["grant_access", "make_public", "upload_local_file", "write_data"]

[[case]]
argv = ["aws", "s3", "cp", "a.txt", "s3://b/a.txt", "--grants", "read=id=79a59df900b949e5"]
action = "s3_cp"
fields = { source = "a.txt", destination = "s3://b/a.txt", grants = ["read=id=79a59df900b949e5"] }
effects = ["grant_access", "upload_local_file", "write_data"]

# A one-item `--grants` list is loaded from a file, so its content is unknown: assume public.
[[case]]
argv = ["aws", "s3", "cp", "a.txt", "s3://b/a.txt", "--grants", "file://grants.txt"]
action = "s3_cp"
fields = { source = "a.txt", destination = "s3://b/a.txt", grants = ["file://grants.txt"] }
effects = ["grant_access", "make_public", "upload_local_file", "value_from_file", "write_data"]

# `--exclude` and `--include` repeat, and each value is kept.
[[case]]
argv = ["aws", "s3", "cp", ".", "s3://b/docs/", "--recursive", "--exclude", "*", "--include", "*.md", "--include=*.txt"]
action = "s3_cp"
fields = { source = ".", destination = "s3://b/docs/", recursive = true, exclude = ["*"], include = ["*.md", "*.txt"] }
effects = ["upload_local_file", "write_data"]

# `--dryrun` shows what would happen and changes nothing. A download still lists the source.
[[case]]
argv = ["aws", "s3", "cp", "s3://data/", "./data", "--recursive", "--dryrun"]
action = "s3_cp"
fields = { source = "s3://data/", destination = "./data", recursive = true, dryrun = true }
effects = ["read_data"]

# `removes` wins: a dry-run upload with a public ACL has no effect at all.
[[case]]
argv = ["aws", "s3", "cp", "--dryrun", "index.html", "s3://site/", "--acl", "public-read"]
action = "s3_cp"
fields = { dryrun = true, source = "index.html", destination = "s3://site/", acl = "public-read" }

# `--sse` takes an optional value (nargs "?"), which the grammar cannot spell, so it is not declared.
[[case]]
argv = ["aws", "s3", "cp", "a.txt", "s3://b/a.txt", "--sse", "aws:kms"]
action = "unmodeled"

# A prefix of a long option, a missing operand, and an extra operand.
[[case]]
argv = ["aws", "s3", "cp", "a.txt", "s3://b/", "--recurs"]
action = "unmodeled"

[[case]]
argv = ["aws", "s3", "cp", "a.txt"]
action = "unmodeled"

[[case]]
argv = ["aws", "s3", "cp", "a.txt", "b.txt", "s3://b/"]
action = "unmodeled"

# `--` ends the options, so `-x` after it is the source. (The grammar reads it so; the effects are
# those of an upload either way.)
[[case]]
argv = ["aws", "s3", "cp", "--", "-x", "s3://b/-x"]
action = "s3_cp"
fields = { source = "-x", destination = "s3://b/-x" }
effects = ["upload_local_file", "write_data"]

# mv deletes the source after the copy. From a local source, it deletes the local files.
[[case]]
argv = ["aws", "s3", "mv", "./out.log", "s3://logs/out.log"]
action = "s3_mv"
fields = { source = "./out.log", destination = "s3://logs/out.log" }
effects = ["delete_data", "upload_local_file", "write_data"]

[[case]]
argv = ["aws", "s3", "mv", "s3://a/k", "s3://b/k", "--dryrun"]
action = "s3_mv"
fields = { source = "s3://a/k", destination = "s3://b/k", dryrun = true }
effects = ["read_data"]

[[case]]
argv = ["aws", "s3", "mv", "s3://a/", "s3://b/", "--recursive", "--validate-same-s3-paths"]
action = "s3_mv"
fields = { source = "s3://a/", destination = "s3://b/", recursive = true, validate_same_s3_paths = true }
effects = ["delete_data", "read_data", "write_data"]

# sync is recursive. `--delete` removes destination files that the source does not have.
[[case]]
argv = ["aws", "s3", "sync", "./site", "s3://site-bucket", "--delete", "--exact-timestamps"]
action = "s3_sync"
fields = { source = "./site", destination = "s3://site-bucket", delete = true, exact_timestamps = true }
effects = ["delete_data", "upload_local_file", "write_data"]

[[case]]
argv = ["aws", "s3", "sync", "s3://backup", "./restore", "--size-only"]
action = "s3_sync"
fields = { source = "s3://backup", destination = "./restore", size_only = true }
effects = ["read_data", "write_local_file"]

[[case]]
argv = ["aws", "s3", "sync", "s3://backup", "./restore", "--delete", "--dryrun"]
action = "s3_sync"
fields = { source = "s3://backup", destination = "./restore", delete = true, dryrun = true }
effects = ["read_data"]

# sync has no `--recursive` option.
[[case]]
argv = ["aws", "s3", "sync", ".", "s3://b", "--recursive"]
action = "unmodeled"

[[case]]
argv = ["aws", "s3", "rm", "s3://b/old.txt"]
action = "s3_rm"
fields = { path = "s3://b/old.txt" }
effects = ["delete_data"]

[[case]]
argv = ["aws", "s3", "rm", "s3://b/logs/", "--recursive", "--exclude", "*", "--include", "*.tmp", "--quiet"]
action = "s3_rm"
fields = { path = "s3://b/logs/", recursive = true, exclude = ["*"], include = ["*.tmp"], quiet = true }
effects = ["delete_data"]

[[case]]
argv = ["aws", "s3", "rm", "s3://b/", "--recursive", "--dryrun"]
action = "s3_rm"
fields = { path = "s3://b/", recursive = true, dryrun = true }

# The path of rm comes from a file: the rule sees `file://...`, not the S3 path.
[[case]]
argv = ["aws", "s3", "rm", "file://target.txt"]
action = "s3_rm"
fields = { path = "file://target.txt" }
effects = ["delete_data", "value_from_file"]

[[case]]
argv = ["aws", "s3", "rm"]
action = "unmodeled"

[[case]]
argv = ["aws", "s3", "mb", "s3://new-bucket", "--region", "eu-west-1"]
action = "s3_mb"
fields = { path = "s3://new-bucket", region = "eu-west-1" }
effects = ["write_data"]

# `--tags <key> <value>` takes two words, which the grammar cannot spell.
[[case]]
argv = ["aws", "s3", "mb", "s3://new-bucket", "--tags", "team", "x"]
action = "unmodeled"

# rb `--force` deletes every object first.
[[case]]
argv = ["aws", "s3", "rb", "s3://old-bucket", "--force"]
action = "s3_rb"
fields = { path = "s3://old-bucket", force = true }
effects = ["delete_data"]

# presign makes a URL that lets whoever holds it read the object. It makes no request.
[[case]]
argv = ["aws", "s3", "presign", "s3://b/report.pdf", "--expires-in", "600"]
action = "s3_presign"
fields = { path = "s3://b/report.pdf", expires_in = "600" }
effects = ["grant_access"]

# ==================================================================================================
# s3api (aws s3api <operation> help)
# ==================================================================================================

[[case]]
argv = ["aws", "s3api", "list-buckets", "--prefix", "app-", "--max-items", "10"]
action = "s3api_list_buckets"
fields = { prefix = "app-", max_items = "10" }
effects = ["read_data"]

[[case]]
argv = ["aws", "s3api", "list-objects-v2", "--bucket", "b", "--prefix", "logs/", "--page-size", "100", "--starting-token", "tok"]
action = "s3api_list_objects_v2"
fields = { bucket = "b", prefix = "logs/", page_size = "100", starting_token = "tok" }
effects = ["read_data"]

# A boolean parameter has a `--no-` form.
[[case]]
argv = ["aws", "s3api", "list-objects-v2", "--bucket=b", "--no-fetch-owner"]
action = "s3api_list_objects_v2"
fields = { bucket = "b", no_fetch_owner = true }
effects = ["read_data"]

[[case]]
argv = ["aws", "s3api", "head-object", "--bucket", "b", "--key", "k", "--version-id", "v1"]
action = "s3api_head_object"
fields = { bucket = "b", key = "k", version_id = "v1" }
effects = ["read_data"]

# get-object writes the object to the <outfile> operand.
[[case]]
argv = ["aws", "s3api", "get-object", "--bucket", "b", "--key", "k", "out.bin", "--range", "bytes=0-99"]
action = "s3api_get_object"
fields = { bucket = "b", key = "k", outfile = "out.bin", range = "bytes=0-99" }
effects = ["read_data", "write_local_file"]

[[case]]
argv = ["aws", "s3api", "get-object", "--bucket", "b", "--key", "k"]
action = "unmodeled"

[[case]]
argv = ["aws", "s3api", "get-bucket-policy", "--bucket", "b"]
action = "s3api_get_bucket_policy"
fields = { bucket = "b" }
effects = ["read_data"]

# `--body` names a local file whose content is uploaded.
[[case]]
argv = ["aws", "s3api", "put-object", "--bucket", "b", "--key", "k", "--body", "./k.txt", "--content-type", "text/plain"]
action = "s3api_put_object"
fields = { bucket = "b", key = "k", body = "./k.txt", content_type = "text/plain" }
effects = ["upload_local_file", "write_data"]

[[case]]
argv = ["aws", "s3api", "put-object", "--bucket", "b", "--key", "k", "--acl", "public-read-write"]
action = "s3api_put_object"
fields = { bucket = "b", key = "k", acl = "public-read-write" }
effects = ["make_public", "write_data"]

# An ACL from a file is unknown, so it is taken to be public.
[[case]]
argv = ["aws", "s3api", "put-object", "--bucket", "b", "--key", "k", "--acl", "file://acl.txt"]
action = "s3api_put_object"
fields = { bucket = "b", key = "k", acl = "file://acl.txt" }
effects = ["make_public", "value_from_file", "write_data"]

[[case]]
argv = ["aws", "s3api", "put-object", "--bucket", "b", "--key", "k", "--grant-read", "uri=http://acs.amazonaws.com/groups/global/AllUsers"]
action = "s3api_put_object"
fields = { bucket = "b", key = "k", grant_read = "uri=http://acs.amazonaws.com/groups/global/AllUsers" }
effects = ["grant_access", "make_public", "write_data"]

[[case]]
argv = ["aws", "s3api", "put-object", "--bucket", "b", "--key", "k", "--grant-full-control", "id=79a59df900b949e5"]
action = "s3api_put_object"
fields = { bucket = "b", key = "k", grant_full_control = "id=79a59df900b949e5" }
effects = ["grant_access", "write_data"]

[[case]]
argv = ["aws", "s3api", "put-object", "--bucket", "b", "--key", "k", "--metadata", "a=b"]
action = "unmodeled"

[[case]]
argv = ["aws", "s3api", "delete-object", "--bucket", "b", "--key", "k", "--version-id", "v1"]
action = "s3api_delete_object"
fields = { bucket = "b", key = "k", version_id = "v1" }
effects = ["delete_data"]

# A bucket name from a file: a rule on `bucket` cannot see the real name.
[[case]]
argv = ["aws", "s3api", "delete-object", "--bucket", "file://bucket.txt", "--key", "k"]
action = "s3api_delete_object"
fields = { bucket = "file://bucket.txt", key = "k" }
effects = ["delete_data", "value_from_file"]

[[case]]
