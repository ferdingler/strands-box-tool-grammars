# Golden cases for vercel.grammar.toml, checked against Vercel CLI 65.14.0: `vercel <command> --help`
# (the evidence help files) and the published JavaScript CLI in `@vercel/cli-support@65.14.0`.
# Each expectation was written from that behaviour, not from the parser's output.
#
# `fields` lists only fields that do not hold their default. An `unmodeled` case has no fields and
# no effects.

# ================================================================ deploy

# `vercel deploy` with no target can still go to production: the CLI sends a project's first
# deployment to production ("This is the project's first deployment, so it will go to production").
[[case]]
argv = ["vercel", "deploy"]
action = "deploy"
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

# `--prod` is a production deployment (`vercel deploy --help`: "Create a production deployment").
[[case]]
argv = ["vercel", "deploy", "--prod"]
action = "deploy"
fields = { prod = true }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

# `--environment preview` names the preview target and removes the production effects.
# `--environment=value` and `--environment value` are both arg@5 spellings.
[[case]]
argv = ["vercel", "deploy", "--environment", "preview"]
action = "deploy"
fields = { environment = "preview" }
effects = ["deploy", "export_local_env"]

[[case]]
argv = ["vercel", "deploy", "--environment=preview", "./site"]
action = "deploy"
fields = { environment = "preview", project_path = "./site" }
effects = ["deploy", "export_local_env"]

# The CLI ignores `--prod` when `--environment` is set ("Ignoring --prod because --environment is
# also set"), so the preview target wins here too.
[[case]]
argv = ["vercel", "deploy", "--prod", "--environment", "preview"]
action = "deploy"
fields = { prod = true, environment = "preview" }
effects = ["deploy", "export_local_env"]

# A custom environment is not known to be non-production, so it keeps the production effects.
[[case]]
argv = ["vercel", "deploy", "--environment", "staging"]
action = "deploy"
fields = { environment = "staging" }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

# `--skip-domain` disables the automatic aliasing of production domains.
[[case]]
argv = ["vercel", "deploy", "--prod", "--skip-domain"]
action = "deploy"
fields = { prod = true, skip_domain = true }
effects = ["deploy", "deploy_production", "export_local_env"]

# `--dry` inspects inputs "without uploading or creating a deployment".
[[case]]
argv = ["vercel", "deploy", "--dry", "--json"]
action = "deploy"
fields = { dry = true, json = true }
effects = ["export_local_env"]

# `--prebuilt` deploys the local `.vercel/output`; `--force` and `--with-cache` are flags.
[[case]]
argv = ["vercel", "deploy", "--prebuilt", "--prod", "--force", "--with-cache"]
action = "deploy"
fields = { prebuilt = true, prod = true, force = true, with_cache = true }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

# `--temporary` deploys without login, after a local build (`runImplicitBuild` runs `build --prod`).
[[case]]
argv = ["vercel", "deploy", "--temporary"]
action = "deploy"
fields = { temporary = true }
effects = ["deploy", "deploy_production", "change_traffic", "run_local_code", "write_local_files", "export_local_env"]

# `--env` and `--build-env` are repeatable `[String]` options; values that look like flags are data.
# Every `--env`/`--build-env` adds `export_local_env`, because a value with no `=` copies the
# CLI's own environment variable (deploy/index.js `addProcessEnv`).
[[case]]
argv = ["vercel", "deploy", "--env", "A=1", "--env=B=2", "--build-env", "C=--x", "--meta", "k=v"]
action = "deploy"
fields = { env = ["A=1", "B=2"], build_env = ["C=--x"], meta = ["k=v"] }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

[[case]]
argv = ["vercel", "deploy", "--environment", "preview", "--build-env", "NPM_TOKEN"]
action = "deploy"
fields = { environment = "preview", build_env = ["NPM_TOKEN"] }
effects = ["deploy", "export_local_env"]

# `-p` names the project; `--create-if-missing` creates it; `-y` skips prompts.
[[case]]
argv = ["vercel", "deploy", "-y", "-p", "web", "--create-if-missing", "--environment", "preview"]
action = "deploy"
fields = { yes = true, project = "web", create_if_missing = true, environment = "preview" }
effects = ["deploy", "write_remote", "write_local_files", "skip_prompt", "export_local_env"]

# `deploy --yes` in an unlinked directory creates and links a project (`ensureLink` autoConfirm).
[[case]]
argv = ["vercel", "deploy", "--yes", "--environment", "preview"]
action = "deploy"
fields = { yes = true, environment = "preview" }
effects = ["deploy", "write_remote", "write_local_files", "skip_prompt", "export_local_env"]

# `--verify` creates the Protection Bypass for Automation secret if it is missing.
[[case]]
argv = ["vercel", "deploy", "--verify", "--environment", "preview"]
action = "deploy"
fields = { verify = true, environment = "preview" }
effects = ["deploy", "write_remote", "export_local_env"]

# Other value options: `--regions`, `--archive`, `--delete-project-after`.
[[case]]
argv = ["vercel", "deploy", "--regions", "iad1", "--archive=tgz", "--delete-project-after", "1d", "--no-wait", "--logs", "--turbo", "--guidance"]
action = "deploy"
fields = { regions = "iad1", archive = "tgz", delete_project_after = "1d", no_wait = true, logs = true, turbo = true, guidance = true }
effects = ["deploy", "deploy_production", "change_traffic", "write_remote", "export_local_env"]

# A path operand after `--` is data, even when it looks like a flag.
[[case]]
argv = ["vercel", "deploy", "--", "--prod"]
action = "deploy"
fields = { project_path = "--prod" }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

# FINDINGS.md: the bare program and a bare path also deploy.
[[case]]
argv = ["vercel"]
action = "deploy"
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

[[case]]
argv = ["vercel", "./site"]
action = "deploy"
fields = { project_path = "./site" }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

[[case]]
argv = ["vercel", "--prod"]
action = "deploy"
fields = { prod = true }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

[[case]]
argv = ["vercel", "--token", "x", "--dry", "./site"]
action = "deploy"
fields = { dry = true, project_path = "./site", token = "x" }
effects = ["export_local_env", "token_argument"]

# A first operand that does not start with `.` or hold a `/` is never a path: a typo, a subcommand
# this grammar does not model, or a directory name that must be written as `./site`.
[[case]]
argv = ["vercel", "lss"]
action = "unmodeled"

[[case]]
argv = ["vercel", "site"]
action = "unmodeled"

[[case]]
argv = ["vercel", "--prod", "--", "integration"]
action = "unmodeled"

# `vercel deploy` reads any first operand as the path.
[[case]]
argv = ["vercel", "deploy", "site"]
action = "deploy"
fields = { project_path = "site" }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

# `-e` on deploy is the deprecated shorthand of `--env`, not `--environment`; it is not declared.
[[case]]
argv = ["vercel", "deploy", "-e", "production"]
action = "unmodeled"

# The deprecated `--target` is not declared.
[[case]]
argv = ["vercel", "deploy", "--target", "preview"]
action = "unmodeled"

# `--prod=false` is still `--prod` to arg@5 (a Boolean ignores `=value`), so it is not modeled.
[[case]]
argv = ["vercel", "deploy", "--prod=false"]
action = "unmodeled"

# No abbreviation: `--pro` is not `--prod`.
[[case]]
argv = ["vercel", "deploy", "--pro"]
action = "unmodeled"

# Two paths are too many operands.
[[case]]
argv = ["vercel", "deploy", "a", "b"]
action = "unmodeled"

# A value option given twice is not modeled (arg@5 keeps the last one).
[[case]]
argv = ["vercel", "deploy", "--environment", "preview", "--environment", "production"]
action = "unmodeled"

# `--help` is not declared.
[[case]]
argv = ["vercel", "deploy", "--help"]
action = "unmodeled"

# `vercel deploy init` is a subcommand, not a deploy of a directory named `init`.
[[case]]
argv = ["vercel", "deploy", "init", "--prod", "-y"]
action = "deploy_init"
fields = { prod = true, yes = true }
effects = ["deploy", "deploy_production", "change_traffic", "skip_prompt", "export_local_env"]

[[case]]
argv = ["vercel", "deploy", "init", "--environment", "preview", "--env", "A=1"]
action = "deploy_init"
fields = { environment = "preview", env = ["A=1"] }
effects = ["deploy", "export_local_env"]

# The words after `init` are the paths to deploy (`handleInitDeployment`).
[[case]]
argv = ["vercel", "deploy", "init", "./site"]
action = "deploy_init"
fields = { project_path = "./site" }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

[[case]]
argv = ["vercel", "deploy", "init", "a", "b"]
action = "unmodeled"

[[case]]
argv = ["vercel", "deploy", "continue", "--deployment", "dpl_1"]
action = "deploy_continue"
fields = { deployment = "dpl_1" }
effects = ["deploy", "deploy_production", "change_traffic"]

[[case]]
argv = ["vercel", "deploy", "describe", "--deployment", "dpl_1", "--aws-account-id", "123456789012", "--json"]
action = "deploy_describe"
fields = { deployment = "dpl_1", aws_account_id = "123456789012", json = true }
effects = ["read_remote", "write_local_files"]

# ================================================================ global options

# Global options are parsed over the whole line: before, between, and after the command words.
[[case]]
argv = ["vercel", "--scope", "acme", "deploy", "--prod"]
action = "deploy"
fields = { scope = "acme", prod = true }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

[[case]]
argv = ["vercel", "deploy", "--prod", "-S", "acme", "--cwd", "/work/app"]
action = "deploy"
fields = { scope = "acme", prod = true, cwd_option = "/work/app" }
effects = ["deploy", "deploy_production", "change_traffic", "export_local_env"]

[[case]]
argv = ["vercel", "env", "--scope=acme", "ls"]
action = "env_list"
fields = { scope = "acme" }
effects = ["read_remote"]

# `-t`/`--token` passes a login token; `-A` and `-Q` name other configuration.
[[case]]
argv = ["vercel", "list", "-t", "tok_123"]
action = "list"
fields = { token = "tok_123" }
effects = ["read_remote", "token_argument"]

[[case]]
argv = ["vercel", "--token=tok_123", "-Q", "/tmp/vc", "-A", "other.json", "list"]
action = "list"
fields = { token = "tok_123", global_config = "/tmp/vc", local_config = "other.json" }
effects = ["read_remote", "token_argument", "override_config"]

[[case]]
argv = ["vercel", "--global-config", "/tmp/vc", "whoami"]
action = "whoami"
fields = { global_config = "/tmp/vc" }
effects = ["read_remote", "override_config"]

# Flags `-d`, `--no-color`, `--non-interactive`; a cluster of flags and a final value letter.
[[case]]
argv = ["vercel", "-d", "list", "--no-color", "--non-interactive"]
action = "list"
fields = { debug = true, no_color = true, non_interactive = true }
effects = ["read_remote"]

[[case]]
argv = ["vercel", "list", "-adS", "acme"]
action = "list"
fields = { all = true, debug = true, scope = "acme" }
effects = ["read_remote"]

# A global option given before and after the words counts twice.
[[case]]
argv = ["vercel", "-S", "a", "list", "-S", "b"]
action = "unmodeled"

# `--api` sends requests (and the token) to another API URL; `-T`/`--team` is hidden. Neither is
# declared.
[[case]]
argv = ["vercel", "--api", "https://example.test", "list"]
action = "unmodeled"

[[case]]
argv = ["vercel", "list", "--team", "acme"]
action = "unmodeled"

# `--version`, `-v`, `-h`, and `help` are not modeled.
[[case]]
argv = ["vercel", "--version"]
action = "unmodeled"

[[case]]
argv = ["vercel", "list", "-h"]
action = "unmodeled"

[[case]]
argv = ["vercel", "help", "deploy"]
action = "unmodeled"

# An unknown command runs a `vercel-<name>` extension in the CLI; it is not modeled.
[[case]]
argv = ["vercel", "frobnicate"]
action = "unmodeled"

# Command words are case sensitive.
[[case]]
argv = ["vercel", "LIST"]
action = "unmodeled"

# ================================================================ redeploy, promote, rollback, remove

# `redeploy` defaults to "the original deployment's environment", which can be production.
[[case]]
argv = ["vercel", "redeploy", "my-app-abc.vercel.app"]
action = "redeploy"
fields = { deployment = "my-app-abc.vercel.app" }
effects = ["deploy", "deploy_production", "change_traffic"]

[[case]]
argv = ["vercel", "redeploy", "dpl_1", "-e", "preview", "--no-wait", "--json"]
action = "redeploy"
fields = { deployment = "dpl_1", environment = "preview", no_wait = true, json = true }
effects = ["deploy"]

[[case]]
argv = ["vercel", "redeploy"]
action = "unmodeled"

# `promote <deployment>` makes it the current production deployment. A deployment that is not a
# production deployment is rebuilt as a new production deployment (`requestPromote`).
[[case]]
argv = ["vercel", "promote", "dpl_1", "--yes", "--timeout=30s"]
action = "promote"
fields = { deployment = "dpl_1", yes = true, timeout = "30s" }
effects = ["change_traffic", "deploy", "deploy_production", "skip_prompt"]

# `promote status` only reads (the CLI checks `args[1] === "status"`).
[[case]]
argv = ["vercel", "promote", "status", "web", "--json"]
action = "promote_status"
fields = { project = "web", json = true }
effects = ["read_remote"]

[[case]]
argv = ["vercel", "rollback", "dpl_1"]
action = "rollback"
fields = { deployment = "dpl_1" }
effects = ["change_traffic"]

[[case]]
argv = ["vercel", "rollback", "status", "--timeout", "30s"]
action = "rollback_status"
fields = { timeout = "30s" }
effects = ["read_remote"]

# `vercel rollback` with no deployment shows the status in the CLI; it is not modeled here.
[[case]]
argv = ["vercel", "rollback"]
action = "unmodeled"

[[case]]
argv = ["vercel", "rollback", "dpl_1", "--force"]
action = "unmodeled"

# `remove` takes one or more names or IDs; a project name deletes all its deployments. Alias `rm`.
[[case]]
argv = ["vercel", "remove", "dpl_1", "dpl_2", "--safe"]
action = "remove"
fields = { deployment = ["dpl_1", "dpl_2"], safe = true }
effects = ["delete_remote"]

[[case]]
argv = ["vercel", "rm", "my-app", "-y"]
action = "remove"
fields = { deployment = ["my-app"], yes = true }
effects = ["delete_remote", "skip_prompt"]

[[case]]
argv = ["vercel", "rm"]
action = "unmodeled"

# `--hard` is a hidden option; it is not declared.
[[case]]
argv = ["vercel", "remove", "dpl_1", "--hard"]
action = "unmodeled"

# ================================================================ list, inspect, logs

[[case]]
argv = ["vercel", "list"]
action = "list"
effects = ["read_remote"]

[[case]]
argv = ["vercel", "ls", "my-app", "--meta", "a=1", "--meta=b=2", "--policy", "p=1", "--status", "READY,ERROR", "-n", "50", "--next", "123", "--json", "-y"]
action = "list"
fields = { app = "my-app", meta = ["a=1", "b=2"], policy = ["p=1"], status = "READY,ERROR", limit = "50", next = "123", json = true, yes = true }
effects = ["read_remote", "skip_prompt"]

# A short option with a separate value, and the long spelling with `=`.
[[case]]
argv = ["vercel", "list", "-e", "production"]
action = "list"
fields = { environment = "production" }
effects = ["read_remote"]

[[case]]
argv = ["vercel", "list", "--environment=preview"]
action = "list"
fields = { environment = "preview" }
effects = ["read_remote"]

# The deprecated `list --prod` is not declared.
[[case]]
argv = ["vercel", "list", "--prod"]
action = "unmodeled"

[[case]]
argv = ["vercel", "inspect", "my-app-abc.vercel.app", "--wait", "--timeout", "90s", "--logs", "--json"]
action = "inspect"
fields = { deployment = "my-app-abc.vercel.app", wait = true, timeout = "90s", logs = true, json = true }
effects = ["read_remote"]

# `inspect` reads a deployment from stdin when none is given; that form is not modeled.
[[case]]
argv = ["vercel", "inspect"]
action = "unmodeled"

# `vercel logs` is `vercel logs runtime`; alias `log`.
[[case]]
argv = ["vercel", "logs", "--deployment", "dpl_1", "--json", "-q", "level:error", "-s", "1h", "-u", "now", "-n", "10", "-p", "web", "-e", "production", "--next", "c1"]
action = "logs"
fields = { deployment = "dpl_1", json = true, query = "level:error", since = "1h", until = "now", limit = "10", project = "web", environment = "production", next = "c1" }
effects = ["read_remote"]

[[case]]
argv = ["vercel", "log", "runtime", "--since=30m"]
action = "logs_runtime"
fields = { since = "30m" }
effects = ["read_remote"]

[[case]]
argv = ["vercel", "logs", "requests", "--query", "httpStatus >= 500"]
action = "logs_requests"
fields = { query = "httpStatus >= 500" }
effects = ["read_remote"]

# The deprecated `-f`/`--follow` is not declared; `vercel logs <deployment>` is not a form.
[[case]]
argv = ["vercel", "logs", "-f"]
action = "unmodeled"

[[case]]
argv = ["vercel", "logs", "my-app.vercel.app"]
action = "unmodeled"

# ================================================================ env

# `env ls --json` prints "readable Environment Variable values".
[[case]]
argv = ["vercel", "env", "ls"]
action = "env_list"
effects = ["read_remote"]

[[case]]
argv = ["vercel", "env", "list", "--json", "-e", "production", "--git-branch", "main", "-p", "web", "--guidance"]
action = "env_list"
fields = { json = true, environment = "production", git_branch = "main", project = "web", guidance = true }
effects = ["read_remote", "read_secret"]

# The legacy positional forms (`env ls production main`) are not modeled.
[[case]]
argv = ["vercel", "env", "ls", "production"]
action = "unmodeled"

# `env add` sets a value; `-e` is repeatable or comma-separated. A production target adds
# `production_env`.
[[case]]
argv = ["vercel", "env", "add", "API_KEY", "-e", "preview", "--value", "s3cr3t", "--sensitive", "-y"]
action = "env_add"
fields = { name = "API_KEY", environment = ["preview"], value = "s3cr3t", sensitive = true, yes = true }
effects = ["write_secret", "skip_prompt"]

[[case]]
argv = ["vercel", "env", "add", "API_URL", "--environment", "production,preview"]
action = "env_add"
fields = { name = "API_URL", environment = ["production,preview"] }
effects = ["write_secret", "production_env"]

[[case]]
argv = ["vercel", "env", "add", "API_URL", "-e", "preview", "-e", "production", "--force", "--type", "config", "--no-sensitive", "--git-branch", "dev", "--json", "--guidance", "-p", "web"]
action = "env_add"
fields = { name = "API_URL", environment = ["preview", "production"], force = true, type = "config", no_sensitive = true, git_branch = "dev", json = true, guidance = true, project = "web" }
effects = ["write_secret", "production_env"]

# A value that starts with `-` is still the option's value here (arg@5 would refuse it).
[[case]]
argv = ["vercel", "env", "add", "X", "--value", "-v"]
action = "env_add"
fields = { name = "X", value = "-v" }
effects = ["write_secret"]

# The deprecated `--visibility` and the legacy `env add <name> <environment>` are not modeled.
[[case]]
argv = ["vercel", "env", "add", "X", "--visibility", "secret"]
action = "unmodeled"

[[case]]
argv = ["vercel", "env", "add", "X", "production"]
action = "unmodeled"

# `env update`: "The new value applies to all of its environments".
[[case]]
argv = ["vercel", "env", "update", "API_KEY", "-e", "preview", "--value=new", "--sensitive", "--type", "secret", "-y", "--git-branch", "b", "-p", "web"]
action = "env_update"
fields = { name = "API_KEY", environment = "preview", value = "new", sensitive = true, type = "secret", yes = true, git_branch = "b", project = "web" }
effects = ["write_secret", "production_env", "skip_prompt"]

# `env rm` without `-e` removes the variable "from all of its environments".
[[case]]
argv = ["vercel", "env", "rm", "API_KEY", "-y"]
action = "env_remove"
fields = { name = "API_KEY", yes = true }
effects = ["delete_remote", "production_env", "skip_prompt"]

[[case]]
argv = ["vercel", "env", "remove", "API_KEY", "--environment", "preview", "--git-branch", "b", "--json", "-p", "web"]
action = "env_remove"
fields = { name = "API_KEY", environment = "preview", git_branch = "b", json = true, project = "web" }
effects = ["delete_remote"]

[[case]]
argv = ["vercel", "env", "rm"]
action = "unmodeled"

# `env pull` writes decrypted values to a local file (default `.env.local`).
[[case]]
argv = ["vercel", "env", "pull", ".env.production", "-e", "production", "-y"]
action = "env_pull"
fields = { filename = ".env.production", environment = "production", yes = true }
effects = ["read_secret", "write_local_files", "production_env", "skip_prompt"]

[[case]]
argv = ["vercel", "env", "pull", "--deployment", "dpl_1", "--git-branch", "b", "-p", "web"]
action = "env_pull"
fields = { deployment = "dpl_1", git_branch = "b", project = "web" }
effects = ["read_secret", "write_local_files"]

# `env run` needs `--`; the words after it are the command, flags included.
[[case]]
argv = ["vercel", "env", "run", "-e", "production", "--", "next", "dev", "--port", "3000"]
action = "env_run"
fields = { environment = "production", command = ["next", "dev", "--port", "3000"] }
effects = ["run_local_code", "read_secret", "production_env"]

[[case]]
argv = ["vercel", "env", "run", "--git-branch", "b", "-p", "web", "--", "npm", "test"]
action = "env_run"
fields = { git_branch = "b", project = "web", command = ["npm", "test"] }
effects = ["run_local_code", "read_secret"]

# Without `--` the CLI refuses: "No command provided. Use `--` to separate Vercel options".
[[case]]
argv = ["vercel", "env", "run", "npm", "test"]
action = "unmodeled"

# `vercel env` alone prints help; it is not an action.
[[case]]
argv = ["vercel", "env"]
action = "unmodeled"

# ================================================================ pull, build, dev, link, git

[[case]]
argv = ["vercel", "pull"]
action = "pull"
effects = ["read_secret", "write_local_files"]

[[case]]
argv = ["vercel", "pull", "./app", "--environment=production", "--git-branch", "main", "--json", "-p", "web"]
action = "pull"
fields = { project_path = "./app", environment = "production", git_branch = "main", json = true, project = "web" }
effects = ["read_secret", "write_local_files", "production_env"]

# `pull -y` sets up a new project link "using default scope and settings".
[[case]]
argv = ["vercel", "pull", "-y"]
action = "pull"
fields = { yes = true }
effects = ["read_secret", "write_local_files", "skip_prompt", "write_remote"]

[[case]]
argv = ["vercel", "build", "--prod", "-y", "-o", "out", "--standalone"]
action = "build"
fields = { prod = true, yes = true, output = "out", standalone = true }
effects = ["run_local_code", "read_secret", "write_local_files", "production_env", "skip_prompt"]

[[case]]
argv = ["vercel", "build", "-e", "preview", "--deployment", "dpl_1", "-p", "web"]
action = "build"
fields = { environment = "preview", deployment = "dpl_1", project = "web" }
effects = ["run_local_code", "read_secret", "write_local_files"]

# `build` takes no operand.
[[case]]
argv = ["vercel", "build", "./app"]
action = "unmodeled"

# `dev` runs the project locally and listens; alias `develop`.
[[case]]
argv = ["vercel", "dev", "--listen", "127.0.0.1:3000", "--local"]
action = "dev"
fields = { listen = "127.0.0.1:3000", local = true }
effects = ["run_local_code", "read_secret", "listen"]

[[case]]
argv = ["vercel", "develop", "./app", "--project", "web", "--queue-port", "1", "--runtime-cache-port", "2", "--schedules-port", "3", "-y"]
action = "dev"
