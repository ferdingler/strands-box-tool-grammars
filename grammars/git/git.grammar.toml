options.create_reflog    = { flag = ["--create-reflog"] }
options.recurse_submodules = { flag = ["--recurse-submodules"] }
options.contains         = { flag = ["--contains"], value = "required" }
options.no_contains      = { flag = ["--no-contains"], value = "required" }
options.merged           = { flag = ["--merged"], value = "required" }
options.no_merged        = { flag = ["--no-merged"], value = "required" }
