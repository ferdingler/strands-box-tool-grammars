options.force            = { flag = ["-f", "--force"], adds = ["rewrite_history"] }
options.list             = { flag = ["-l", "--list"] }
options.all              = { flag = ["-a", "--all"] }
options.remotes          = { flag = ["-r", "--remotes"] }
options.verbose          = { flag = ["-v", "--verbose"] }
options.quiet            = { flag = ["-q", "--quiet"] }
options.show_current     = { flag = ["--show-current"] }
options.track            = { flag = ["-t", "--track"], value = "optional" }
options.no_track         = { flag = ["--no-track"] }
options.set_upstream_to  = { flag = ["-u", "--set-upstream-to"], value = "required" }
