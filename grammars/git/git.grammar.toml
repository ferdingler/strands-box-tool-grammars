# ================================================================ remotes

# `git push` contacts the remote even with `--dry-run`, and runs the pre-push hook then too, so a
# dry run keeps `network` and `skip_hooks`. A refspec that starts with `+` forces; one that
# starts with `:` or `+:` deletes. An `ext::` URL runs a shell command when
# protocol.ext.allow permits it.
[shell.push]
usage = "git [global options] push [options] [<repository> [<refspec>...]]"
adds  = ["network"]
options.force              = { flag = ["-f", "--force"], adds = ["force_push"] }
options.force_with_lease   = { flag = ["--force-with-lease"], value = "optional", adds = ["force_push"] }
options.force_if_includes  = { flag = ["--force-if-includes"] }
options.mirror             = { flag = ["--mirror"], adds = ["force_push", "delete_remote_ref"] }
options.delete             = { flag = ["-d", "--delete"], adds = ["delete_remote_ref"] }
options.prune              = { flag = ["--prune"], adds = ["delete_remote_ref"] }
options.dry_run            = { flag = ["-n", "--dry-run"], removes = ["force_push", "delete_remote_ref"] }
options.no_verify          = { flag = ["--no-verify"], adds = ["skip_hooks"] }
options.set_upstream       = { flag = ["-u", "--set-upstream"] }
options.all                = { flag = ["--all", "--branches"] }
options.tags               = { flag = ["--tags"] }
options.follow_tags        = { flag = ["--follow-tags"] }
options.atomic             = { flag = ["--atomic"] }
options.repo               = { flag = ["--repo"], value = "required", when = [{ like = "ext::*", adds = ["run_program"] }] }
options.push_option        = { flag = ["-o", "--push-option"], value = "required", repeated = true }
options.receive_pack       = { flag = ["--receive-pack", "--exec"], value = "required", adds = ["run_program"] }
options.recurse_submodules = { flag = ["--recurse-submodules"], value = "required" }
options.signed             = { flag = ["--signed"], value = "optional" }
options.porcelain          = { flag = ["--porcelain"] }
options.progress           = { flag = ["--progress"] }
options.thin               = { flag = ["--thin"] }
options.no_thin            = { flag = ["--no-thin"] }
options.quiet              = { flag = ["-q", "--quiet"] }
options.verbose            = { flag = ["-v", "--verbose"] }
options.ipv4               = { flag = ["-4", "--ipv4"] }
options.ipv6               = { flag = ["-6", "--ipv6"] }
operands.repository = { when = [{ like = "ext::*", adds = ["run_program"] }] }
operands.refspec    = { like = "+*", adds = ["force_push"], when = [{ like = [":*", "+:*"], adds = ["delete_remote_ref"] }] }

# `-n` is `--no-tags` here, not a dry run. `--multiple` (every operand a remote), `--stdin`, and
# `--refmap` are left out. A refspec `+<src>:<dst>` force-updates the local ref <dst>.
[shell.fetch]
usage = "git [global options] fetch [options] [<repository> [<refspec>...]]"
adds  = ["network"]
options.all                = { flag = ["--all"] }
options.append             = { flag = ["-a", "--append"] }
options.atomic             = { flag = ["--atomic"] }
options.upload_pack        = { flag = ["--upload-pack"], value = "required", adds = ["run_program"] }
options.force              = { flag = ["-f", "--force"], adds = ["force_fetch"] }
options.tags               = { flag = ["-t", "--tags"] }
options.no_tags            = { flag = ["-n", "--no-tags"] }
options.jobs               = { flag = ["-j", "--jobs"], value = "required" }
options.prefetch           = { flag = ["--prefetch"] }
options.prune              = { flag = ["-p", "--prune"] }
options.prune_tags         = { flag = ["-P", "--prune-tags"], adds = ["delete_ref", "force_fetch"] }
options.recurse_submodules = { flag = ["--recurse-submodules"], value = "optional" }
options.no_recurse_submodules = { flag = ["--no-recurse-submodules"] }
options.dry_run            = { flag = ["--dry-run"], removes = ["force_fetch", "delete_ref"] }
options.porcelain          = { flag = ["--porcelain"] }
options.write_fetch_head   = { flag = ["--write-fetch-head"] }
options.no_write_fetch_head = { flag = ["--no-write-fetch-head"] }
options.keep               = { flag = ["-k", "--keep"] }
options.update_head_ok     = { flag = ["-u", "--update-head-ok"] }
options.progress           = { flag = ["--progress"] }
options.depth              = { flag = ["--depth"], value = "required" }
options.shallow_since      = { flag = ["--shallow-since"], value = "required" }
options.shallow_exclude    = { flag = ["--shallow-exclude"], value = "required", repeated = true }
options.deepen             = { flag = ["--deepen"], value = "required" }
options.unshallow          = { flag = ["--unshallow"] }
options.refetch            = { flag = ["--refetch"] }
options.update_shallow     = { flag = ["--update-shallow"] }
options.server_option      = { flag = ["-o", "--server-option"], value = "required", repeated = true }
options.filter             = { flag = ["--filter"], value = "required" }
options.set_upstream       = { flag = ["--set-upstream"] }
options.show_forced_updates = { flag = ["--show-forced-updates"] }
options.no_show_forced_updates = { flag = ["--no-show-forced-updates"] }
options.quiet              = { flag = ["-q", "--quiet"] }
options.verbose            = { flag = ["-v", "--verbose"] }
options.ipv4               = { flag = ["-4", "--ipv4"] }
options.ipv6               = { flag = ["-6", "--ipv6"] }
operands.repository = { when = [{ like = "ext::*", adds = ["run_program"] }] }
operands.refspec    = { like = "+*:*", adds = ["force_fetch"] }

# A pull fetches and then merges, or rebases with `--rebase` (which `--rebase=false` turns off; git
# also reads `pull.rebase` from configuration, which the grammar cannot see). `-n` is `--no-stat`.
# `--dry-run` stops after the fetch (builtin/pull.c), so it removes what the merge would do.
# `--edit` has no short form here. `-j` takes only an attached count.
[shell.pull]
usage = "git [global options] pull [options] [<repository> [<refspec>...]]"
adds  = ["network"]
options.rebase           = { flag = ["-r", "--rebase"], value = "optional", adds = ["rewrite_history"], when = [{ like = ["false", "no", "off", "0"], removes = ["rewrite_history"] }] }
options.no_rebase        = { flag = ["--no-rebase"] }
options.no_stat          = { flag = ["-n", "--no-stat"] }
options.stat             = { flag = ["--stat"] }
options.compact_summary  = { flag = ["--compact-summary"] }
options.log              = { flag = ["--log"], value = "optional" }
options.no_log           = { flag = ["--no-log"] }
options.signoff          = { flag = ["--signoff"], value = "optional" }
options.squash           = { flag = ["--squash"] }
options.commit_option    = { flag = ["--commit"] }
options.no_commit        = { flag = ["--no-commit"] }
options.edit             = { flag = ["--edit"] }
options.no_edit          = { flag = ["--no-edit"] }
options.cleanup          = { flag = ["--cleanup"], value = "required" }
options.ff               = { flag = ["--ff"] }
options.no_ff            = { flag = ["--no-ff"] }
options.ff_only          = { flag = ["--ff-only"] }
options.no_verify        = { flag = ["--no-verify"], adds = ["skip_hooks"] }
options.verify_signatures = { flag = ["--verify-signatures"] }
options.autostash        = { flag = ["--autostash"] }
options.no_autostash     = { flag = ["--no-autostash"] }
options.strategy         = { flag = ["-s", "--strategy"], value = "required", adds = ["run_program"] }
options.strategy_option  = { flag = ["-X", "--strategy-option"], value = "required", repeated = true }
options.gpg_sign         = { flag = ["-S", "--gpg-sign"], value = "optional" }
options.allow_unrelated_histories = { flag = ["--allow-unrelated-histories"] }
options.all              = { flag = ["--all"] }
options.append           = { flag = ["-a", "--append"] }
options.upload_pack      = { flag = ["--upload-pack"], value = "required", adds = ["run_program"] }
options.force            = { flag = ["-f", "--force"], adds = ["force_fetch"] }
options.tags             = { flag = ["-t", "--tags"] }
options.no_tags          = { flag = ["--no-tags"] }
options.prune            = { flag = ["-p", "--prune"] }
options.jobs             = { flag = ["-j", "--jobs"], value = "optional" }
options.dry_run          = { flag = ["--dry-run"], removes = ["rewrite_history", "force_fetch", "skip_hooks"] }
options.keep             = { flag = ["-k", "--keep"] }
options.depth            = { flag = ["--depth"], value = "required" }
options.shallow_since    = { flag = ["--shallow-since"], value = "required" }
options.shallow_exclude  = { flag = ["--shallow-exclude"], value = "required", repeated = true }
options.deepen           = { flag = ["--deepen"], value = "required" }
options.unshallow        = { flag = ["--unshallow"] }
options.server_option    = { flag = ["-o", "--server-option"], value = "required", repeated = true }
options.set_upstream     = { flag = ["--set-upstream"] }
options.recurse_submodules = { flag = ["--recurse-submodules"], value = "optional" }
options.no_recurse_submodules = { flag = ["--no-recurse-submodules"] }
options.progress         = { flag = ["--progress"] }
options.quiet            = { flag = ["-q", "--quiet"] }
options.verbose          = { flag = ["-v", "--verbose"] }
options.ipv4             = { flag = ["-4", "--ipv4"] }
options.ipv6             = { flag = ["-6", "--ipv6"] }
operands.repository = { when = [{ like = "ext::*", adds = ["run_program"] }] }
operands.refspec    = { like = "+*:*", adds = ["force_fetch"] }

# `--template` copies hooks into the new repository, and the clone runs its post-checkout hook.
# `-c`/`--config` writes configuration into the new repository before the checkout; its key is
# `config_option` because the global `-c` holds `config`. Likewise `--bare` is `bare_option`.
[shell.clone]
usage = "git [global options] clone [options] [--] <repository> [<directory>]"
adds  = ["network"]
options.verbose          = { flag = ["-v", "--verbose"] }
options.quiet            = { flag = ["-q", "--quiet"] }
options.progress         = { flag = ["--progress"] }
options.reject_shallow   = { flag = ["--reject-shallow"] }
options.no_checkout      = { flag = ["-n", "--no-checkout"] }
options.bare_option      = { flag = ["--bare"] }
options.mirror           = { flag = ["--mirror"] }
options.local            = { flag = ["-l", "--local"] }
options.no_local         = { flag = ["--no-local"] }
options.no_hardlinks     = { flag = ["--no-hardlinks"] }
options.shared           = { flag = ["-s", "--shared"] }
options.recurse_submodules = { flag = ["--recurse-submodules", "--recursive"], value = "optional" }
options.jobs             = { flag = ["-j", "--jobs"], value = "required" }
options.template         = { flag = ["--template"], value = "required", adds = ["run_program"] }
options.reference        = { flag = ["--reference"], value = "required", repeated = true }
options.reference_if_able = { flag = ["--reference-if-able"], value = "required", repeated = true }
options.dissociate       = { flag = ["--dissociate"] }
options.origin           = { flag = ["-o", "--origin"], value = "required" }
options.branch           = { flag = ["-b", "--branch"], value = "required" }
options.revision         = { flag = ["--revision"], value = "required" }
options.upload_pack      = { flag = ["-u", "--upload-pack"], value = "required", adds = ["run_program"] }
options.depth            = { flag = ["--depth"], value = "required" }
options.shallow_since    = { flag = ["--shallow-since"], value = "required" }
options.shallow_exclude  = { flag = ["--shallow-exclude"], value = "required", repeated = true }
options.single_branch    = { flag = ["--single-branch"] }
options.no_single_branch = { flag = ["--no-single-branch"] }
options.tags             = { flag = ["--tags"] }
options.no_tags          = { flag = ["--no-tags"] }
options.shallow_submodules = { flag = ["--shallow-submodules"] }
options.separate_git_dir = { flag = ["--separate-git-dir"], value = "required", when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }
options.ref_format       = { flag = ["--ref-format"], value = "required" }
options.config_option    = { flag = ["-c", "--config"], value = "required", repeated = true, adds = ["override_config", "run_program"] }
options.server_option    = { flag = ["--server-option"], value = "required", repeated = true }
options.ipv4             = { flag = ["-4", "--ipv4"] }
options.ipv6             = { flag = ["-6", "--ipv6"] }
options.filter           = { flag = ["--filter"], value = "required" }
options.also_filter_submodules = { flag = ["--also-filter-submodules"] }
options.remote_submodules = { flag = ["--remote-submodules"] }
options.sparse           = { flag = ["--sparse"] }
options.bundle_uri       = { flag = ["--bundle-uri"], value = "required" }
operands.repository = { when = [{ like = "ext::*", adds = ["run_program"] }] }
operands.directory  = { when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }

# `git remote` alone lists the remotes. `-v` must come before a subcommand, so
# `git remote -v show` is `unmodeled`.
[shell.remote]
usage = "git [global options] remote [options]"
options.verbose = { flag = ["-v", "--verbose"] }

# The subcommands that change a remote write the repository configuration.
[shell.remote_add]
usage = "git [global options] remote add [options] <name> <url>"
adds  = ["override_config"]
options.track   = { flag = ["-t"], value = "required", repeated = true }
options.master  = { flag = ["-m"], value = "required" }
options.fetch   = { flag = ["-f"], adds = ["network"] }
options.tags    = { flag = ["--tags"] }
options.no_tags = { flag = ["--no-tags"] }
options.mirror  = { flag = ["--mirror"], value = "optional" }
operands.name = {}
operands.url  = {}

[shell.remote_remove]
usage   = "git [global options] remote remove <name>"
aliases = ["remote rm"]
adds    = ["override_config"]
operands.name = {}

[shell.remote_rename]
usage = "git [global options] remote rename [options] <old> <new>"
adds  = ["override_config"]
options.progress    = { flag = ["--progress"] }
options.no_progress = { flag = ["--no-progress"] }
operands.old = {}
operands.new = {}

[shell.remote_set_url]
usage = "git [global options] remote set-url [options] <name> <newurl> [<oldurl>]"
adds  = ["override_config"]
options.push   = { flag = ["--push"] }
options.add    = { flag = ["--add"] }
options.delete = { flag = ["--delete"] }
operands.name   = {}
operands.newurl = {}
operands.oldurl = {}

[shell.remote_get_url]
usage = "git [global options] remote get-url [options] <name>"
options.push = { flag = ["--push"] }
options.all  = { flag = ["--all"] }
operands.name = {}

# `remote show <name>` queries the remote unless `-n` is given; with no name it lists remotes.
[shell.remote_show]
usage = "git [global options] remote show [options] [<name>...]"
options.no_query = { flag = ["-n"], removes = ["network"] }
operands.name = { adds = ["network"] }

[shell.remote_prune]
usage = "git [global options] remote prune [options] <name>..."
adds  = ["network"]
options.dry_run = { flag = ["-n", "--dry-run"] }
operands.name = {}

[shell.remote_update]
usage = "git [global options] remote update [options] [<remote>...]"
adds  = ["network"]
options.prune = { flag = ["-p", "--prune"] }
operands.remote = {}

# ================================================================ configuration

# The subcommands (git 2.46 and later). Each stops reading options at its first operand
# (PARSE_OPT_STOP_AT_NON_OPTION), so a later word that looks like an option is an operand in git.
[shell.config_list]
usage = "git [global options] config list [options]"
options.global       = { flag = ["--global"] }
options.system       = { flag = ["--system"] }
options.local        = { flag = ["--local"] }
options.worktree     = { flag = ["--worktree"] }
options.file         = { flag = ["-f", "--file"], value = "required", when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }
options.blob         = { flag = ["--blob"], value = "required" }
options.null         = { flag = ["-z", "--null"] }
options.name_only    = { flag = ["--name-only"] }
options.show_origin  = { flag = ["--show-origin"] }
options.show_scope   = { flag = ["--show-scope"] }
options.show_names   = { flag = ["--show-names"] }
options.type         = { flag = ["-t", "--type"], value = "required" }
options.includes     = { flag = ["--includes"] }
options.no_includes  = { flag = ["--no-includes"] }

[shell.config_get]
usage = "git [global options] config get [options] <name>"
options.global       = { flag = ["--global"] }
options.system       = { flag = ["--system"] }
options.local        = { flag = ["--local"] }
options.worktree     = { flag = ["--worktree"] }
options.file         = { flag = ["-f", "--file"], value = "required", when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }
options.blob         = { flag = ["--blob"], value = "required" }
options.all          = { flag = ["--all"] }
options.regexp       = { flag = ["--regexp"] }
options.value        = { flag = ["--value"], value = "required" }
options.fixed_value  = { flag = ["--fixed-value"] }
options.url          = { flag = ["--url"], value = "required" }
options.null         = { flag = ["-z", "--null"] }
options.name_only    = { flag = ["--name-only"] }
options.show_origin  = { flag = ["--show-origin"] }
options.show_scope   = { flag = ["--show-scope"] }
options.show_names   = { flag = ["--show-names"] }
options.type         = { flag = ["-t", "--type"], value = "required" }
options.includes     = { flag = ["--includes"] }
options.no_includes  = { flag = ["--no-includes"] }
options.default      = { flag = ["--default"], value = "required" }
operands.name = {}

[shell.config_set]
usage = "git [global options] config set [options] <name> <value>"
adds  = ["override_config"]
options.global       = { flag = ["--global"] }
options.system       = { flag = ["--system"] }
options.local        = { flag = ["--local"] }
options.worktree     = { flag = ["--worktree"] }
options.file         = { flag = ["-f", "--file"], value = "required", when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }
options.type         = { flag = ["-t", "--type"], value = "required" }
options.all          = { flag = ["--all"] }
options.value_pattern = { flag = ["--value"], value = "required" }
options.fixed_value  = { flag = ["--fixed-value"] }
options.comment      = { flag = ["--comment"], value = "required" }
options.append       = { flag = ["--append"] }
operands.name  = {}
operands.value = {}

[shell.config_unset]
usage = "git [global options] config unset [options] <name>"
adds  = ["override_config"]
options.global       = { flag = ["--global"] }
options.system       = { flag = ["--system"] }
options.local        = { flag = ["--local"] }
options.worktree     = { flag = ["--worktree"] }
options.file         = { flag = ["-f", "--file"], value = "required", when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }
options.all          = { flag = ["--all"] }
options.value        = { flag = ["--value"], value = "required" }
options.fixed_value  = { flag = ["--fixed-value"] }
operands.name = {}

# The older form. Git stops reading options at the first operand, so in `git config <name> --x`
# the word `--x` is a value that git writes. Here every operand adds `override_config`, whatever
# follows, so a write is never read as a read. `--get`, `--get-all`, `--get-regexp`, `--unset`,
# and `--unset-all` are modes in git that take the name as the next word; here each holds that
# name as its value. `-e`/`--edit`, `--add`, `--replace-all`, the section modes, and the color
# modes are left out.
[shell.config]
usage = "git [global options] config [options] [<name>] [<value>]"
options.list         = { flag = ["-l", "--list"] }
options.get          = { flag = ["--get"], value = "required" }
options.get_all      = { flag = ["--get-all"], value = "required" }
options.get_regexp   = { flag = ["--get-regexp"], value = "required" }
options.unset        = { flag = ["--unset"], value = "required", adds = ["override_config"] }
options.unset_all    = { flag = ["--unset-all"], value = "required", adds = ["override_config"] }
options.global       = { flag = ["--global"] }
options.system       = { flag = ["--system"] }
options.local        = { flag = ["--local"] }
options.worktree     = { flag = ["--worktree"] }
options.file         = { flag = ["-f", "--file"], value = "required", when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }
options.blob         = { flag = ["--blob"], value = "required" }
options.null         = { flag = ["-z", "--null"] }
options.name_only    = { flag = ["--name-only"] }
options.show_origin  = { flag = ["--show-origin"] }
options.show_scope   = { flag = ["--show-scope"] }
options.type         = { flag = ["-t", "--type"], value = "required" }
options.bool         = { flag = ["--bool"] }
options.int          = { flag = ["--int"] }
options.bool_or_int  = { flag = ["--bool-or-int"] }
options.path         = { flag = ["--path"] }
options.includes     = { flag = ["--includes"] }
options.no_includes  = { flag = ["--no-includes"] }
options.default      = { flag = ["--default"], value = "required" }
operands.name  = { adds = ["override_config"] }
operands.value = { adds = ["override_config"] }

# ================================================================ repositories and worktrees

# `--template` copies hooks that later git commands in the new repository run.
[shell.init]
usage = "git [global options] init [options] [<directory>]"
options.quiet            = { flag = ["-q", "--quiet"] }
options.bare_option      = { flag = ["--bare"] }
options.template         = { flag = ["--template"], value = "required", adds = ["run_program"] }
options.shared           = { flag = ["--shared"], value = "optional" }
options.separate_git_dir = { flag = ["--separate-git-dir"], value = "required", when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }
options.initial_branch   = { flag = ["-b", "--initial-branch"], value = "required" }
options.object_format    = { flag = ["--object-format"], value = "required" }
options.ref_format       = { flag = ["--ref-format"], value = "required" }
operands.directory = { when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }

[shell.worktree_list]
usage = "git [global options] worktree list [options]"
options.porcelain = { flag = ["--porcelain"] }
options.null      = { flag = ["-z"] }
options.verbose   = { flag = ["-v", "--verbose"] }
options.expire    = { flag = ["--expire"], value = "required" }

# A new worktree is a directory that git creates and checks out, often beside the repository
# (`../wt`), which adds `outside_path`. `-B` resets an existing branch.
[shell.worktree_add]
usage = "git [global options] worktree add [options] <path> [<commit_ish>]"
options.force          = { flag = ["-f", "--force"] }
options.create         = { flag = ["-b"], value = "required" }
options.force_create   = { flag = ["-B"], value = "required", adds = ["rewrite_history"] }
options.orphan         = { flag = ["--orphan"] }
options.detach         = { flag = ["-d", "--detach"] }
options.checkout       = { flag = ["--checkout"] }
options.no_checkout    = { flag = ["--no-checkout"] }
options.lock           = { flag = ["--lock"] }
options.reason         = { flag = ["--reason"], value = "required" }
options.quiet          = { flag = ["-q", "--quiet"] }
options.track          = { flag = ["--track"] }
options.no_track       = { flag = ["--no-track"] }
options.guess_remote   = { flag = ["--guess-remote"] }
options.no_guess_remote = { flag = ["--no-guess-remote"] }
options.relative_paths = { flag = ["--relative-paths"] }
options.no_relative_paths = { flag = ["--no-relative-paths"] }
operands.path       = { when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }
operands.commit_ish = {}

# `worktree remove` deletes the linked worktree's files. Git refuses a worktree with changes or
# untracked files unless `-f` is given.
[shell.worktree_remove]
usage = "git [global options] worktree remove [options] <worktree>"
adds  = ["delete_files"]
options.force = { flag = ["-f", "--force"], adds = ["discard_changes"] }
operands.worktree = { when = [{ like = ["/*", "..", "../*", "*/..", "*/../*"], adds = ["outside_path"] }] }

[shell.worktree_prune]
usage = "git [global options] worktree prune [options]"
options.dry_run = { flag = ["-n", "--dry-run"] }
options.verbose = { flag = ["-v", "--verbose"] }
options.expire  = { flag = ["--expire"], value = "required" }
