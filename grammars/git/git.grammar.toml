# One action holds every tag mode, so <tagname> collects each name, commit, or pattern.
# `-n` takes only an attached count (`-n3`).
[shell.tag]
usage = "git [global options] tag [options] [<tagname>...]"
options.delete        = { flag = ["-d", "--delete"], adds = ["delete_ref"] }
