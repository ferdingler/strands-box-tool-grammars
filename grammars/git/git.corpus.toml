# config get stays a read.
[[case]]
argv = ["git", "config", "get", "core.hooksPath"]
action = "config_get"
fields = { name = "core.hooksPath" }
effects = []

# config --list stays a read.
[[case]]
argv = ["git", "config", "--list", "--show-origin"]
action = "config"
fields = { list = true, show_origin = true }
effects = []

# config unset of core.hooksPath turns the hooks back on, but it is still a write.
[[case]]
argv = ["git", "config", "--unset-all", "core.hooksPath"]
action = "config"
fields = { unset_all = "core.hooksPath" }
effects = ["override_config", "run_program", "skip_hooks"]

# --work-tree alone now adds run_program.
[[case]]
argv = ["git", "--work-tree=/tmp/wt", "checkout", "--", "a.txt"]
action = "checkout"
fields = { work_tree = "/tmp/wt", pathspec = ["a.txt"] }
effects = ["other_repository", "run_program", "discard_changes"]

# rm --cached without -f keeps staged content safe (git refuses), so no effect.
[[case]]
argv = ["git", "rm", "--cached", "a.txt"]
action = "rm"
fields = { cached = true, pathspec = ["a.txt"] }
effects = []

# rm -n -f --cached is a dry run.
[[case]]
argv = ["git", "rm", "-nf", "--cached", "a.txt"]
action = "rm"
fields = { dry_run = true, force = true, cached = true, pathspec = ["a.txt"] }
effects = []

# cherry-pick --skip resets the commit in progress.
[[case]]
argv = ["git", "cherry-pick", "--skip"]
action = "cherry_pick"
fields = { skip = true }
effects = ["discard_changes"]

# branch --unset-upstream writes branch config.
[[case]]
argv = ["git", "branch", "--unset-upstream", "topic"]
action = "branch"
fields = { unset_upstream = true, branchname = ["topic"] }
effects = ["override_config"]

# push -n -u: git writes no upstream on a dry run (transport.c set_upstreams, `if (!pretend)`).
# The grammar keeps override_config, which over-reports and is safe.
[[case]]
argv = ["git", "push", "-n", "-u", "origin", "main"]
action = "push"
fields = { dry_run = true, set_upstream = true, repository = "origin", refspec = ["main"] }
effects = ["network", "override_config"]
