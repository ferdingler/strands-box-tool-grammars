# Golden cases for git.grammar.toml, checked against git 2.56.1.
#
# Each expectation comes from git's documented behaviour: the `git <cmd> -h` output and the man
# pages for 2.56.1, and, where the man page is silent, the 2.56.1 source (named per case).
# `fields` lists only fields that do not hold their default. An `unmodeled` case has no fields and
# no effects.
#
# OUT below means the outside-path patterns: an absolute path or a path that contains `..`.

# ---------------------------------------------------------------- global options (git.c)

# git(1): `-C <path>` runs as if started in <path>; it takes the next word.
[[case]]
argv = ["git", "-C", "../other", "status"]
action = "status"
fields = { change_directory = "../other" }
effects = ["other_repository", "run_program"]

# git(1): `-c <name>=<value>` sets configuration for this command; configuration can name
# programs (core.sshCommand) and skip hooks (core.hooksPath).
[[case]]
argv = ["git", "-c", "core.hooksPath=/dev/null", "-c", "user.name=x", "commit", "-m", "wip"]
action = "commit"
fields = { config = ["core.hooksPath=/dev/null", "user.name=x"], message = ["wip"] }
effects = ["override_config", "run_program", "skip_hooks"]

# git.c handle_options: `--config-env=<name>=<envvar>` and `--config-env <name>=<envvar>`.
[[case]]
argv = ["git", "--config-env=core.pager=PAGER_VAR", "log"]
action = "log"
fields = { config_env = ["core.pager=PAGER_VAR"] }
effects = ["override_config", "run_program", "skip_hooks"]

# git(1): `--git-dir=<path>` and `--git-dir <path>`; also `--work-tree`.
[[case]]
argv = ["git", "--git-dir", "/srv/repo.git", "--work-tree=/srv/wt", "status", "-s"]
action = "status"
fields = { git_dir = "/srv/repo.git", short = true, work_tree = "/srv/wt" }
effects = ["other_repository", "run_program"]

# git(1): `-P`/`--no-pager` and `--no-optional-locks` change no outcome.
[[case]]
argv = ["git", "--no-pager", "--no-optional-locks", "diff", "--stat"]
action = "diff"
fields = { no_optional_locks = true, no_pager = true, stat = "" }

[[case]]
argv = ["git", "-P", "log", "--oneline", "-n", "5"]
action = "log"
fields = { max_count = "5", no_pager = true, oneline = true }

# Git refuses a global option after the subcommand ("unknown switch").
[[case]]
argv = ["git", "status", "-C", "."]
action = "unmodeled"

# `--exec-path=<dir>` makes git run git-* programs from <dir>; not declared.
[[case]]
argv = ["git", "--exec-path=/tmp/x", "status"]
action = "unmodeled"

# A required value takes the next word even when it is a subcommand name.
[[case]]
argv = ["git", "-C", "push", "status"]
action = "status"
fields = { change_directory = "push" }
effects = ["other_repository", "run_program"]

# Git accepts `-C` twice and joins the paths; the grammar declares it once.
[[case]]
argv = ["git", "-C", "a", "-C", "b", "status"]
action = "unmodeled"

# No subcommand, `--version`, `--help`, an unknown subcommand, and a configured alias.
[[case]]
argv = ["git"]
action = "unmodeled"

[[case]]
argv = ["git", "--version"]
action = "unmodeled"

[[case]]
argv = ["git", "--help"]
action = "unmodeled"

[[case]]
argv = ["git", "frobnicate"]
action = "unmodeled"

[[case]]
argv = ["git", "ci", "-m", "x"]
action = "unmodeled"

# `--` before the subcommand is not a command word.
[[case]]
argv = ["git", "--", "status"]
action = "unmodeled"

# Command words are case sensitive.
[[case]]
argv = ["git", "STATUS"]
action = "unmodeled"

# ---------------------------------------------------------------- status

# git-status -h: `-s`, `-b` bundle; `-uno` attaches the optional mode.
[[case]]
argv = ["git", "status", "-sb", "-uno"]
action = "status"
fields = { branch = true, short = true, untracked_files = "no" }

# `-u` takes its optional value only attached: `-u no` makes `no` a pathspec.
[[case]]
argv = ["git", "status", "-u", "no"]
action = "status"
fields = { pathspec = ["no"], untracked_files = "" }

[[case]]
argv = ["git", "status", "--porcelain=v2", "--", "src"]
action = "status"
fields = { pathspec = ["src"], porcelain = "v2" }

# `--short=yes`: a flag takes no value.
[[case]]
argv = ["git", "status", "--short=yes"]
action = "unmodeled"

# A prefix of `--porcelain` is accepted by git and not here.
[[case]]
argv = ["git", "status", "--porc"]
action = "unmodeled"

[[case]]
argv = ["git", "status", "-h"]
action = "unmodeled"

# ---------------------------------------------------------------- log, show, diff

# git-log(1): `-n <number>` and `--max-count=<number>`, `-p -- <path>`.
[[case]]
argv = ["git", "log", "-n3", "-p", "main", "--", "src/"]
action = "log"
fields = { max_count = "3", patch = true, path = ["src/"], revision = ["main"] }

[[case]]
argv = ["git", "log", "--max-count=10", "--format=%H %s", "--author", "alice", "--author=bob"]
action = "log"
fields = { author = ["alice", "bob"], format = "%H %s", max_count = "10" }

# `git log -5` (count as a number) cannot be spelled.
[[case]]
argv = ["git", "log", "-5"]
action = "unmodeled"

# git-log(1) `--output=<file>` writes the output to a file.
[[case]]
argv = ["git", "log", "--output=/tmp/log.txt"]
action = "log"
fields = { output = "/tmp/log.txt" }
effects = ["outside_path", "write_file"]

[[case]]
argv = ["git", "log", "--output", "log.txt"]
action = "log"
fields = { output = "log.txt" }
effects = ["write_file"]

# git-log(1) `--ext-diff` lets an external diff helper run.
[[case]]
argv = ["git", "log", "-p", "--ext-diff"]
action = "log"
fields = { ext_diff = true, patch = true }
effects = ["run_program"]

[[case]]
argv = ["git", "log", "--oneline", "--graph", "--all", "--decorate"]
action = "log"
fields = { all = true, decorate = "", graph = true, oneline = true }

[[case]]
argv = ["git", "log", "--since", "2 weeks ago", "--grep=fix", "-S", "needle"]
action = "log"
fields = { grep = ["fix"], pickaxe = "needle", since = "2 weeks ago" }

# A non-repeated option given twice.
[[case]]
argv = ["git", "log", "-n", "1", "-n", "2"]
action = "unmodeled"

[[case]]
argv = ["git", "log", "--follw"]
action = "unmodeled"

# git-show(1): `git show <rev>:<path>` prints a blob.
[[case]]
argv = ["git", "show", "HEAD~1:src/lib.rs"]
action = "show"
fields = { object = ["HEAD~1:src/lib.rs"] }

[[case]]
argv = ["git", "show", "--stat", "--oneline", "v1.0", "v2.0"]
action = "show"
fields = { object = ["v1.0", "v2.0"], oneline = true, stat = "" }

[[case]]
argv = ["git", "show", "-s", "--format=%an", "HEAD"]
action = "show"
fields = { format = "%an", no_patch = true, object = ["HEAD"] }

[[case]]
argv = ["git", "show", "--output=../out.patch", "HEAD"]
action = "show"
fields = { object = ["HEAD"], output = "../out.patch" }
effects = ["outside_path", "write_file"]

[[case]]
argv = ["git", "show", "--bogus"]
action = "unmodeled"

# git-diff(1): `--cached` is a synonym of `--staged`.
[[case]]
argv = ["git", "diff", "--staged", "--name-only"]
action = "diff"
fields = { cached = true, name_only = true }

[[case]]
argv = ["git", "diff", "main...feature", "--", "README.md"]
action = "diff"
fields = { commit = ["main...feature"], path = ["README.md"] }

# git-diff(1): with a path outside the working tree, git diff reads the files (no-index mode).
[[case]]
argv = ["git", "diff", "--no-index", "/etc/hosts", "notes.txt"]
action = "diff"
fields = { commit = ["/etc/hosts", "notes.txt"], no_index = true }
effects = ["outside_path"]

[[case]]
argv = ["git", "diff", "../secret.txt", "a.txt"]
action = "diff"
fields = { commit = ["../secret.txt", "a.txt"] }
effects = ["outside_path"]

# git-diff -h: `-U[<n>]` takes only an attached value, so `-U 5` makes `5` a commit.
[[case]]
argv = ["git", "diff", "-U1"]
action = "diff"
fields = { unified = "1" }

[[case]]
argv = ["git", "diff", "-U", "5"]
action = "diff"
fields = { commit = ["5"], unified = "" }

[[case]]
argv = ["git", "diff", "--ext-diff", "HEAD"]
action = "diff"
fields = { commit = ["HEAD"], ext_diff = true }
effects = ["run_program"]

[[case]]
argv = ["git", "diff", "--output=d.patch"]
action = "diff"
fields = { output = "d.patch" }
effects = ["write_file"]

# Short flags cluster: `-wb` is `-w -b`.
[[case]]
argv = ["git", "diff", "-wb", "HEAD~2"]
action = "diff"
fields = { commit = ["HEAD~2"], ignore_all_space = true, ignore_space_change = true }

# After `--`, a word that looks like an option is a path.
[[case]]
argv = ["git", "diff", "--", "-weird"]
action = "diff"
fields = { path = ["-weird"] }

[[case]]
argv = ["git", "diff", "--word-diffs"]
action = "unmodeled"

# ---------------------------------------------------------------- blame, ls-files, rev-parse

# git-blame(1): `git blame [<rev>] [--] <file>`.
[[case]]
argv = ["git", "blame", "-L", "10,20", "src/main.rs"]
action = "blame"
fields = { file = "src/main.rs", line_range = ["10,20"] }

[[case]]
argv = ["git", "blame", "-w", "-C", "-C", "HEAD~3", "--", "lib.rs"]
action = "blame"
fields = { file = "lib.rs", find_copies = [""], ignore_whitespace = true, rev = "HEAD~3" }

[[case]]
argv = ["git", "blame", "--porcelain", "a.c"]
action = "blame"
fields = { file = "a.c", porcelain = true }

# A missing file operand, and `--contents`, which is not declared.
[[case]]
argv = ["git", "blame"]
action = "unmodeled"

[[case]]
argv = ["git", "blame", "--contents", "/etc/passwd", "a.c"]
action = "unmodeled"

[[case]]
argv = ["git", "ls-files", "-mo", "--exclude-standard"]
action = "ls_files"
fields = { exclude_standard = true, modified = true, others = true }

[[case]]
argv = ["git", "ls-files", "-z", "--", "*.rs"]
action = "ls_files"
fields = { file = ["*.rs"], null = true }

[[case]]
argv = ["git", "ls-files", "--exclude-from=.gitignore"]
action = "unmodeled"

# git-rev-parse(1): `--short[=length]` and `--abbrev-ref[=(strict|loose)]` take only an attached value.
[[case]]
argv = ["git", "rev-parse", "--abbrev-ref", "HEAD"]
action = "rev_parse"
fields = { abbrev_ref = "", arg = ["HEAD"] }

[[case]]
argv = ["git", "rev-parse", "--short=8", "HEAD"]
action = "rev_parse"
fields = { arg = ["HEAD"], short = "8" }

[[case]]
argv = ["git", "rev-parse", "--show-toplevel"]
action = "rev_parse"
fields = { show_toplevel = true }

# rev-parse `--git-dir` is the query, not the global option.
[[case]]
argv = ["git", "rev-parse", "--git-dir"]
action = "rev_parse"
fields = { show_git_dir = true }

[[case]]
argv = ["git", "rev-parse", "--verify", "-q", "refs/heads/main"]
action = "rev_parse"
fields = { arg = ["refs/heads/main"], quiet = true, verify = true }

[[case]]
argv = ["git", "rev-parse", "--parseopt", "--", "x"]
action = "unmodeled"

# ---------------------------------------------------------------- add

[[case]]
argv = ["git", "add", "-A"]
action = "add"
fields = { all = true }

[[case]]
argv = ["git", "add", "src/a.rs", "-u", "src/b.rs"]
action = "add"
fields = { pathspec = ["src/a.rs", "src/b.rs"], update = true }

[[case]]
argv = ["git", "add", "--", "-n"]
action = "add"
fields = { pathspec = ["-n"] }

[[case]]
argv = ["git", "add", "-n", "."]
action = "add"
fields = { dry_run = true, pathspec = ["."] }

[[case]]
argv = ["git", "add", "--chmod=+x", "run.sh"]
action = "add"
fields = { chmod = "+x", pathspec = ["run.sh"] }

# `--pathspec-from-file` is not declared.
[[case]]
argv = ["git", "add", "--pathspec-from-file=list.txt"]
action = "unmodeled"

[[case]]
argv = ["git", "add", "--al"]
action = "unmodeled"

# ---------------------------------------------------------------- checkout, switch, restore

# git-checkout(1): `-b <new-branch> [<start-point>]` creates a branch; git refuses paths with it.
[[case]]
argv = ["git", "checkout", "-b", "topic", "origin/main"]
action = "checkout"
fields = { create = "topic", target = "origin/main" }

# git-checkout(1): `-B` resets an existing branch to the start point.
[[case]]
argv = ["git", "checkout", "-B", "topic", "origin/main"]
action = "checkout"
fields = { force_create = "topic", target = "origin/main" }
effects = ["rewrite_history"]

# `git checkout <x>` overwrites <x> when <x> is a path; the grammar cannot tell.
[[case]]
argv = ["git", "checkout", "main"]
action = "checkout"
fields = { target = "main" }
effects = ["discard_changes"]

[[case]]
argv = ["git", "checkout", "--", "src/main.rs"]
action = "checkout"
fields = { pathspec = ["src/main.rs"] }
effects = ["discard_changes"]

[[case]]
argv = ["git", "checkout", "HEAD~1", "--", "a.txt", "b.txt"]
action = "checkout"
fields = { pathspec = ["a.txt", "b.txt"], target = "HEAD~1" }
effects = ["discard_changes"]

[[case]]
argv = ["git", "checkout", "--detach", "v1.0"]
action = "checkout"
fields = { detach = true, target = "v1.0" }

[[case]]
argv = ["git", "checkout", "-t", "origin/feature"]
action = "checkout"
fields = { target = "origin/feature", track = "" }
effects = ["override_config"]

# `-p` selects hunks to discard interactively.
[[case]]
argv = ["git", "checkout", "-p"]
action = "checkout"
fields = { patch = true }
effects = ["discard_changes"]

# A lone `-` is the previous branch.
[[case]]
argv = ["git", "checkout", "-"]
action = "checkout"
fields = { target = "-" }
effects = ["discard_changes"]

# `-f` throws away local changes; it is not declared.
[[case]]
argv = ["git", "checkout", "-f", "main"]
action = "unmodeled"

# `-U` alone means `-p` in git; not declared for checkout.
[[case]]
argv = ["git", "checkout", "-U3", "x"]
action = "unmodeled"

[[case]]
argv = ["git", "switch", "-c", "feature"]
action = "switch"
fields = { create = "feature" }

[[case]]
argv = ["git", "switch", "--create=feature", "origin/main"]
action = "switch"
fields = { branch = "origin/main", create = "feature" }

[[case]]
argv = ["git", "switch", "main"]
action = "switch"
fields = { branch = "main" }

# git-switch(1): `-f`, `--force`, `--discard-changes` throw away local changes.
[[case]]
argv = ["git", "switch", "--discard-changes", "main"]
action = "switch"
fields = { branch = "main", discard_changes = true }
effects = ["discard_changes"]

[[case]]
argv = ["git", "switch", "-fq", "main"]
action = "switch"
fields = { branch = "main", discard_changes = true, quiet = true }
effects = ["discard_changes"]

# git-switch(1): `-C` resets an existing branch.
[[case]]
argv = ["git", "switch", "-C", "topic", "main"]
action = "switch"
fields = { branch = "main", force_create = "topic" }
effects = ["rewrite_history"]

[[case]]
argv = ["git", "switch", "main", "extra"]
action = "unmodeled"

# git-restore(1): restores the working tree by default.
[[case]]
argv = ["git", "restore", "src/lib.rs"]
action = "restore"
fields = { pathspec = ["src/lib.rs"] }
effects = ["discard_changes"]

[[case]]
argv = ["git", "restore", "--source=HEAD~2", "--", "a.txt"]
action = "restore"
fields = { pathspec = ["a.txt"], source = "HEAD~2" }
effects = ["discard_changes"]

# `--staged` alone touches only the index.
[[case]]
argv = ["git", "restore", "--staged", "a.txt"]
action = "restore"
fields = { pathspec = ["a.txt"], staged = true }

[[case]]
argv = ["git", "restore", "-S", "-s", "main", "a.txt"]
action = "restore"
fields = { pathspec = ["a.txt"], source = "main", staged = true }

# `-W` together with `-S` writes the working tree; not declared.
[[case]]
argv = ["git", "restore", "-SW", "a.txt"]
action = "unmodeled"

# ---------------------------------------------------------------- reset

# git-reset(1): `--hard` discards changes in the working tree.
[[case]]
argv = ["git", "reset", "--hard"]
action = "reset"
fields = { hard = true }
effects = ["discard_changes"]

[[case]]
argv = ["git", "reset", "--hard", "HEAD"]
action = "reset"
fields = { commit = "HEAD", hard = true }
effects = ["discard_changes"]

[[case]]
argv = ["git", "reset", "--hard", "origin/main"]
action = "reset"
fields = { commit = "origin/main", hard = true }
effects = ["discard_changes", "rewrite_history"]

# `--soft HEAD~1` moves the branch, so the last commit leaves it.
[[case]]
argv = ["git", "reset", "--soft", "HEAD~1"]
action = "reset"
fields = { commit = "HEAD~1", soft = true }
effects = ["rewrite_history"]

[[case]]
argv = ["git", "reset", "@"]
action = "reset"
fields = { commit = "@" }

# With a pathspec, reset updates only the index.
[[case]]
argv = ["git", "reset", "HEAD~1", "--", "src/lib.rs"]
action = "reset"
fields = { commit = "HEAD~1", pathspec = ["src/lib.rs"] }

[[case]]
argv = ["git", "reset", "--", "HEAD"]
action = "reset"
fields = { pathspec = ["HEAD"] }

[[case]]
argv = ["git", "reset", "-p", "HEAD~1"]
action = "reset"
fields = { commit = "HEAD~1", patch = true }

[[case]]
argv = ["git", "reset", "--merge", "ORIG_HEAD"]
action = "reset"
fields = { commit = "ORIG_HEAD", merge = true }
effects = ["discard_changes", "rewrite_history"]

[[case]]
argv = ["git", "reset", "--keep", "HEAD"]
action = "reset"
fields = { commit = "HEAD", keep = true }
effects = ["discard_changes"]

[[case]]
argv = ["git", "reset", "--har"]
action = "unmodeled"

# ---------------------------------------------------------------- clean, rm, mv

# git-clean(1): `-f`, `-d`, `-x` remove untracked files, directories, and ignored files.
[[case]]
argv = ["git", "clean", "-fdx"]
action = "clean"
fields = { directories = true, force = true, ignored = true }
effects = ["delete_files"]

# `-n` shows what would be removed; it removes nothing.
[[case]]
argv = ["git", "clean", "-nfd"]
action = "clean"
fields = { directories = true, dry_run = true, force = true }

[[case]]
argv = ["git", "clean", "--dry-run", "-e", "*.log", "-e", "tmp/"]
action = "clean"
fields = { dry_run = true, exclude = ["*.log", "tmp/"] }

[[case]]
argv = ["git", "clean", "-ff", "--", "build"]
action = "clean"
fields = { force = true, pathspec = ["build"] }
effects = ["delete_files"]

[[case]]
argv = ["git", "clean", "-fZ"]
action = "unmodeled"

# git-rm(1): removes files from the working tree and the index.
[[case]]
argv = ["git", "rm", "old.txt"]
action = "rm"
fields = { pathspec = ["old.txt"] }
effects = ["delete_files"]

[[case]]
argv = ["git", "rm", "-rf", "build/"]
action = "rm"
fields = { force = true, pathspec = ["build/"], recursive = true }
effects = ["delete_files", "discard_changes"]

# `--cached` leaves the working tree alone; with `-f` it can drop staged content that matches
# neither HEAD nor the working tree (builtin/rm.c), so `-f` keeps discard_changes.
[[case]]
argv = ["git", "rm", "--cached", "-r", "-f", "secrets/"]
action = "rm"
fields = { cached = true, force = true, pathspec = ["secrets/"], recursive = true }
effects = ["discard_changes"]

[[case]]
argv = ["git", "rm", "-n", "a"]
action = "rm"
fields = { dry_run = true, pathspec = ["a"] }

[[case]]
argv = ["git", "rm"]
action = "unmodeled"

[[case]]
argv = ["git", "mv", "a.txt", "b.txt"]
action = "mv"
fields = { destination = "b.txt", source = ["a.txt"] }

[[case]]
argv = ["git", "mv", "a.c", "b.c", "src/"]
action = "mv"
fields = { destination = "src/", source = ["a.c", "b.c"] }

[[case]]
argv = ["git", "mv", "-f", "new.txt", "old.txt"]
action = "mv"
fields = { destination = "old.txt", force = true, source = ["new.txt"] }
effects = ["discard_changes"]

[[case]]
argv = ["git", "mv", "-nf", "new.txt", "old.txt"]
action = "mv"
fields = { destination = "old.txt", dry_run = true, force = true, source = ["new.txt"] }

[[case]]
argv = ["git", "mv", "only-one"]
action = "unmodeled"

# ---------------------------------------------------------------- stash

# git-stash(1): `git stash` alone is `git stash push`.
[[case]]
argv = ["git", "stash"]
action = "stash"

[[case]]
argv = ["git", "stash", "-u", "-m", "wip"]
action = "stash"
fields = { include_untracked = true, message = "wip" }

[[case]]
argv = ["git", "stash", "--", "src/a.rs"]
action = "stash"
fields = { pathspec = ["src/a.rs"] }

# builtin/stash.c: without `push`, a non-option word before `--` is refused.
[[case]]
argv = ["git", "stash", "src/a.rs"]
action = "unmodeled"

[[case]]
argv = ["git", "stash", "push", "-m", "wip", "src/a.rs"]
action = "stash_push"
fields = { message = "wip", pathspec = ["src/a.rs"] }

[[case]]
argv = ["git", "stash", "list"]
action = "stash_list"

[[case]]
argv = ["git", "stash", "show", "-p", "stash@{1}"]
action = "stash_show"
fields = { patch = true, stash = "stash@{1}" }

[[case]]
argv = ["git", "stash", "pop"]
action = "stash_pop"

[[case]]
argv = ["git", "stash", "apply", "--index", "stash@{0}"]
action = "stash_apply"
fields = { index = true, stash = "stash@{0}" }

# `drop` and `clear` delete stashed changes.
[[case]]
argv = ["git", "stash", "drop", "stash@{2}"]
action = "stash_drop"
fields = { stash = "stash@{2}" }
effects = ["discard_changes"]

[[case]]
argv = ["git", "stash", "clear"]
action = "stash_clear"
effects = ["discard_changes"]

[[case]]
argv = ["git", "stash", "branch", "rescue"]
action = "stash_branch"
fields = { branchname = "rescue" }

[[case]]
argv = ["git", "stash", "clear", "now"]
action = "unmodeled"

[[case]]
argv = ["git", "stash", "store", "abc123"]
action = "unmodeled"

# ---------------------------------------------------------------- commit

# git-commit(1): `-am` is `-a -m`, and `-m` takes the next word.
[[case]]
argv = ["git", "commit", "-am", "fix parser"]
action = "commit"
fields = { all = true, message = ["fix parser"] }

[[case]]
argv = ["git", "commit", "-mmsg"]
action = "commit"
fields = { message = ["msg"] }

[[case]]
argv = ["git", "commit", "-m", "title", "--message=body"]
action = "commit"
fields = { message = ["body", "title"] }

# A required value takes the next word even when it looks like an option.
[[case]]
argv = ["git", "commit", "-m", "--amend"]
action = "commit"
fields = { message = ["--amend"] }

# `--amend` replaces the last commit.
[[case]]
argv = ["git", "commit", "--amend", "--no-edit"]
action = "commit"
fields = { amend = true, no_edit = true }
