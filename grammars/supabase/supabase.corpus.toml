# --- independent verifier cases ---
# Written by the verifier from supabase 3.1.0 sources (tag v3.1.0: apps/cli/src/shared/cli/run.ts
# prepareCliArgs, shared/cli/remote-argv.ts joinRemoteOperands, command-internal/target/*.ts,
# command-internal/global-flags.ts, commands/**/*.command.ts and SIDE_EFFECTS.md) and the
# effect 4.1.2 cli lexer.ts and parser.ts. Each case states what the CLI does. A case that fails
# is a verifier finding (see evidence/supabase/VERIFY.md).

# CLI: a bare boolean consumes a following boolean literal (parser.ts consumeFlagValueWithTokens,
# asBooleanLiteral). `--dry-run false` pushes for real. Must not read as a dry run.
[[case]]
argv = ["supabase", "db", "push", "--remote", "--dry-run", "false"]
action = "unmodeled"

[[case]]
argv = ["supabase", "db", "push", "--dry-run=false"]
action = "unmodeled"

# CLI: the automatic negation of a boolean flag (parser.ts negatedName).
[[case]]
argv = ["supabase", "db", "push", "--no-dry-run", "--remote"]
action = "unmodeled"

# CLI: real dry run against the linked project; nothing is applied.
[[case]]
argv = ["supabase", "db", "push", "--remote", "--dry-run"]
action = "db_push"
fields = { remote = "", dry_run = true }
effects = ["remote"]

# CLI: db push takes no operand, so joinRemoteOperands makes this `--remote=prod-branch`.
[[case]]
argv = ["supabase", "db", "push", "--remote", "prod-branch"]
action = "unmodeled"

[[case]]
argv = ["supabase", "db", "push", "--remote=postgresql://u@db.example.com/postgres"]
action = "db_push"
fields = { remote = "postgresql://u@db.example.com/postgres" }
effects = ["remote", "write_remote_db"]

# CLI: hidden deprecated selectors are still parsed (target-flags.ts linkedFlag, dbUrlFlag,
# localFlag, projectRefFlag). The grammar must not read them as a local push.
[[case]]
argv = ["supabase", "db", "push", "--linked"]
action = "unmodeled"

[[case]]
argv = ["supabase", "db", "push", "--db-url", "postgresql://db.example.com/postgres"]
action = "unmodeled"

[[case]]
argv = ["supabase", "db", "reset", "--local"]
action = "unmodeled"

[[case]]
argv = ["supabase", "migration", "up", "--linked"]
action = "unmodeled"

[[case]]
argv = ["supabase", "functions", "deploy", "--project-ref", "abcdefghijklmnopqrst"]
action = "unmodeled"

[[case]]
