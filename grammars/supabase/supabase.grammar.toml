usage = "supabase [global options] storage ls [options] [<path>]"
options.recursive = { flag = ["-r", "--recursive"] }
options.remote    = { flag = ["--remote"], value = "optional", adds = ["remote"] }

# The scheme picks the direction: a `ss://` destination uploads, a `ss://` source downloads to a
# local path.
operands.path = { when = [{ like = ["TRUE", "TRUe", "TRuE", "TRue", "TrUE", "TrUe", "TruE", "True", "tRUE", "tRUe", "tRuE", "tRue", "trUE", "trUe", "truE", "true", "YES", "YEs", "YeS", "Yes", "yES", "yEs", "yeS", "yes", "ON", "On", "oN", "on", "Y", "y", "1", "false", "no", "off", "0", "n"], adds = ["ambiguous_argv"] }] }
[shell.storage_cp]
usage = "supabase [global options] storage cp [options] <src> <dst>"
options.recursive     = { flag = ["-r", "--recursive"] }
options.cache_control = { flag = ["--cache-control"], value = "required" }
options.content_type  = { flag = ["--content-type"], value = "required" }
options.jobs          = { flag = ["-j", "--jobs"], value = "required" }
options.remote        = { flag = ["--remote"], value = "optional", adds = ["remote"] }
operands.src = { like = "ss://*", adds = ["write_files"], when = [{ like = ["TRUE", "TRUe", "TRuE", "TRue", "TrUE", "TrUe", "TruE", "True", "tRUE", "tRUe", "tRuE", "tRue", "trUE", "trUe", "truE", "true", "YES", "YEs", "YeS", "Yes", "yES", "yEs", "yeS", "yes", "ON", "On", "oN", "on", "Y", "y", "1", "false", "no", "off", "0", "n"], adds = ["ambiguous_argv"] }] }
operands.dst = { like = "ss://*", adds = ["write_storage"], when = [{ like = ["TRUE", "TRUe", "TRuE", "TRue", "TrUE", "TrUe", "TruE", "True", "tRUE", "tRUe", "tRuE", "tRue", "trUE", "trUe", "truE", "true", "YES", "YEs", "YeS", "Yes", "yES", "yEs", "yeS", "yes", "ON", "On", "oN", "on", "Y", "y", "1", "false", "no", "off", "0", "n"], adds = ["ambiguous_argv"] }] }

[shell.storage_mv]
usage = "supabase [global options] storage mv [options] <src> <dst>"
adds  = ["write_storage"]
options.recursive = { flag = ["-r", "--recursive"] }
options.remote    = { flag = ["--remote"], value = "optional", adds = ["remote"] }
operands.src = { when = [{ like = ["TRUE", "TRUe", "TRuE", "TRue", "TrUE", "TrUe", "TruE", "True", "tRUE", "tRUe", "tRuE", "tRue", "trUE", "trUe", "truE", "true", "YES", "YEs", "YeS", "Yes", "yES", "yEs", "yeS", "yes", "ON", "On", "oN", "on", "Y", "y", "1", "false", "no", "off", "0", "n"], adds = ["ambiguous_argv"] }] }
operands.dst = { when = [{ like = ["TRUE", "TRUe", "TRuE", "TRue", "TrUE", "TrUe", "TruE", "True", "tRUE", "tRUe", "tRuE", "tRue", "trUE", "trUe", "truE", "true", "YES", "YEs", "YeS", "Yes", "yES", "yEs", "yeS", "yes", "ON", "On", "oN", "on", "Y", "y", "1", "false", "no", "off", "0", "n"], adds = ["ambiguous_argv"] }] }

