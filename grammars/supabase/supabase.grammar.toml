# ---------------------------------------------------------------- storage
operands.name = { when = [{ like = ["TRUE", "TRUe", "TRuE", "TRue", "TrUE", "TrUe", "TruE", "True", "tRUE", "tRUe", "tRuE", "tRue", "trUE", "trUe", "truE", "true", "YES", "YEs", "YeS", "Yes", "yES", "yEs", "yeS", "yes", "ON", "On", "oN", "on", "Y", "y", "1", "false", "no", "off", "0", "n"], adds = ["ambiguous_argv"] }] }

