# ─── workflows ─────────────────────────────────────────────────────────────────

[shell.workflows_list]
usage = "valyu [global options] workflows list [options]"
adds  = ["network"]
options.vertical = { flag = "--vertical", value = "required", when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account"] }] }
options.scope    = { flag = "--scope", value = "required", when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account"] }] }
options.search   = { flag = "--search", value = "required", when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account"] }] }
options.tag      = { flag = "--tag", value = "required", repeated = true, when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account"] }] }
options.limit    = { flag = ["-n", "--limit"], value = "required", when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account"] }] }
options.expand   = { flag = "--expand" }

[shell.workflows_get]
usage = "valyu [global options] workflows get <slug>"
adds  = ["network"]
operands.slug = { like = "-*", adds = ["option_like_value"] }

[shell.workflows_versions]
usage = "valyu [global options] workflows versions <slug>"
adds  = ["network"]
operands.slug = { like = "-*", adds = ["option_like_value"] }

# `preview` resolves a template and spends no credits (help: "without running it (no credits)").
[shell.workflows_preview]
usage = "valyu [global options] workflows preview [options] <slug>"
adds  = ["network"]
options.param       = { flag = ["-P", "--param"], value = "required", repeated = true, when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "upload_file"] }] }
options.params_file = { flag = "--params-file", value = "required", adds = ["upload_file"], when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "upload_file"] }] }
operands.slug       = { like = "-*", adds = ["option_like_value"] }

# Without `-m`, valyu sends no mode and the template's recommended mode runs, which can be heavy or
# max. `-m fast` does not remove `high_cost`: a remove always wins, and a top-level option inside a
# value can hide a second `-m max` that valyu keeps (see AUTHOR_NOTES).
[shell.workflows_run]
usage = "valyu [global options] workflows run [options] <slug>"
adds  = ["network", "spend_credits", "high_cost"]
options.param           = { flag = ["-P", "--param"], value = "required", repeated = true, when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "high_cost", "upload_file", "notify_external"] }] }
options.params_file     = { flag = "--params-file", value = "required", adds = ["upload_file"], when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "high_cost", "upload_file", "notify_external"] }] }
options.mode            = { flag = ["-m", "--mode"], value = "required", when = [{ like = ["heavy", "max"], adds = ["high_cost"] }, { like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "high_cost", "upload_file", "notify_external"] }] }
options.watch           = { flag = ["-w", "--watch"] }
options.webhook_url     = { flag = "--webhook-url", value = "required", adds = ["notify_external"], when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "high_cost", "upload_file", "notify_external"] }] }
options.alert_email     = { flag = "--alert-email", value = "required", adds = ["notify_external"], when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "high_cost", "upload_file", "notify_external"] }] }
options.alert_email_url = { flag = "--alert-email-url", value = "required", when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "high_cost", "upload_file", "notify_external"] }] }
operands.slug           = { like = "-*", adds = ["option_like_value"] }

[shell.workflows_create]
usage = "valyu [global options] workflows create [options]"
adds  = ["network", "change_workflow"]
options.file = { flag = "--file", value = "required", adds = ["upload_file"], when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "upload_file"] }] }

[shell.workflows_update]
usage = "valyu [global options] workflows update [options] <slug>"
adds  = ["network", "change_workflow"]
options.file  = { flag = "--file", value = "required", adds = ["upload_file"], when = [{ like = ["--*", "-p*", "-q*", "-v*"], adds = ["option_like_value", "other_account", "upload_file"] }] }
operands.slug = { like = "-*", adds = ["option_like_value"] }

[shell.workflows_delete]
usage = "valyu [global options] workflows delete [options] <slug>"
adds  = ["network", "delete_data"]
options.yes   = { flag = ["-y", "--yes"], adds = ["skip_prompt"] }
operands.slug = { like = "-*", adds = ["option_like_value"] }

